<style>
/* Sem fontes externas, sem requisição de rede: o argumento de privacidade é a
   ausência de servidor, e uma fonte remota o quebraria (§26). */
:root {
  --bg: #fbfaf8; --fg: #1a1a19; --fg2: #55534e; --fg3: #86837c;
  --linha: #ded9d0; --caixa: #ffffff; --realce: #f3efe7;
  --acento: #1f4f7a; --acento-fg: #ffffff;
  --ok: #1c6b45; --alerta: #8a4b12; --perigo: #9b2226; --perigo-bg: #fdf2f2;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {

    --bg: #16171a; --fg: #e8e6e1; --fg2: #a8a49c; --fg3: #7b776f;

    --acento: #6aa6dc; --acento-fg: #10131a;
    --ok: #6ec69a; --alerta: #d99a4e; --perigo: #e88; --perigo-bg: #2a1c1d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
       font-size: 16px; line-height: 1.55; }
h1, h2, h3 { line-height: 1.25; font-weight: 650; margin: 0 0 .5rem; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
p { margin: 0 0 .8rem; }
a { color: var(--acento); }
small, .mini { font-size: .82rem; color: var(--fg2); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.topo { border-bottom: 1px solid var(--linha); background: var(--caixa); position: sticky; top: 0; z-index: 5; }
.topo .in { max-width: 1180px; margin: 0 auto; padding: .6rem 1rem; display: flex; gap: 1rem;
            align-items: baseline; flex-wrap: wrap; }
.topo b { font-size: .95rem; }
.topo .mini { margin-left: auto; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

.aviso { border: 1px solid var(--linha); border-left: 4px solid var(--alerta);
         background: var(--realce); padding: .75rem .9rem; margin: 0 0 1rem; border-radius: 3px; }
.aviso.perigo { border-left-color: var(--perigo); background: var(--perigo-bg); }
.aviso h3 { color: var(--alerta); }
.aviso.perigo h3 { color: var(--perigo); }

button { font: inherit; cursor: pointer; border: 1px solid var(--linha); background: var(--caixa);
         color: var(--fg); padding: .45rem .8rem; border-radius: 4px; }
button:hover { border-color: var(--acento); }
button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
button.primario { background: var(--acento); color: var(--acento-fg); border-color: var(--acento); font-weight: 600; }
button.fantasma { border-color: transparent; color: var(--fg2); padding: .2rem .4rem; }
button.fantasma:hover { color: var(--acento); }

/* ── entrevista ─────────────────────────────────────────────────────────── */
.painel { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 900px) { .painel { grid-template-columns: 1fr; } }

.cartao { background: var(--caixa); border: 1px solid var(--linha); border-radius: 5px; padding: 1.1rem; }
.cartao + .cartao { margin-top: 1rem; }
.selo { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
        color: var(--fg2); border: 1px solid var(--linha); border-radius: 999px; padding: .1rem .55rem; }
.selo.comp { color: var(--alerta); border-color: var(--alerta); }
.selo.destaque { color: var(--acento); border-color: var(--acento); }

.pergunta { font-size: 1.3rem; font-weight: 600; margin: .6rem 0 .3rem; line-height: 1.35; }
.porque { font-size: .85rem; color: var(--fg2); border-left: 2px solid var(--linha); padding-left: .7rem; margin: .8rem 0; }
.respostas { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: 1rem; }
.respostas button { padding: .7rem .6rem; text-align: left; }
.respostas button b { display: block; }
.respostas button i { font-style: normal; font-size: .78rem; color: var(--fg2); }
@media (max-width: 560px) { .respostas { grid-template-columns: 1fr; } }

.lv { margin-top: 1rem; border: 1px dashed var(--linha); border-radius: 4px; padding: .6rem .75rem; }
.lv.ativa { border-style: solid; border-color: var(--perigo); background: var(--perigo-bg); }
.lv label { display: flex; gap: .55rem; align-items: flex-start; cursor: pointer; font-size: .88rem; }
.lv input { margin-top: .25rem; }

/* ── ranking ao vivo ────────────────────────────────────────────────────── */
table.rank { width: 100%; border-collapse: collapse; font-size: .87rem; }
table.rank td, table.rank th { padding: .3rem .35rem; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: baseline; }
table.rank th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--fg3); font-weight: 600; }

.barra i { display: block; height: 100%; background: var(--acento); }

.rastro li span { flex: 1; min-width: 0; }
.rastro li .r { color: var(--fg2); white-space: nowrap; font-family: var(--mono); font-size: .78rem; }

/* ── resultado ──────────────────────────────────────────────────────────── */
.lideres { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.lider-cartao { border: 2px solid var(--acento); border-radius: 5px; padding: .9rem; background: var(--caixa); }

.ok-cor { color: var(--ok); } .alerta-cor { color: var(--alerta); } .perigo-cor { color: var(--perigo); }
.acoes { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.2rem 0; }
pre.relatorio { white-space: pre-wrap; font-family: var(--mono); font-size: .76rem; line-height: 1.5;

.planos { width: 100%; border-collapse: collapse; font-size: .88rem; }

.oculto { display: none !important; }


/* Rodapé compartilhado pelas duas páginas. Usa apenas cores próprias, em vez das

.rodape a:hover { text-decoration: underline; }
.rodape-sep { opacity: .5; }
.rodape-lema { font-weight: 600; color: #4a4741; }
.rodape-ano { display: inline-flex; align-items: center; gap: 5px; }

/* ── recolher no celular ────────────────────────────────────────────────────
   Sem JS: o checkbox fica fora de vista e o rótulo é o botão. `display: contents`
   faz os itens de .rodape-extra participarem do flex do rodapé como se o span
   não existisse — só assim os separadores continuam alinhados na mesma linha. */
.rodape-check { position: absolute; width: 1px; height: 1px; opacity: 0;
                pointer-events: none; margin: 0; }
.rodape-extra { display: contents; }
.rodape-abrir { display: none; }

@media (max-width: 640px) {
  .rodape-in { flex-wrap: nowrap; }
  .rodape-extra { display: none; }
  .rodape-check:checked ~ .rodape-in .rodape-extra { display: contents; }
  .rodape-check:checked ~ .rodape-in { flex-wrap: wrap; }
  .rodape-abrir {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(0, 0, 0, .12); color: inherit;
    transition: transform .2s ease;
  }
  .rodape-abrir svg { width: 12px; height: 12px; }
  .rodape-check:checked ~ .rodape-in .rodape-abrir { transform: rotate(180deg); }
  .rodape-check:focus-visible ~ .rodape-in .rodape-abrir { outline: 2px solid currentColor;
                                                           outline-offset: 2px; }
}
@media (prefers-color-scheme: dark) {

}

@media (prefers-color-scheme: dark) {

<script type="module">
/**
 * Motor de alinhamento entre posições do usuário e posições declaradas em planos
 * de governo. Híbrido: ELIMINAÇÃO para o inegociável, ACUMULAÇÃO para o resto.
 *
 * Porte de `engine.js` do classificador clínico. Ver MOTOR-E-PORT-POLITICO.md.
 *
 * CONTRATO — nenhuma função deste arquivo pode quebrar isto:
 *   1. Pureza. Sem Date, sem Math.random, sem I/O, sem dependências. Todo estado
 *      é derivado de (corpus, respostas, linhasVermelhas) e recalculado do zero.
 *   2. Sem vencedor único imposto. `lideres` pode ter mais de um elemento.
 *   3. Ignorância ≠ negação. "ns" mantém a pendência e não move o score.
 *   4. Não perguntado ≠ inconclusivo ≠ indiferente. Três ausências distintas,
 *      preservadas até o relatório.
 *   5. Toda eliminação tem motivo estruturado, com a citação que a causou.
 *   6. Contraste nunca elimina. É sinal.
 *   7. Silêncio nunca soma nem subtrai; reduz `cobertura`.
 *   8. Eixo não discriminante (unânime ou unilateral) fica FORA de afinidade e
 *      cobertura, mesmo que respondido — ver §20 da especificação.
 *   9. Determinismo. Empates resolvidos lexicograficamente.
 *  10. Terminação. Toda pergunta devolvida consome uma variável não respondida.
 */

const RESPOSTAS_VALIDAS = ["concordo", "discordo", "indiferente", "ns"];

/**
 * Como cada valor é escrito para o usuário. O motor guarda "indiferente" e "ns"
 * separados porque a distinção é do contrato (invariante 4); a tela mostra os dois
 * como escolhas de não opinar, e o relatório preserva a diferença.
 */
const ROTULO_RESPOSTA = {
  concordo: "concordo", discordo: "discordo",
  indiferente: "não opinou", ns: "não soube", sim: "sim", nao: "não",
};
const rotularResposta = (v) => ROTULO_RESPOSTA[v] ?? v;
const MARGEM_PADRAO = 0.05;

const asSet = (x) => (x instanceof Set ? x : new Set(x || []));
const pesoDe = (corpus, eixo) => corpus.eixos[eixo]?.peso ?? 1;

/** Postura declarada por `cand` no `eixo`, ou null. */
function postura(cand, eixo) {
  return cand.posicoes.find((p) => p.eixo === eixo) || null;
}

/**
 * Lógica de quatro valores, análoga a `testar()` do motor clínico.
 * Devolve: true alinhado · false divergente · null neutralizado (indiferente)
 *          · undefined sem sinal (não perguntado, "ns", ou candidato mudo).
 */
function confrontar(resposta, postura) {
  if (resposta === undefined || resposta === "ns") return undefined;
  if (resposta === "indiferente") return null;
  if (!postura) return undefined;
  return (
    (resposta === "concordo" && postura.postura === "favor") ||
    (resposta === "discordo" && postura.postura === "contra")
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Eliminações — passada independente da classificação dos eixos
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Linhas vermelhas e portões. Roda ANTES de qualquer cálculo de score, porque
 * a eliminação não depende de quais eixos são discriminantes: se o usuário
 * declarou um eixo inegociável, divergir nele elimina — inclusive num eixo
 * unânime, caso em que o campo inteiro cai e §21 manda mostrar o contrafactual.
 *
 * "ns" e "indiferente" NUNCA eliminam: ignorância e indiferença não são divergência.
 */
function eliminacoes(corpus, respostas, linhasVermelhas = new Set()) {
  const lv = asSet(linhasVermelhas);
  const out = {};
  for (const cand of corpus.candidatos) {
    let motivo = null;
    for (const eixo of Object.keys(corpus.eixos)) {
      if (!lv.has(eixo)) continue;
      const p = postura(cand, eixo);
      if (confrontar(respostas[eixo], p) !== false) continue;
      motivo = { tipo: "linha-vermelha", eixo, postura: p.postura, citacao: p.citacao, interpretacao: p.interpretacao };
      break; // só a PRIMEIRA linha violada vira motivo — o relatório diz por que caiu
    }
    out[cand.id] = motivo;
  }
  for (const [id, portao] of Object.entries(corpus.portoes || {})) {
    if (portao.efeito !== "invalida-todos-se-nao") continue;
    if (respostas[id] !== "nao") continue;
    for (const cand of corpus.candidatos) {
      out[cand.id] = out[cand.id] || { tipo: "portao", portao: id, pergunta: portao.pergunta };
    }
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// Classificação dos eixos — §20
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Reparte os eixos em quatro categorias, sobre o conjunto de candidatos `vivos`:
 *   divisivo    — há favor E contra. É o único que entra no ranking.
 *   unanime     — todos os vivos falaram, todos na mesma direção.
 *   unilateral  — só parte falou, sem oposição declarada.
 *   mudo        — nenhum vivo falou.
 * Incluir unânime ou unilateral no ranking INVERTE a ordem (§20). Fora.
 */
function classificarEixos(corpus, vivos) {
  const divisivos = [], unanimes = [], unilaterais = [], mudos = [];
  for (const eixo of Object.keys(corpus.eixos)) {
    const falam = vivos.map((c) => postura(c, eixo)).filter(Boolean);
    const nFavor = falam.filter((p) => p.postura === "favor").length;
    const nContra = falam.filter((p) => p.postura === "contra").length;
    const info = { eixo, nFavor, nContra, nFalam: falam.length, mudos: vivos.length - falam.length,
                   peso: pesoDe(corpus, eixo), separacoes: nFavor * nContra };
    if (nFavor > 0 && nContra > 0) divisivos.push({ ...info, categoria: "divisivo" });
    else if (falam.length === 0) mudos.push({ ...info, categoria: "mudo", postura: null });
    else if (falam.length === vivos.length) unanimes.push({ ...info, categoria: "unanime", postura: falam[0].postura });
    else unilaterais.push({ ...info, categoria: "unilateral", postura: falam[0].postura });
  }
  return { divisivos, unanimes, unilaterais, mudos };
}

const setDe = (lista) => new Set(lista.map((x) => x.eixo));

// ─────────────────────────────────────────────────────────────────────────────
// avaliar() — score, afinidade, cobertura
// ─────────────────────────────────────────────────────────────────────────────

/**
 * avaliar(corpus, respostas, linhasVermelhas) → { [id]: estado do candidato }
 *
 * `opts.discriminantes` permite injetar o conjunto de eixos que entra no ranking
 * (usado pelo motor para congelá-lo a partir dos vivos). Sem ele, é derivado
 * dos candidatos não eliminados.
 */
function avaliar(corpus, respostas, linhasVermelhas = new Set(), opts = {}) {
  const mortos = eliminacoes(corpus, respostas, linhasVermelhas);
  const vivos = corpus.candidatos.filter((c) => !mortos[c.id]);
  const classes = opts.classes || classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const discriminantes = opts.discriminantes || setDe(classes.divisivos);

  const out = {};
  for (const cand of corpus.candidatos) {
    const acc = {
      rank: { score: 0, pesoDeclarado: 0, pesoRespondido: 0, pesoSilencioso: 0,
              alinhados: [], divergentes: [], silencios: [] },
      comp: { score: 0, pesoDeclarado: 0, pesoRespondido: 0, pesoSilencioso: 0,
              alinhados: [], divergentes: [], silencios: [] },
    };
    const inconclusivos = [], indiferentes = [];

    for (const eixo of Object.keys(corpus.eixos)) {
      const r = respostas[eixo];
      if (r === undefined) continue;
      const p = postura(cand, eixo);
      if (r === "ns") { if (p) inconclusivos.push(eixo); continue; }
      if (r === "indiferente") { if (p) indiferentes.push(eixo); continue; }
      const bucket = discriminantes.has(eixo) ? acc.rank : acc.comp;
      const peso = pesoDe(corpus, eixo);
      bucket.pesoRespondido += peso;
      if (!p) { bucket.silencios.push(eixo); bucket.pesoSilencioso += peso; continue; }
      bucket.pesoDeclarado += peso;
      if (confrontar(r, p)) { bucket.score += peso; bucket.alinhados.push(eixo); }
      else { bucket.score -= peso; bucket.divergentes.push(eixo); }
    }

    const norm = (b) => (b.pesoDeclarado ? (b.score + b.pesoDeclarado) / (2 * b.pesoDeclarado) : null);
    const cob = (b) => (b.pesoRespondido ? b.pesoDeclarado / b.pesoRespondido : null);

    out[cand.id] = {
      id: cand.id,
      estado: mortos[cand.id] ? "eliminado" : "vivo",
      motivo: mortos[cand.id] || null,
      score: acc.rank.score,
      afinidade: norm(acc.rank),
      cobertura: cob(acc.rank),
      pesoDeclarado: acc.rank.pesoDeclarado,
      pesoRespondido: acc.rank.pesoRespondido,
      pesoSilencioso: acc.rank.pesoSilencioso,
      alinhados: acc.rank.alinhados,
      divergentes: acc.rank.divergentes,
      silencios: acc.rank.silencios,
      inconclusivos,
      indiferentes,
      // Métricas dos eixos NÃO discriminantes. Nunca entram no ranking (§20);
      // existem para separar candidaturas que empatam nos eixos divisivos.
      complementar: {
        score: acc.comp.score,
        afinidade: norm(acc.comp),
        cobertura: cob(acc.comp),
        pesoDeclarado: acc.comp.pesoDeclarado,
        pesoRespondido: acc.comp.pesoRespondido,
        alinhados: acc.comp.alinhados,
        divergentes: acc.comp.divergentes,
        silencios: acc.comp.silencios,
      },
    };
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// Ranking
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Afinidade `null` (o candidato não declarou nada sobre nada que foi respondido)
 * NÃO vira 0 — fica fora da ordem, listado à parte em `semSinal`.
 */
function ranking(corpus, estados, margem = MARGEM_PADRAO) {
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const comSinal = vivos.filter((c) => estados[c.id].afinidade !== null);
  const semSinal = vivos.filter((c) => estados[c.id].afinidade === null).map((c) => c.id);
  const ord = [...comSinal].sort(
    (a, b) => estados[b.id].afinidade - estados[a.id].afinidade || a.id.localeCompare(b.id)
  );
  if (!ord.length) return { ordem: [], lideres: [], empate: false, semSinal, margem };
  const topo = estados[ord[0].id].afinidade;
  const lideres = ord.filter((c) => topo - estados[c.id].afinidade <= margem).map((c) => c.id);
  return { ordem: ord.map((c) => c.id), lideres, empate: lideres.length > 1, semSinal, margem };
}

// ─────────────────────────────────────────────────────────────────────────────
// Consenso do campo — §20
// ─────────────────────────────────────────────────────────────────────────────

/**
 * afinidadeComOCampo: o quanto o campo eleitoral INTEIRO representa o usuário,
 * medido nos eixos NÃO discriminantes — unânimes e unilaterais (§20). São eixos
 * em que o campo fala com uma voz só, então a resposta do usuário não favorece
 * ninguém: é informação sobre o campo, não sobre a disputa. Nunca entra no ranking.
 *
 * `cobertura` aqui é o peso ponderado pela fração de candidatos vivos que de fato
 * declararam a posição: 1,00 num eixo unânime, menor num unilateral. Sem ela, um
 * campo em que uma única candidatura fala pareceria um campo comprometido.
 */
function afinidadeComOCampo(corpus, respostas, classes) {
  let score = 0, peso = 0, pesoPonderado = 0, pesoTotal = 0;
  const eixos = [];
  for (const u of [...classes.unanimes, ...classes.unilaterais]) {
    const r = respostas[u.eixo];
    if (r === undefined || r === "ns" || r === "indiferente") continue;
    const alinha = (r === "concordo" && u.postura === "favor") || (r === "discordo" && u.postura === "contra");
    const w = u.peso;
    const fracao = u.nFalam / (u.nFalam + u.mudos);
    peso += w;
    pesoPonderado += w * fracao;
    pesoTotal += w;
    score += alinha ? w : -w;
    eixos.push({ eixo: u.eixo, categoria: u.categoria, postura: u.postura, resposta: r,
                 alinha, peso: w, nFalam: u.nFalam, mudos: u.mudos });
  }
  return {
    afinidade: peso ? (score + peso) / (2 * peso) : null,
    cobertura: pesoTotal ? pesoPonderado / pesoTotal : null,
    score, pesoDeclarado: peso, eixos,
    respondidos: eixos.length,
    total: classes.unanimes.length + classes.unilaterais.length,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Parada antecipada — quando a disputa já está decidida
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Intervalo em que a afinidade de cada candidatura ainda pode terminar, dadas as
 * respostas que faltam.
 *
 * A conta sai de uma identidade da §17: com `P` = peso declarado e `a` = peso
 * alinhado, `afinidade = (score + P) / (2P)` e `score = a − d`, logo
 *
 *     afinidade = a / P
 *
 * Então, se `R` é o peso ainda não respondido dos temas em que ESTA candidatura
 * declara posição, o piso é responder tudo contra ela (`a / (P+R)`) e o teto é
 * responder tudo a favor (`(a+R) / (P+R)`). Exato, não estimativa.
 *
 * RESSALVA: os limites valem para respostas comuns. Marcar um tema como
 * inegociável elimina candidaturas, e eliminar candidaturas pode tirar um tema da
 * conta (§20) — o que move os limites. Por isso `decisaoEstavel()` só é consultada
 * para PARAR de perguntar, nunca para impedir o usuário de continuar.
 */
function limitesAfinidade(corpus, respostas, estados, classes) {
  const pendentes = classes.divisivos.filter((d) => respostas[d.eixo] === undefined);
  const out = {};
  for (const cand of corpus.candidatos) {
    const s = estados[cand.id];
    const P = s.pesoDeclarado;
    const alinhado = (P + s.score) / 2;
    const R = pendentes.reduce((n, d) => n + (postura(cand, d.eixo) ? d.peso : 0), 0);
    const total = P + R;
    out[cand.id] = total
      ? { min: alinhado / total, max: (alinhado + R) / total, emJogo: R, decidido: P }
      : { min: null, max: null, emJogo: 0, decidido: 0 };
  }
  return out;
}

/**
 * A decisão está estável quando nenhuma resposta futura consegue mudar QUEM
 * lidera. Uma candidatura ainda pode liderar se o teto dela alcança o maior piso
 * do campo, descontada a margem de empate; quando esse conjunto coincide com os
 * líderes de agora, perguntar mais não muda o desfecho.
 */
function decisaoEstavel(corpus, respostas, estados, opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const classes = opts.classes || classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const lim = limitesAfinidade(corpus, respostas, estados, classes);
  const comSinal = vivos.filter((c) => lim[c.id].min !== null);
  const lideres = ranking(corpus, estados, margem).lideres;

  if (!comSinal.length) {
    const restam = classes.divisivos.filter((d) => respostas[d.eixo] === undefined).length;
    return { estavel: restam === 0, possiveis: [], lideres, emDisputa: 0, restam };
  }
  const maiorPiso = Math.max(...comSinal.map((c) => lim[c.id].min));
  const possiveis = comSinal
    .filter((c) => lim[c.id].max >= maiorPiso - margem)
    .map((c) => c.id)
    .sort();
  const restam = classes.divisivos.filter((d) => respostas[d.eixo] === undefined).length;
  const igual = possiveis.length === lideres.length &&
    [...lideres].sort().every((x, i) => x === possiveis[i]);
  return { estavel: restam === 0 || igual, possiveis, lideres, limites: lim,
           emDisputa: possiveis.length, restam };
}

// ─────────────────────────────────────────────────────────────────────────────
// Contrastes — porte direto de diferenciais(). NUNCA elimina.
// ─────────────────────────────────────────────────────────────────────────────

function contrastes(corpus, respostas, estados) {
  const vivo = (id) => estados[id]?.estado === "vivo";
  const naoInvestigados = [], investigados = [], inativos = [];
  for (const t of corpus.contrastes || []) {
    const [a, z] = t.entre;
    if (!vivo(a) || !vivo(z)) { inativos.push({ ...t, motivo: "um dos lados foi eliminado" }); continue; }
    const v = respostas[t.discriminador];
    if (v === undefined) naoInvestigados.push({ ...t, motivo: "não perguntado" });
    else if (v === "ns") naoInvestigados.push({ ...t, motivo: "resposta inconclusiva" });
    else if (v === "indiferente") naoInvestigados.push({ ...t, motivo: "declarado indiferente" });
    else investigados.push({ ...t, resposta: v, inclina: t.inclina?.[v] || null });
  }
  return { naoInvestigados, investigados, inativos };
}

// ─────────────────────────────────────────────────────────────────────────────
// proximaPergunta() — quatro fases, estritamente ordenadas
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Fase 1 — eixos divisivos, por ganho = nFavor × nContra × peso (§19).
 *          Alcance máximo é inútil aqui: um eixo unânime não separa ninguém.
 * Fase 2 — discriminadores de contraste entre dois lados vivos. Prioriza pares
 *          em que AMBOS estão na liderança: é a pergunta mais valiosa que o
 *          instrumento pode fazer (§22, regra 2).
 * Fase 3 — portões. Só entram quando já existe ranking — mas o ranking usado é
 *          o CONTRAFACTUAL SEM PORTÕES (correção do B1): um portão que elimina
 *          todos não pode impedir que os portões seguintes sejam perguntados.
 * Fase 4 — opcional (opts.complementar). Eixos não discriminantes, marcados
 *          como tal. Alimentam `afinidadeComOCampo` e a afinidade complementar;
 *          nunca o ranking.
 */
function proximaPergunta(corpus, respostas, estados, opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const base = vivos.length ? vivos : corpus.candidatos;
  const classes = opts.classes || classificarEixos(corpus, base);

  // Fase 1 — eixos divisivos
  const cands = classes.divisivos
    .filter((d) => respostas[d.eixo] === undefined && d.separacoes > 0)
    .map((d) => ({ ...d, ganho: d.separacoes * d.peso }))
    .sort((a, b) => b.ganho - a.ganho || b.peso - a.peso || a.eixo.localeCompare(b.eixo));
  if (cands.length) {
    const m = cands[0];
    // §22, regra 2: se este eixo é o discriminador de um contraste entre dois
    // líderes empatados, é a pergunta mais valiosa do instrumento. A ORDEM segue
    // o ganho (§19); o que muda é o destaque.
    const lideres = new Set(ranking(corpus, estados, margem).lideres);
    const par = (corpus.contrastes || []).find(
      (t) => t.discriminador === m.eixo && t.entre.every((id) => lideres.has(id))
    );
    return {
      tipo: "eixo", fase: 1, id: m.eixo, ...corpus.eixos[m.eixo],
      naoDiscriminante: false,
      separa: { favor: m.nFavor, contra: m.nContra, mudos: m.mudos, separacoes: m.separacoes, ganho: m.ganho },
      entreLideres: Boolean(par), desempata: par ? par.entre : null,
    };
  }

  // Fase 2 — contrastes.
  // NOTA MEDIDA: com as travas 15 e 16 do §24 em vigor, todo discriminador de
  // contraste tem posturas opostas declaradas pelos dois lados do par; se ambos
  // estão vivos, o eixo é divisivo por construção e a fase 1 já o consumiu. Esta
  // fase portanto NÃO dispara neste corpus — o valor dos contrastes está no
  // relatório ("não investigado" quando a resposta foi "ns" ou "indiferente") e no
  // destaque de desempate da fase 1. O código fica porque a arquitetura de fases
  // é do contrato do motor e um corpus com contraste em eixo não divisivo
  // (por exemplo, com as travas relaxadas) voltaria a alcançá-la.
  const { naoInvestigados } = contrastes(corpus, respostas, estados);
  const abertos = naoInvestigados.filter((t) => respostas[t.discriminador] === undefined);
  if (abertos.length) {
    const lideres = new Set(ranking(corpus, estados, margem).lideres);
    const entreLideres = abertos.find((t) => t.entre.every((id) => lideres.has(id)));
    const t = entreLideres || abertos[0];
    return {
      tipo: "contraste", fase: 2, id: t.discriminador, ...corpus.eixos[t.discriminador],
      naoDiscriminante: !setDe(classes.divisivos).has(t.discriminador),
      entre: t.entre, nota: t.nota || null, inclina: t.inclina || null,
      entreLideres: Boolean(entreLideres),
    };
  }

  // Fase 3 — portões. Gatilho lido do estado SEM portões (correção do B1).
  const semPortoes = { ...respostas };
  for (const g of Object.keys(corpus.portoes || {})) delete semPortoes[g];
  const estadosSemPortoes = avaliar(corpus, semPortoes, opts.linhasVermelhas || new Set(), { classes });
  if (ranking(corpus, estadosSemPortoes, margem).ordem.length > 0) {
    const g = Object.keys(corpus.portoes || {}).find((k) => respostas[k] === undefined);
    if (g) return { tipo: "portao", fase: 3, id: g, ...corpus.portoes[g], naoDiscriminante: false };
  }

  // Fase 4 — encerramento complementar, opcional
  if (opts.complementar) {
    const comp = [...classes.unanimes, ...classes.unilaterais]
      .filter((c) => respostas[c.eixo] === undefined)
      .sort((a, b) => b.peso - a.peso || a.eixo.localeCompare(b.eixo));
    if (comp.length) {
      const m = comp[0];
      return {
        tipo: "eixo", fase: 4, id: m.eixo, ...corpus.eixos[m.eixo],
        naoDiscriminante: true, categoria: m.categoria,
        campo: { postura: m.postura, nFalam: m.nFalam, mudos: m.mudos },
        restantes: comp.length,
      };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// analisar() — o orquestrador que a UI e o relatório consomem
// ─────────────────────────────────────────────────────────────────────────────

function analisar(corpus, respostas, linhasVermelhas = new Set(), opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const mortos = eliminacoes(corpus, respostas, linhasVermelhas);
  const vivos = corpus.candidatos.filter((c) => !mortos[c.id]);
  const classes = classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const estados = avaliar(corpus, respostas, linhasVermelhas, { classes });
  const rk = ranking(corpus, estados, margem);

  // §21, regra 3: se TODOS caíram, mostrar o ranking que existiria sem as linhas
  // vermelhas. Devolver conjunto vazio sem explicação é o pior resultado possível.
  const houveEliminacao = Object.values(estados).some((e) => e.estado === "eliminado");
  let contrafactual = null;
  if (houveEliminacao) {
    // Sem linhas vermelhas o conjunto de vivos é outro, e com ele muda a
    // classificação dos eixos: reclassificar é parte do "ranking que existiria".
    const estadosCf = avaliar(corpus, respostas, new Set());
    contrafactual = {
      estados: estadosCf,
      ranking: ranking(corpus, estadosCf, margem),
      classes: classificarEixos(corpus, corpus.candidatos),
    };
  }

  // Efeito colateral do §20 que precisa ser dito em voz alta: eliminar candidatos
  // pode deixar um eixo antes divisivo com um lado só, tirando-o do ranking. Se
  // isso zerar o conjunto discriminante, a afinidade some — e sem explicação isso
  // parece defeito.
  const respondeuAlgo = Object.keys(corpus.eixos).some((e) => {
    const r = respostas[e];
    return r !== undefined && r !== "ns" && r !== "indiferente";
  });
  const diagnostico = {
    semEixosDiscriminantes: classes.divisivos.length === 0,
    rankingVazioComRespostas: respondeuAlgo && rk.ordem.length === 0 && vivos.length > 0,
    reclassificados: houveEliminacao
      ? classificarEixos(corpus, corpus.candidatos).divisivos
          .filter((d) => !classes.divisivos.some((x) => x.eixo === d.eixo))
          .map((d) => d.eixo)
      : [],
  };

  // §22, regra 2: contrastes ainda abertos entre dois líderes empatados.
  const lideres = new Set(rk.lideres);
  const ctr = contrastes(corpus, respostas, estados);
  const desempates = ctr.naoInvestigados.filter((t) => t.entre.every((id) => lideres.has(id)));

  return {
    respostas, linhasVermelhas: [...asSet(linhasVermelhas)], margem,
    estados, ranking: rk, classes, diagnostico,
    decisao: decisaoEstavel(corpus, respostas, estados, { margem, classes }),
    contrastes: { ...ctr, desempates },
    campo: afinidadeComOCampo(corpus, respostas, classes),
    portoes: Object.fromEntries(
      Object.keys(corpus.portoes || {}).map((k) => [k, respostas[k] ?? null])
    ),
    contrafactual,
    todosEliminados: vivos.length === 0,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Rastro
// ─────────────────────────────────────────────────────────────────────────────

/** Diff entre duas análises: o que a última resposta mudou. */
function transicoes(anterior, atual) {
  const estados = [];
  for (const id of Object.keys(atual.estados)) {
    const de = anterior?.estados?.[id]?.estado ?? null;
    const para = atual.estados[id].estado;
    if (de !== para) estados.push({ id, de, para, motivo: atual.estados[id].motivo });
  }
  const ordemDe = anterior?.ranking?.ordem ?? [];
  const ordemPara = atual.ranking.ordem;
  const lideresDe = anterior?.ranking?.lideres ?? [];
  const lideresPara = atual.ranking.lideres;
  const igual = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  return {
    estados,
    ranking: { de: ordemDe, para: ordemPara, mudou: !igual(ordemDe, ordemPara) },
    lideres: { de: lideresDe, para: lideresPara, mudou: !igual(lideresDe, lideresPara) },
  };
}

function explicarMotivo(corpus, motivo) {
  if (!motivo) return null;
  if (motivo.tipo === "linha-vermelha") {
    const e = corpus.eixos[motivo.eixo];
    const dir = motivo.postura === "favor" ? "é favorável" : "é contrário";
    return `ponto inegociável · ${e?.label ?? motivo.eixo} — o plano ${dir} a essa posição`;
  }
  if (motivo.tipo === "portao") {
    // B8 corrigido: o texto vem do portão que disparou, não de uma string fixa.
    const g = corpus.portoes?.[motivo.portao];
    return `portão não atendido · ${g?.nota ?? g?.pergunta ?? motivo.portao}`;
  }
  return `eliminado · ${motivo.tipo}`;
}


/**
 * montarRelatorio() — texto puro, seções fixas, espelhando §27 etapa 7.
 *
 * Esta é a ÚNICA função do projeto com efeito de ambiente: o carimbo de tempo do
 * cabeçalho. Todo o resto vem da análise, que é pura. Passe `meta.geradoEm` para
 * tornar a saída determinística (é o que o executor de perfis faz).
 */

const pct = (x) => (x === null || x === undefined ? "—" : x.toFixed(3));
const cob = (x) => (x === null || x === undefined ? "—" : x.toFixed(2));
const linha = (n = 78) => "─".repeat(n);

function montarRelatorio(corpus, analise, rastro = [], meta = {}) {
  const L = [];
  const nome = (id) => {
    const c = corpus.candidatos.find((x) => x.id === id);
    return c ? `${c.nome}${c.partido ? ` (${c.partido})` : ""}` : id;
  };
  const eixoLabel = (id) => corpus.eixos[id]?.label ?? id;
  const geradoEm = meta.geradoEm ?? new Date().toLocaleString("pt-BR");
  const { estados, ranking: rk, classes, campo, contrastes: ctr, diagnostico } = analise;

  const e = corpus.escopo || {};
  L.push(`PALANQ · COMPARAÇÃO DE PROPOSTAS — ${e.eleicao ?? "?"}, ${e.cargo ?? "?"}, ${e.ambito ?? "?"}`);
  L.push(linha());
  L.push(`Gerado em: ${geradoEm}`);
  L.push(`Corpus: versão ${corpus.corpusVersion} · schema ${corpus.schemaVersion} · status ${corpus.status}`);
  L.push(`Curadoria: ${corpus.curadoria?.responsavel ?? "NÃO IDENTIFICADA"}` +
         (corpus.curadoria?.data ? ` · ${corpus.curadoria.data}` : "") +
         (corpus.curadoria?.revisadoPor ? ` · revisado por ${corpus.curadoria.revisadoPor}` : " · SEM REVISÃO INDEPENDENTE"));
  L.push(`Método de curadoria: ${corpus.curadoria?.metodo ?? "—"}`);
  L.push(`Critério de inclusão: ${corpus.curadoria?.criterioDeInclusao ?? "—"}`);
  if (meta.identificador) L.push(`Identificador da sessão: ${meta.identificador}`);
  L.push("");
  if (corpus.status !== "verified") { L.push(`[ATENÇÃO] ${corpus.aviso}`); L.push(""); }
  for (const lim of corpus.curadoria?.limitacoesConhecidas || []) L.push(`[LIMITAÇÃO] ${lim}`);
  if (corpus.curadoria?.limitacoesConhecidas?.length) L.push("");

  // ── RANKING ───────────────────────────────────────────────────────────────
  L.push("RANKING");
  L.push(linha());
  L.push("Afinidade mede alinhamento NOS PONTOS EM QUE OS CANDIDATOS DIVERGEM entre si —");
  L.push("não é percentual de concordância com o plano. Eixos em que o campo inteiro pensa");
  L.push("igual ficam fora da conta e aparecem em CONSENSO DO CAMPO.");
  L.push("Cobertura é a fração do que você respondeu sobre a qual o candidato se pronunciou.");
  L.push(`Margem de empate: ${rk.margem.toFixed(2)} (parâmetro; candidatos dentro dela são declarados empatados)`);
  L.push("");
  if (!rk.ordem.length) {
    L.push("  Nenhum candidato com afinidade calculável.");
    if (diagnostico?.semEixosDiscriminantes)
      L.push("  Motivo: não há eixo em que os candidatos ainda vivos divirjam entre si.");
    if (analise.todosEliminados) L.push("  Motivo: todas as candidaturas foram eliminadas. Ver ELIMINADOS e RANKING CONTRAFACTUAL.");
  }
  for (const [i, id] of rk.ordem.entries()) {
    const s = estados[id];
    const lider = rk.lideres.includes(id);
    const marca = lider ? (rk.empate ? " ⟨líder — empatado⟩" : " ⟨líder⟩") : "";
    L.push(`  ${String(i + 1).padStart(2)}. ${nome(id).padEnd(34)} afinidade ${pct(s.afinidade)}   cobertura ${cob(s.cobertura)}${marca}`);
  }
  if (rk.empate) {
    L.push("");
    L.push(`  EMPATE declarado entre: ${rk.lideres.map(nome).join(" · ")}`);
    L.push("  Não há ordem entre eles. A diferença está dentro da margem, e a margem existe");
    L.push("  porque os pesos dos eixos foram escolhidos à mão e não têm essa precisão.");
  }
  // §18, regra 3 — o líder com cobertura baixa precisa ser denunciado na mesma tela.
  const alertas = [];
  const PROXIMIDADE = 0.25;   // "logo atrás": 5× a margem padrão de empate
  for (const id of rk.lideres) {
    const s = estados[id];
    if (s.cobertura !== null && s.cobertura < 0.7)
      alertas.push(`${nome(id)} lidera com cobertura ${cob(s.cobertura)}: pronunciou-se sobre menos de 70% do peso que você respondeu.`);
    // "quem vem atrás" (§18, regra 3) é quem está logo atrás — não o campo inteiro.
    // Citar alguém com afinidade 0,21 como referência de cobertura é ruído.
    // Quem tem cobertura maior e está por perto: tanto quem vem logo atrás quanto
    // outro LÍDER empatado. Empatar com quem falou o dobro não é o mesmo empate.
    const perto = rk.ordem
      .filter((x) => x !== id)
      .filter((x) => estados[x].afinidade >= s.afinidade - PROXIMIDADE)
      .filter((x) => estados[x].cobertura !== null && s.cobertura !== null && estados[x].cobertura > s.cobertura + 0.15);
    if (perto.length) {
      const empatados = perto.filter((x) => rk.lideres.includes(x));
      const atras = perto.filter((x) => !rk.lideres.includes(x));
      if (empatados.length)
        alertas.push(`${nome(id)} está empatado com ${empatados.map(nome).join(", ")}, que se pronunciaram sobre bem mais do que você respondeu (cobertura ${empatados.map((x) => cob(estados[x].cobertura)).join(", ")} contra ${cob(s.cobertura)}). Empatar com quem falou o dobro não é o mesmo empate.`);
      if (atras.length)
        alertas.push(`${nome(id)} lidera com cobertura menor que ${atras.map(nome).join(", ")}, logo atrás — falou menos e por isso errou menos.`);
    }
  }
  if (alertas.length) {
    L.push("");
    L.push("  [SILÊNCIO — leia antes do ranking]");
    for (const a of alertas) L.push(`  · ${a}`);
  }
  if (rk.semSinal.length) {
    L.push("");
    L.push(`  Sem afinidade calculável (não declararam nada sobre o que você respondeu): ${rk.semSinal.map(nome).join(", ")}`);
    L.push("  Ausência de posição não é zero e não é concordância. Ficam fora da ordem.");
  }
  L.push("");

  // ── POR QUE / DIVERGÊNCIAS / SILÊNCIOS ────────────────────────────────────
  const comCitacao = (id, eixos) => eixos.map((ex) => {
    const c = corpus.candidatos.find((x) => x.id === id);
    const p = c.posicoes.find((q) => q.eixo === ex);
    const out = [`    · ${eixoLabel(ex)} [peso ${corpus.eixos[ex].peso}] — plano ${p.postura === "favor" ? "é favorável" : "é contrário"}`,
                 `      "${p.citacao.texto}"`,
                 `      ${p.citacao.fonte} · ${p.citacao.local}`];
    if (p.citacao.contexto) out.push(`      contexto: ${p.citacao.contexto}`);
    if (p.interpretacao) out.push(`      [INTERPRETAÇÃO DO CURADOR — a postura não é literal na citação] ${p.interpretacao}`);
    return out.join("\n");
  });

  for (const [titulo, chave, nota] of [
    ["POR QUE", "alinhados", "Eixos em que sua posição coincide com a posição declarada no plano."],
    ["DIVERGÊNCIAS", "divergentes", "Eixos em que sua posição contraria a posição declarada no plano."],
  ]) {
    L.push(titulo); L.push(linha()); L.push(nota); L.push("");
    for (const id of [...rk.ordem, ...rk.semSinal]) {
      const s = estados[id];
      if (!s[chave].length) continue;
      L.push(`  ${nome(id)}`);
      L.push(comCitacao(id, s[chave]).join("\n"));
      L.push("");
    }
  }

  L.push("SILÊNCIOS");
  L.push(linha());
  L.push("Eixos que você respondeu e sobre os quais o plano não diz nada. Não somam nem");
  L.push("subtraem — e é exatamente por isso que reduzem a cobertura. Listados nominalmente.");
  L.push("");
  for (const id of [...rk.ordem, ...rk.semSinal]) {
    const s = estados[id];
    if (!s.silencios.length) continue;
    const peso = s.silencios.reduce((n, ex) => n + corpus.eixos[ex].peso, 0);
    L.push(`  ${nome(id)} — ${s.silencios.length} eixo(s), peso ${peso}`);
    for (const ex of s.silencios) L.push(`    · ${eixoLabel(ex)} [peso ${corpus.eixos[ex].peso}]`);
  }
  L.push("");

  // ── ELIMINADOS ────────────────────────────────────────────────────────────
  const eliminados = corpus.candidatos.filter((c) => estados[c.id].estado === "eliminado");
  L.push("ELIMINADOS");
  L.push(linha());
  if (!eliminados.length) L.push("  Nenhum.");
  for (const c of eliminados) {
    const m = estados[c.id].motivo;
    L.push(`  ${nome(c.id)} — ${explicarMotivo(corpus, m)}`);
    if (m.tipo === "linha-vermelha") {
      L.push(`    ponto: ${eixoLabel(m.eixo)} [marcado por você como inegociável]`);
      L.push(`    "${m.citacao.texto}"`);
      L.push(`    ${m.citacao.fonte} · ${m.citacao.local}`);
      if (m.interpretacao) L.push(`    [INTERPRETAÇÃO DO CURADOR] ${m.interpretacao}`);
    }
  }
  if (analise.contrafactual) {
    L.push("");
    L.push("  RANKING CONTRAFACTUAL — a ordem que existiria sem nenhum ponto inegociável:");
    const cf = analise.contrafactual;
    if (!cf.ranking.ordem.length) L.push("    (nenhuma afinidade calculável)");
    for (const [i, id] of cf.ranking.ordem.entries())
      L.push(`    ${String(i + 1).padStart(2)}. ${nome(id).padEnd(34)} afinidade ${pct(cf.estados[id].afinidade)}   cobertura ${cob(cf.estados[id].cobertura)}`);
  }
  L.push("");

  // ── CONSENSO DO CAMPO ─────────────────────────────────────────────────────
  L.push("CONSENSO DO CAMPO");
  L.push(linha());
  L.push("Eixos que NÃO separam ninguém e por isso não entram no ranking — incluí-los");
  L.push("inverteria a ordem em favor de quem falou pouco (§20 da especificação).");
  L.push("");
  L.push(`  Unânimes (todos os vivos declaram a mesma coisa): ${classes.unanimes.length}`);
  for (const u of classes.unanimes)
    L.push(`    · ${eixoLabel(u.eixo)} — ${u.nFalam} candidatos, todos ${u.postura === "favor" ? "a favor" : "contrários"}`);
  L.push(`  Unilaterais (parte declara, ninguém se opõe): ${classes.unilaterais.length}`);
  for (const u of classes.unilaterais)
    L.push(`    · ${eixoLabel(u.eixo)} — ${u.nFalam} ${u.postura === "favor" ? "a favor" : "contrários"}, ${u.mudos} sem dizer nada`);
  if (classes.mudos.length) {
    L.push(`  Sem nenhuma menção: ${classes.mudos.length}`);
    for (const u of classes.mudos) L.push(`    · ${eixoLabel(u.eixo)}`);
  }
  L.push("");
  if (campo.respondidos) {
    L.push(`  AFINIDADE COM O CAMPO: ${pct(campo.afinidade)}   cobertura ${cob(campo.cobertura)}   (${campo.respondidos} de ${campo.total} eixos respondidos)`);
    L.push("  Métrica separada, que NÃO influencia o ranking. Responde outra pergunta:");
    L.push("  não \"quem é mais parecido comigo\", mas \"o quanto este campo eleitoral inteiro");
    L.push("  me representa\". Afinidade com o campo baixa significa que nenhum ranking entre");
    L.push("  estes candidatos conserta o problema.");
    const compTem = [...rk.ordem, ...rk.semSinal].filter((id) => estados[id].complementar.afinidade !== null);
    if (compTem.length) {
      L.push("");
      L.push("  Por candidato, nos eixos não discriminantes (também fora do ranking):");
      for (const id of compTem) {
        const cp = estados[id].complementar;
        L.push(`    ${nome(id).padEnd(34)} afinidade ${pct(cp.afinidade)}   cobertura ${cob(cp.cobertura)}`);
      }
      L.push("  É aqui que candidaturas empatadas nos eixos divisivos se separam.");
    }
  } else {
    L.push("  Nenhum eixo não discriminante foi respondido. A fase complementar é opcional.");
  }
  L.push("");

  // ── NÃO INVESTIGADO ───────────────────────────────────────────────────────
  L.push("NÃO INVESTIGADO");
  L.push(linha());
  L.push("Pares de candidatos vivos e próximos, e a única coisa que os separa — ainda sem");
  L.push("resposta sua. Esta seção é a defesa contra o fechamento prematuro: o instrumento");
  L.push("existe para dizer o que ficou de fora, não só o que fechou.");
  L.push("");
  if (!ctr.naoInvestigados.length) L.push("  Nenhum. Todos os contrastes ativos foram investigados.");
  for (const t of ctr.naoInvestigados) {
    const destaque = ctr.desempates?.some((d) => d.discriminador === t.discriminador && d.entre.join() === t.entre.join());
    L.push(`  ${t.entre.map(nome).join("  vs  ")}${destaque ? "   ⟨DESEMPATARIA A LIDERANÇA⟩" : ""}`);
    L.push(`    discriminador: ${eixoLabel(t.discriminador)} — ${t.motivo}`);
    if (t.nota) L.push(`    ${t.nota}`);
  }
  if (ctr.investigados.length) {
    L.push("");
    L.push("  Investigados:");
    for (const t of ctr.investigados)
      L.push(`    ${t.entre.map(nome).join(" vs ")} · ${eixoLabel(t.discriminador)} = "${rotulo(t.resposta)}" → inclina para ${t.inclina ? nome(t.inclina) : "nenhum lado"}`);
  }
  if (ctr.inativos.length) {
    L.push("");
    L.push(`  Inativos (um dos lados eliminado): ${ctr.inativos.map((t) => t.entre.map(nome).join(" vs ")).join(" · ")}`);
  }
  L.push("");

  // ── PORTÕES ───────────────────────────────────────────────────────────────
  L.push("PORTÕES");
  L.push(linha());
  for (const [id, g] of Object.entries(corpus.portoes || {})) {
    const r = analise.portoes[id];
    L.push(`  ${g.pergunta}`);
    L.push(`    resposta: ${r ? rotulo(r) : "[PENDENTE]"}   efeito: ${g.efeito}${g.efeito === "registro" ? " (apenas registro — não altera nenhum estado)" : ""}`);
  }
  L.push("");

  // ── SUAS RESPOSTAS ────────────────────────────────────────────────────────
  L.push("SUAS RESPOSTAS");
  L.push(linha());
  const lv = new Set(analise.linhasVermelhas);
  for (const [id, def] of Object.entries(corpus.eixos)) {
    const r = analise.respostas[id];
    if (r === undefined) continue;
    L.push(`  ${eixoLabel(id)} [peso ${def.peso}]${lv.has(id) ? " [INEGOCIÁVEL]" : ""}: ${rotulo(r)}`);
    if (def.explicacao) L.push(`    ${def.explicacao}`);
    if (def.formulacaoNeutra === false)
      L.push(`    [REDAÇÃO NÃO NEUTRA] ${def.notaRedacao}`);
  }
  const naoResp = Object.keys(corpus.eixos).filter((id) => analise.respostas[id] === undefined);
  if (naoResp.length) {
    L.push("");
    L.push(`  Não perguntados (${naoResp.length}): ${naoResp.map(eixoLabel).join(" · ")}`);
    L.push("  Não perguntado é diferente de ter escolhido não opinar. Nenhum dos dois pesou.");
  }
  L.push("");

  // ── RASTRO ────────────────────────────────────────────────────────────────
  L.push("RASTRO DA AVALIAÇÃO");
  L.push(linha());
  L.push("Cada resposta e o que ela mudou. É isto que permite auditar a conclusão depois.");
  L.push("");
  if (!rastro.length) L.push("  (vazio)");
  for (const [i, passo] of rastro.entries()) {
    const q = passo.pergunta;
    L.push(`  ${String(i + 1).padStart(2)}. [${q.tipo}${q.fase ? ` · fase ${q.fase}` : ""}] ${q.pergunta ?? eixoLabel(q.id)}`);
    L.push(`      resposta: ${rotulo(passo.resposta)}${passo.linhaVermelha ? " · marcado como inegociável" : ""}`);
    const tr = passo.transicoes;
    if (tr?.estados?.length)
      for (const e2 of tr.estados) L.push(`      ${nome(e2.id)}: ${e2.de} → ${e2.para}${e2.motivo ? ` (${explicarMotivo(corpus, e2.motivo)})` : ""}`);
    if (tr?.ranking?.mudou) L.push(`      ranking: ${tr.ranking.de.join(" > ") || "—"}  →  ${tr.ranking.para.join(" > ") || "—"}`);
    if (tr?.lideres?.mudou) L.push(`      líderes: ${tr.lideres.de.join(", ") || "—"}  →  ${tr.lideres.para.join(", ") || "—"}`);
    if (!tr?.estados?.length && !tr?.ranking?.mudou && !tr?.lideres?.mudou) L.push("      (nada mudou no ranking)");
  }
  L.push("");

  // ── PLANOS ────────────────────────────────────────────────────────────────
  L.push("PLANOS DE GOVERNO INTEGRAIS");
  L.push(linha());
  L.push("As citações deste relatório são resumos. Os documentos abaixo prevalecem sobre");
  L.push("qualquer coisa dita aqui. Leia o plano de quem você está considerando.");
  L.push("");
  for (const c of corpus.candidatos) L.push(`  ${nome(c.id).padEnd(34)} ${c.planoUrl ?? "—"}`);
  L.push("");

  L.push(linha());
  L.push("Este documento compara POSIÇÕES DECLARADAS EM DOCUMENTOS. NÃO RECOMENDA VOTO.");
  L.push("Ignora, por construção: histórico de mandato, capacidade de execução, coalizão,");
  L.push("financiamento de campanha e a distância conhecida entre plano de governo e governo.");
  L.push("A escolha dos eixos e das citações é o maior viés deste sistema, e ele é invisível");
  L.push("no resultado: quem decidiu quais eixos existem determinou o resultado antes da sua");
  L.push("primeira resposta.");
  return L.join("\n");
}


const CORPUS = Object.freeze({"schemaVersion":"1.0.0","corpusVersion":"0.2.0","escopo":{"eleicao":"Eleição Geral de 2026","cargo":"Presidente da República","ambito":"Brasil","turno":1},"status":"draft","aviso":"Este comparador ainda não passou por revisão independente. Todas as frases citadas são trechos reproduzidos literalmente dos planos de governo registrados, com a página indicada e um link para o documento completo. O que falta é alguém de fora conferir as escolhas de quem montou a comparação: quais temas entraram e qual trecho representa cada candidatura. Ele compara posições declaradas em documentos e NÃO recomenda voto.","curadoria":{"responsavel":null,"data":"2026-08-26","metodo":"Os planos de governo registrados das 12 candidaturas foram lidos por inteiro e percorridos tema a tema. Uma posição só entrou na comparação quando o plano a afirma por escrito; a frase citada é o próprio texto do plano, e a página é indicada ao lado. Quando a posição não está literal na frase e foi deduzida dela, a dedução aparece em destaque junto da citação, para você poder recusá-la. Não dizer nada sobre um assunto nunca foi tratado como ser contra ele.","criterioDeInclusao":"Um tema entra quando ao menos uma candidatura declara posição sobre ele por escrito. Temas em que ninguém se opõe ficam de fora do ranking — não separam ninguém — e são apresentados à parte, como retrato do que o conjunto das candidaturas pensa.","revisadoPor":null,"limitacoesConhecidas":["As frases são literais, mas a escolha delas não é: um trecho citado é sempre um trecho entre outros do mesmo plano. Nenhuma verificação automática protege contra uma escolha tendenciosa — só a revisão de alguém de fora, que esta comparação ainda não teve.","A importância atribuída a cada tema foi decidida por quem montou a comparação e não vem dos planos. Ela altera o resultado.","Planos muito curtos, ou escritos como roteiro genérico, rendem poucas posições e cobertura baixa. Isso diz respeito ao documento, não à candidatura — e a cobertura, exibida sempre ao lado da afinidade, existe para tornar essa diferença visível.","A leitura automática de PDF introduz pequenos ruídos de espaçamento. Diferenças de formatação em relação ao original são artefato dessa leitura, não alteração de conteúdo."]},"eixos":{"e_privatizacao_estatais":{"label":"Privatização de empresas estatais","pergunta":"Você concorda que o Estado venda as empresas estatais que controla hoje?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O governo é dono de empresas como Petrobras, Correios e bancos públicos. Privatizar é vendê-las a investidores. Quem defende diz que empresa privada é mais eficiente e que a venda abate dívida; quem é contra diz que o país perde controle sobre setores estratégicos e que o novo dono passa a cobrar pelo que era serviço."},"e_ppp_servicos_publicos":{"label":"PPPs e concessões em serviços públicos","pergunta":"Você concorda que serviços públicos como saúde, educação e infraestrutura sejam prestados por concessões e parcerias público-privadas?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O serviço continua público e gratuito para você, mas quem constrói e opera é uma empresa contratada, remunerada pelo Estado ou por tarifa — como já acontece em rodovias e em alguns hospitais. Discute-se se entrega mais rápido e mais barato, ou se transfere o lucro ao particular e deixa o risco com o poder público."},"e_gestao_privada_saude":{"label":"Organizações sociais e setor privado no SUS","pergunta":"Você concorda que o poder público entregue a gestão de serviços de saúde a organizações sociais e compre atendimento da rede privada?","dominio":"saude","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Em vez de contratar médicos por concurso, o poder público paga uma organização social para tocar o hospital, ou compra consultas e exames de clínicas privadas. O atendimento segue pelo SUS e de graça. Discute-se se diminui fila, ou se precariza o vínculo de quem trabalha e drena dinheiro da rede própria."},"e_ans_planos_flexiveis":{"label":"Desregulação dos planos de saúde","pergunta":"Você concorda em flexibilizar a regulação dos planos de saúde, permitindo produtos com cobertura reduzida e preço menor?","dominio":"saude","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Hoje todo plano de saúde é obrigado a cobrir uma lista mínima de procedimentos. Flexibilizar é permitir planos mais baratos que cobrem menos. Quem defende diz que dá acesso a quem não tem plano nenhum; quem é contra diz que a pessoa só descobre o que ficou de fora na hora em que adoece."},"e_ensino_civico_militar":{"label":"Escolas cívico-militares","pergunta":"Você concorda com a ampliação das escolas cívico-militares na educação básica?","dominio":"educacao","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"São escolas públicas comuns em que militares ou policiais da reserva cuidam da disciplina, do uniforme e da rotina, enquanto professores civis dão as aulas. Discute-se se isso melhora o ambiente e as notas, ou se escola não é lugar de hierarquia militar."},"e_negociado_sobre_legislado":{"label":"Negociado sobre o legislado","pergunta":"Você concorda que empregado e empregador possam negociar condições de trabalho que prevaleçam sobre o que a lei estabelece?","dominio":"trabalho","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Hoje a CLT define um piso que nenhum acordo pode rebaixar. A mudança permite que o acordo entre empresa e trabalhadores valha mais do que a lei em pontos como jornada e intervalos. Quem defende fala em flexibilidade para cada setor; quem é contra diz que quem precisa do emprego não negocia de igual para igual."},"e_estabilidade_emprego":{"label":"Estabilidade no emprego","pergunta":"Você concorda com a garantia legal de estabilidade no emprego após um período de vínculo?","dominio":"trabalho","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Depois de um tempo de casa, a empresa não poderia demitir sem justificar o motivo — como já vale para servidores concursados. Quem defende fala em segurança para planejar a vida; quem é contra diz que empresa que não pode demitir também contrata menos."},"e_renda_sem_contrapartida":{"label":"Transferência de renda sem contrapartida","pergunta":"Você concorda com programas de transferência de renda pagos sem exigência de contrapartida em trabalho ou serviço comunitário?","dominio":"social","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"É o desenho do Bolsa Família: o dinheiro entra na conta de quem está abaixo de uma linha de renda, sem exigir trabalho em troca. A alternativa é pagar mediante horas de serviço comunitário. Discute-se se a contrapartida ajuda a sair da pobreza ou se vira mão de obra barata."},"e_encarceramento_excecao":{"label":"Suspensão de garantias como política penal","pergunta":"Você concorda com a adoção de um regime prisional de exceção, com encarceramento em larga escala e restrição de garantias individuais, como política de segurança?","dominio":"seguranca","peso":3,"formulacaoNeutra":false,"notaRedacao":"Não há redação deste eixo que descreva o mecanismo sem já o qualificar: \"suspensão de garantias\" e \"regime de exceção\" são os termos usados pelas próprias candidaturas dos dois lados, e ambos carregam juízo. Marcado para revisão.","explicacao":"É o modelo aplicado em El Salvador: prender em massa e suspender temporariamente garantias como o direito de defesa e o limite de tempo sem julgamento. Não se trata de construir presídio de segurança máxima, o que quase todos defendem, mas de afrouxar as regras do processo. Quem defende aponta a queda de homicídios lá; quem é contra aponta prisões de inocentes e mortes sob custódia."},"e_autonomia_banco_central":{"label":"Autonomia do Banco Central","pergunta":"Você concorda que o Banco Central mantenha autonomia em relação ao governo para definir a política monetária?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O Banco Central define os juros básicos, e hoje seu presidente tem mandato fixo — não pode ser demitido pelo presidente da República. Acabar com a autonomia devolve essa decisão à influência do governo. Quem defende a autonomia diz que ela protege contra inflação em ano eleitoral; quem é contra diz que juro alto demais trava emprego e que ninguém elegeu quem decide."},"e_margem_equatorial":{"label":"Exploração de novas fronteiras de petróleo","pergunta":"Você concorda com a abertura de novas fronteiras de exploração de petróleo, como a Margem Equatorial?","dominio":"energia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A Margem Equatorial é a costa entre o Amapá e o Rio Grande do Norte, perto da foz do Amazonas, onde há indício de muito petróleo. Abrir a exploração é autorizar perfuração em área ambientalmente sensível. Discute-se se o país deve extrair essa riqueza enquanto ela vale algo, ou se apostar em petróleo novo contradiz o compromisso climático."},"e_reforma_agraria":{"label":"Reforma agrária e desapropriação","pergunta":"Você concorda com a continuidade da reforma agrária, com desapropriação de terras e criação de novos assentamentos?","dominio":"agrario","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O governo desapropria terras que não cumprem função social, indeniza o dono e assenta famílias sem terra. Continuar é criar novos assentamentos; parar é concentrar esforço em tornar produtivos os que já existem. Discute-se se corrige uma concentração histórica de terra ou se atrapalha a produção e estimula invasões."},"e_tributar_altas_rendas":{"label":"Tributar grandes fortunas, lucros e heranças","pergunta":"Você concorda com a criação de impostos sobre grandes fortunas, heranças e lucros e dividendos, ainda que isso eleve a carga tributária total?","dominio":"tributacao","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O Brasil cobra pouco sobre patrimônio, herança e lucro distribuído a sócios, e muito sobre consumo — o que pesa proporcionalmente mais em quem ganha menos. A proposta cria ou aumenta imposto sobre o topo. Quem defende fala em justiça e em financiar serviços; quem é contra diz que capital sai do país e que o Estado deveria gastar melhor antes de arrecadar mais."},"e_reforma_previdencia":{"label":"Nova reforma da previdência","pergunta":"Você concorda com uma nova reforma da previdência que eleve automaticamente a idade mínima de aposentadoria conforme a expectativa de vida?","dominio":"previdencia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A idade mínima para se aposentar passaria a subir sozinha, conforme os brasileiros vivem mais, sem depender de nova votação. Quem defende diz que é o que mantém a conta fechando com menos jovens contribuindo; quem é contra diz que quem faz trabalho pesado não chega inteiro a essa idade."},"e_alinhamento_brics":{"label":"Permanência no BRICS","pergunta":"Você concorda que o Brasil permaneça no BRICS e mantenha uma política externa não alinhada às grandes potências ocidentais?","dominio":"externa","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O BRICS reúne Brasil, Rússia, Índia, China e outros, como bloco fora da órbita dos Estados Unidos e da Europa. Permanecer é manter essa aposta; sair é aproximar-se do bloco ocidental. Discute-se se o país ganha mais barganhando com todos ou escolhendo um lado."},"e_licenciamento_simplificado":{"label":"Licenciamento ambiental simplificado","pergunta":"Você concorda com a simplificação do licenciamento ambiental, com prazos fixos e ritos abreviados para acelerar obras e investimentos?","dominio":"ambiental","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Antes de uma obra ou mineração começar, órgãos ambientais analisam impactos e podem exigir mudanças. Simplificar é fixar prazos curtos e dispensar etapas para projetos tidos como de menor risco. Quem defende diz que hoje obra trava por anos; quem é contra lembra que desastres recentes passaram por licenciamento abreviado."},"e_liberdade_irrestrita_redes":{"label":"Liberdade de expressão irrestrita nas redes","pergunta":"Você concorda que as plataformas digitais sejam proibidas de remover conteúdo e suspender perfis, deixando o debate correr sem moderação?","dominio":"comunicacao","peso":3,"formulacaoNeutra":false,"notaRedacao":"\"Censura\" e \"moderação\" descrevem o mesmo ato com sinais opostos, e as duas candidaturas deste eixo usam palavras diferentes para ele. A pergunta descreve o mecanismo (remover conteúdo e suspender perfis) para evitar escolher entre os dois vocabulários, mas a escolha não é neutra. Marcado para revisão.","explicacao":"Hoje as plataformas removem posts e derrubam perfis por regras próprias, e a Justiça também manda tirar conteúdo do ar. A proposta proíbe essa remoção: o que fosse ilegal se resolveria depois, com processo e indenização. Quem defende diz que nem empresa nem juiz deveria decidir o que pode ser dito; quem é contra diz que golpe, fraude e ataque coordenado se espalham antes de qualquer processo terminar."},"e_mineracao_terras_indigenas":{"label":"Mineração em terras indígenas","pergunta":"Você concorda com a regulamentação da exploração mineral dentro de terras indígenas?","dominio":"agrario","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A Constituição admite mineração em terra indígena se o Congresso aprovar uma lei regulamentando — o que nunca aconteceu, então hoje toda extração ali é ilegal. Regulamentar é criar essa lei, com regras de consulta e divisão de ganhos. Discute-se se organiza o que hoje é garimpo criminoso, ou se abre território protegido a mineradoras."},"e_reducao_jornada":{"label":"Redução legal da jornada de trabalho","pergunta":"Você concorda com a redução da jornada semanal de trabalho por lei, sem redução de salário?","dominio":"trabalho","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Reduzir por lei a jornada semanal — por exemplo, acabar com a escala de seis dias de trabalho e um de folga — mantendo o salário. Quem defende diz que a produtividade já cresceu o bastante para dividir o ganho em tempo livre; quem é contra diz que o custo por hora sobe e o emprego formal encolhe."},"e_vigilancia_massa":{"label":"Reconhecimento facial e vigilância eletrônica","pergunta":"Você concorda com o uso de reconhecimento facial e vigilância eletrônica em larga escala na segurança pública?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Câmeras nas ruas comparam rostos com bancos de dados de procurados, em tempo real. Quem defende aponta prisões de foragidos; quem é contra aponta erros de identificação — mais frequentes com pessoas negras — e o fato de todos passarem a ser filmados e conferidos o tempo todo."},"e_ministerio_seguranca":{"label":"Ministério da Segurança Pública","pergunta":"Você concorda com a criação de um ministério federal dedicado à segurança pública?","dominio":"seguranca","peso":1,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Segurança pública hoje é responsabilidade sobretudo dos estados, e a União coordena pouco. Criar o ministério dá ao governo federal comando próprio para integrar polícias, dados e fronteiras. Discute-se se resolve a falta de coordenação ou se apenas soma mais uma estrutura à que já existe."},"e_ensino_integral":{"label":"Escola em tempo integral","pergunta":"Você concorda com a ampliação da escola pública em tempo integral?","dominio":"educacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O aluno passa o dia inteiro na escola, em vez de um turno, com aulas, reforço, esporte e refeições. Quem defende fala em aprendizagem e em tirar a criança da rua; a dificuldade é custo, professor e prédio — cada vaga integral custa perto do dobro."},"e_interoperabilidade_saude":{"label":"Prontuário eletrônico integrado","pergunta":"Você concorda com a centralização de prontuários e exames em uma base nacional integrada?","dominio":"saude","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Seu histórico, exames e receitas ficariam num sistema único, acessível em qualquer posto ou hospital do país. Evita repetir exame e ajuda em emergência. A discussão é sobre quem pode ver esses dados e o que acontece se vazarem."},"e_desmilitarizacao":{"label":"Desmilitarização das polícias","pergunta":"Você concorda com a transformação das polícias militares em forças civis de policiamento de proximidade?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A polícia militar deixaria de ter estrutura, hierarquia e formação de caserna, virando polícia civil de bairro. Quem defende diz que treinamento militar produz confronto onde caberia mediação; quem é contra diz que a disciplina militar é o que sustenta uma força que atua armada na rua."},"e_isolamento_liderancas":{"label":"Isolamento de lideranças de facções","pergunta":"Você concorda com presídios federais de segurança máxima para isolar lideranças de facções e bloquear sua comunicação?","dominio":"seguranca","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Chefes de facção iriam para presídios federais longe de sua região, com visita restrita e bloqueio de celular, para não seguirem mandando no crime de dentro da cadeia. Tem apoio amplo; discute-se o custo e se o comando apenas passa para outro nome."},"e_reforma_administrativa":{"label":"Reforma administrativa e corte de ministérios","pergunta":"Você concorda com uma reforma administrativa que corte ministérios, cargos comissionados e supersalários?","dominio":"estado","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Reduzir o número de ministérios, cortar cargos de confiança e limitar salários acima do teto no funcionalismo. Quem defende fala em máquina mais barata; quem é contra diz que o corte costuma cair sobre serviço que atende gente, e não sobre os privilégios do topo."},"e_simplificacao_fiscal":{"label":"Simplificação tributária","pergunta":"Você concorda com a simplificação e a digitalização das obrigações tributárias para reduzir o custo de conformidade?","dominio":"tributacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Empresas gastam milhares de horas por ano só para calcular e declarar imposto. Simplificar é unificar regras e automatizar isso: não muda quanto se paga, muda o trabalho de pagar. É das poucas ideias com apoio quase unânime."},"e_ia_soberania_digital":{"label":"Inteligência artificial e soberania digital","pergunta":"Você concorda que o Estado invista pesadamente em inteligência artificial e infraestrutura digital própria como política nacional?","dominio":"tecnologia","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O Estado investir em centros de dados, modelos e nuvem próprios, em vez de depender de empresas estrangeiras. Quem defende fala em não ficar refém de tecnologia de fora; quem é contra questiona o custo e se o governo consegue acompanhar o ritmo do setor privado."},"e_estatizacao_setores":{"label":"Monopólio estatal em setores estratégicos","pergunta":"Você concorda com o monopólio estatal em setores estratégicos como energia, mineração e telecomunicações?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Energia, mineração, telecomunicações e bancos passariam a ser operados só pelo Estado, sem concorrência privada. É mais forte do que reestatizar uma empresa: fecha o setor inteiro. Quem defende diz que serviço essencial não deve dar lucro a ninguém; quem é contra lembra de fila, atraso e falta de investimento em monopólios estatais."},"e_auditoria_divida":{"label":"Suspensão e auditoria da dívida pública","pergunta":"Você concorda com a suspensão do pagamento da dívida pública e uma auditoria dos seus contratos?","dominio":"fiscal","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Boa parte do orçamento vai para juros e amortização da dívida pública. A proposta é suspender esses pagamentos e revisar contrato por contrato antes de retomar. Quem defende diz que esse dinheiro faltaria menos na saúde; quem é contra diz que país que suspende pagamento perde crédito e paga mais caro depois."},"e_arcabouco_fiscal":{"label":"Regras de teto de gastos","pergunta":"Você concorda com a manutenção de regras que limitam o crescimento do gasto público, como o arcabouço fiscal?","dominio":"fiscal","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"É a regra que limita quanto o gasto público pode crescer por ano, para a dívida não subir sem parar. Quem defende diz que sem limite a inflação e os juros voltam; quem é contra diz que a regra corta investimento e serviço justamente quando mais se precisa deles."},"e_controle_externo_stf":{"label":"Limitação e controle do Supremo","pergunta":"Você concorda com medidas que limitem o poder do Supremo Tribunal Federal, como mandato para ministros ou controle externo?","dominio":"justica","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Ministros do Supremo ficam no cargo até os 75 anos e são fiscalizados por eles mesmos. As propostas variam: mandato com prazo, órgão externo de correição, aval do Senado para derrubar leis. Quem defende fala em freio a decisões individuais de muito alcance; quem é contra diz que tribunal sob pressão política deixa de proteger quem é minoria."},"e_reeleicao":{"label":"Fim da reeleição no Executivo","pergunta":"Você concorda com o fim da reeleição consecutiva para presidente, governadores e prefeitos?","dominio":"politica","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Presidente, governador e prefeito não poderiam mais disputar um segundo mandato seguido. Quem defende diz que o mandatário usa a máquina para se reeleger e governa pensando na próxima eleição; quem é contra diz que tira do eleitor o direito de manter quem vai bem."},"e_emendas_parlamentares":{"label":"Controle das emendas parlamentares","pergunta":"Você concorda com a restrição e a rastreabilidade obrigatória das emendas parlamentares?","dominio":"orcamento","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Emendas são fatias do orçamento que cada parlamentar direciona para onde quiser, hoje em boa parte sem rastro de quem pediu. Restringir e rastrear é obrigar a dizer quem indicou, para onde foi e o que foi entregue. Discute-se se limita a barganha política ou se reduz o poder do Legislativo sobre o orçamento."},"e_fim_fundo_eleitoral":{"label":"Fim do fundo eleitoral e partidário","pergunta":"Você concorda com o fim do financiamento público de partidos e campanhas?","dominio":"politica","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Campanhas e partidos hoje são bancados por dinheiro público, já que doação de empresa é proibida. Acabar com o fundo faria a campanha depender só de doação de pessoas físicas. Quem defende diz que é dinheiro que faria mais falta em outro lugar; quem é contra diz que sem fundo só quem tem dinheiro ou acesso a doadores disputa."},"e_maioridade_penal":{"label":"Redução da maioridade penal","pergunta":"Você concorda com a redução da maioridade penal?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Hoje quem tem menos de 18 anos responde pelo ECA e cumpre no máximo três anos de internação. Reduzir é responder como adulto e ir para presídio comum a partir dos 16. Quem defende fala em crimes graves cometidos por adolescentes; quem é contra diz que presídio brasileiro devolve a pessoa pior do que entrou."},"e_porte_arma_rural":{"label":"Porte de arma no meio rural","pergunta":"Você concorda em ampliar o direito do produtor rural de portar arma em toda a extensão de sua propriedade?","dominio":"seguranca","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O produtor rural já pode ter arma em casa; a proposta estende o direito de andar armado por toda a extensão da propriedade, que pode ter quilômetros. Quem defende fala em socorro que demora horas para chegar; quem é contra diz que amplia o risco em conflitos por terra."},"e_homeschooling":{"label":"Educação domiciliar","pergunta":"Você concorda com a regulamentação do ensino domiciliar (homeschooling)?","dominio":"educacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A família educaria a criança em casa, sem matrícula em escola, com avaliação periódica pelo Estado. É comum nos Estados Unidos e hoje proibido no Brasil. Quem defende fala em liberdade da família; quem é contra diz que a escola também é onde a criança convive com quem é diferente e onde maus-tratos são percebidos."},"e_descriminalizacao_drogas":{"label":"Descriminalização das drogas","pergunta":"Você concorda com a descriminalização das drogas e o fim da política de guerra às drogas?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Usar e portar droga para consumo próprio deixaria de ser crime — o tráfico continuaria sendo. É o que Portugal faz desde 2001, tratando dependência como caso de saúde. Quem defende diz que a lei atual enche presídio de usuário pobre e pequeno traficante; quem é contra diz que afrouxar a lei aumenta o consumo."},"e_aborto":{"label":"Descriminalização do aborto","pergunta":"Você concorda com a descriminalização e a legalização do aborto?","dominio":"saude","peso":3,"formulacaoNeutra":false,"notaRedacao":"Tema em que a formulação da pergunta move a resposta mais do que em qualquer outro eixo do corpus. A redação adotada usa os termos da citação favorável (\"descriminalização e legalização\"); uma redação a partir do lado contrário (\"vida desde a concepção\") colheria respostas diferentes. Marcado para revisão.","explicacao":"Hoje o aborto é crime, com três exceções: risco de vida da mulher, gravidez por estupro e feto sem cérebro. Descriminalizar é deixar de ser crime; legalizar é oferecer o procedimento na rede de saúde. É o tema mais dividido deste comparador, e a forma de perguntar já influencia a resposta."},"e_cotas_trans":{"label":"Cotas e políticas para pessoas trans","pergunta":"Você concorda com cotas para pessoas trans em universidades e concursos públicos?","dominio":"social","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Reservar vagas em universidade e concurso público para pessoas trans, como já existe para candidatos negros e pessoas com deficiência. Quem defende aponta a expectativa de vida e a exclusão desse grupo do mercado formal; quem é contra diz que a seleção deveria olhar só o mérito."},"e_passe_livre":{"label":"Tarifa zero no transporte público","pergunta":"Você concorda com a tarifa zero no transporte público, custeada integralmente pelo Estado?","dominio":"transporte","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Ninguém paga passagem: o custo do ônibus e do metrô sai inteiro do orçamento público, como já acontece com escola e posto de saúde. Algumas cidades brasileiras já fazem. Discute-se se cabe no caixa e o que se deixa de financiar para pagar."},"e_plebiscito_penitenciario":{"label":"Plebiscito sobre o modelo penitenciário","pergunta":"Você concorda que o modelo penitenciário do país seja decidido por plebiscito popular?","dominio":"seguranca","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Em vez de o governo decidir sozinho como serão os presídios, a pergunta iria a voto popular. Quem defende diz que decisão desse tamanho precisa de mandato explícito; quem é contra diz que política penal por votação tende ao mais severo e que direito fundamental não se decide por maioria."},"e_fusao_municipios":{"label":"Fusão compulsória de municípios","pergunta":"Você concorda com a fusão compulsória de pequenos municípios economicamente inviáveis?","dominio":"federativo","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Municípios pequenos demais para se sustentar — que vivem de repasse e gastam quase tudo com a própria máquina — seriam fundidos a vizinhos. Quem defende fala em economia e serviço melhor; quem é contra diz que a cidade pequena perde voz e o serviço fica mais longe."},"e_unicameralismo":{"label":"Parlamento unicameral e conselhos populares","pergunta":"Você concorda com a substituição do Congresso por um parlamento unicameral com conselhos populares deliberativos?","dominio":"politica","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Acabar com o Senado e deixar uma câmara só, somada a conselhos de trabalhadores e moradores com poder de decidir. Quem defende diz que duas casas emperram e que o Senado super-representa estados pequenos; quem é contra diz que a segunda casa é freio contra decisão tomada no calor do momento."},"e_estatizacao_midia":{"label":"Estatização de grupos de comunicação","pergunta":"Você concorda com o cancelamento das concessões dos grandes grupos de mídia e a transferência de seus ativos ao controle de trabalhadores?","dominio":"comunicacao","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Cancelar as concessões de rádio e TV dos grandes grupos e passar o controle desses veículos a trabalhadores do setor. Quem defende fala em quebrar a concentração de quem informa o país; quem é contra diz que governo escolhendo quem pode transmitir é o começo da censura."},"e_saude_animal_unica":{"label":"Saúde única (humana, animal e ambiental)","pergunta":"Você concorda que a política sanitária integre saúde humana, animal e ambiental num único sistema de vigilância?","dominio":"saude","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Vigiar junto a saúde de pessoas, animais e ambiente, porque a maior parte das epidemias novas começa em animal. Na prática, é integrar veterinária, saúde pública e meio ambiente num sistema só de alerta. Há pouca controvérsia; a discussão é d

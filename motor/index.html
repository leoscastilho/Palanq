e custo e prioridade."},"e_gestao_emocional_educacao":{"label":"Educação socioemocional","pergunta":"Você concorda que o ensino básico incorpore formalmente o desenvolvimento socioemocional ao currículo?","dominio":"educacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Incluir no currículo o ensino de lidar com frustração, ansiedade e conflito, com aula e método próprios, e não só como projeto isolado da escola. Quem defende aponta o adoecimento mental de adolescentes; quem é contra diz que a escola já não dá conta do básico e que isso é papel da família."}},"portoes":{"p_apto":{"pergunta":"Você está apto a votar nesta eleição (título eleitoral em situação regular)?","nota":"Sem aptidão eleitoral a comparação não tem consequência prática. Nenhuma candidatura se sustenta como resultado.","efeito":"invalida-todos-se-nao"},"p_ciente_limites":{"pergunta":"Você entende que este instrumento compara apenas posições declaradas em documentos — ignorando histórico de mandato, capacidade de execução, coalizão e financiamento — e que ele não recomenda voto?","nota":"Portão de registro. Não altera nenhum estado; a resposta é gravada no relatório.","efeito":"registro"}},"candidatos":[{"id":"C01","nome":"Flávio Bolsonaro","partido":"PL","planoUrl":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","planoNota":"Plano de governo integral (76 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"favor","citacao":{"texto":"Evamos retomar o Programa Nacional de Desestatização com critério, avaliando caso a caso onde a presença do Estado deixou de fazer sentido.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 70 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"Também estruturaremos uma Rede Nacional de Cuidado, ampliando o apoio a idosos e pessoas com deficiência, com centros-dia e atendimento domiciliar em parcerias público privado com estados, municípios e organizações sociais.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 21 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"Vamos ampliar as Escolas Cívico-Militares, que uniram disciplina e bom desempenho onde foram implantadas, e garantir atendimento ao aluno com altas habilidades, que hoje se perde por falta de estímulo: a política nacional que trata do tema é lei mas segue sem implementação, e nós vamos tirá-la do papel.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 35 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"favor","citacao":{"texto":"Por isso defendemos o negociado sobre o legislado, ou seja, permitir que trabalhador e empresa combinem diretamente as condições de trabalho que funcionam para os dois, dentro da lei, em vez de seguir uma regra única imposta a todos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 44 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"Oesforço de simplificação continuará: menos impostos, legislação unificada, desoneração das exportações e dos investimentos e redução das exceções, para que grupos parecidos paguem impostos parecidos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 30 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida do compromisso declarado de reduzir a carga tributária total, que é incompatível com a criação de um novo tributo sobre patrimônio."},{"eixo":"e_reducao_jornada","postura":"contra","citacao":{"texto":"Situações que se repetem na discussão de jornada – onde o governo deseja ignorar a prevalência do negociado sobre o legislado – ou na discussão de situações já pacificadas pela reforma trabalhista, aprovada há quase dez anos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 45 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não rejeita a redução de jornada em si; rejeita que ela seja imposta por lei em vez de negociada. A postura \"contra\" refere-se à redução LEGAL da jornada e é inferida dessa posição."},{"eixo":"e_vigilancia_massa","postura":"favor","citacao":{"texto":"Luz, câmara, prisão Vamos implantar o Muralha Brasileira - um sistema nacional de reconhecimento facial integrado a bancos de dados criminais, inspirado no Smart Sampa, da Prefeitura de São Paulo, e no Muralha Paulista, do Governo do Estado.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 15 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"Apoiamos a escola em tempo integral, para que a criança tenha mais tempo de aprendizado, reforço e atividades formativas, e não fique entregue à própria sorte no contraturno.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 35 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Saúde digital e prontuário eletrônico único seu histórico de saúde vai com você Todos os anos, milhares de brasileiros morrem de doenças que poderiam ter sido tratadas a tempo, porque a informação sobre a própria saúde está","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 25 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_isolamento_liderancas","postura":"favor","citacao":{"texto":"Mais presídios, menos bandidos soltos O Brasil terá 5 novos presídios de segurança máxima no modelo adotado por El Salvador.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 14 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_administrativa","postura":"favor","citacao":{"texto":"Isso inclui o corte de no mínimo 10 ministérios, a redução de cargos comissionados e de despesas administrativas e o combate aos penduricalhos e supersalários que corroem o orçamento, tudo com um objetivo: mais eficiência e racionalidade para servir à sociedade.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 69 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_simplificacao_fiscal","postura":"favor","citacao":{"texto":"Oesforço de simplificação continuará: menos impostos, legislação unificada, desoneração das exportações e dos investimentos e redução das exceções, para que grupos parecidos paguem impostos parecidos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 30 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ia_soberania_digital","postura":"favor","citacao":{"texto":"Inteligência artificial a serviço do cidadão o governo se antecipa à sua necessidade Ainteligência artificial não precisa ser uma abstração distante.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 25 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"Vamos construir o equilíbrio fiscal duradouro, entregando superávits primários e limitando o crédito subsidiado com recursos do Tesouro, mitigando pressões inflacionárias.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 71 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"Fim das competências criminais originárias do STF, permitindo que parlamentares sejam julgados por instâncias inferiores, como o STJ ou os TRFs, para que exerçam seus mandatos com mais altivez, sem que isso represente qualquer contrapartida de impunidade.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 65 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"No mesmo esforço de organizar melhor o orçamento, daremos mais transparência, controle e rastreabilidade às emendas parlamentares, priorizando sua alocação em políticas públicas prioritárias do Plano Plurianual, aprovado pelo parlamento.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 69 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"Ocrime do menor não é menor Onovo governo do Brasil vai apoiar e sancionar a redução da maioridade penal de 18 para 16 anos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 13 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_aborto","postura":"contra","citacao":{"texto":"Nossos valores Nossa forma de governar permanece fiel a valores que consideramos inegociáveis e que sustentam a sociedade brasileira: o respeito à liberdade, à família, à vida desde a concepção, à propriedade privada, à democracia, à liberdade de expressão e à liberdade religiosa.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 9 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C02","nome":"Ronaldo Caiado","partido":"PSD","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","planoNota":"Plano de governo integral (100 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Ampliação das concessões e parcerias público-privadas Manter um calendário permanente e previsível de leilões (dando continuidade ao Programa de Parcerias em Investimentos, o PPI) em rodovias, ferrovias, portos, aeroportos, saneamento, energia e infraestrutura social, como hospitais, escolas e iluminação públ ica.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 47 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"mobilizar hospitais públicos, filantrópicos, universitários e privados contratados quando necessário;","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 77 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_renda_sem_contrapartida","postura":"favor","citacao":{"texto":"Transferência de renda com segurança e porta de saída Preservar os programas de transferência de renda, atualizar cadastros e combater fraude sem constranger beneficiários.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 61 de 100","url":"https://static.poder360.com.br/uplo do Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida do compromisso explícito de não recorrer a aumentos permanentes de carga tributária."},{"eixo":"e_alinhamento_brics","postura":"favor","citacao":{"texto":"Multilateralismo com resultado e aproximação com a OCDE Participar ativamente da ONU, da OMC, do G20 e do BRICS e retomar, com pragmatismo, o processo de aproximação com a OCDE.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 74 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Licenciamento ambiental com prazo e previsibilidade Dar ao licenciamento prazos definidos, procedimentos simplificados para projetos padronizados e de baixo impacto, e coordenação unificada para os projetos estruturantes.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 47 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_vigilancia_massa","postura":"favor","citacao":{"texto":"Segurança pública sem discriminação Aperfeiçoar formação, protocolos de abordagem, videomonitoramento com Inteligência Artificial (estratégias de reconhecimento facial e uso de câmeras deverão considerar toda a diversidade brasileira, com auditoria permanente e medidas para treinar, identificar e reduzir vieses raciais e enfrentar o raci smo algorítmico), supervisão e responsabilização, protegendo simultaneamente cidadãos e policiais.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 67 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ministerio_seguranca","postura":"favor","citacao":{"texto":"Implantar o Ministério da Segurança Pública e o Sistema Integrado de Proteção à Soberania Nacional","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 16 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"Esporte e educação em todas as etapas Garantir educação física de qualidade, iniciação multiesportiva, jogos escolares e acesso a atividades no contraturno e na escola de tempo integral.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 39 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Asaúde preservará os princípios do SU  registrado — Ronaldo Caiado (PSD)","local":"página 44 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"COMPROMISSO: estabilizar a dívida, reconstruir superávits, proteger o investimento e reduzir o peso dos juros sem transferir a conta aos mais pobres e sem recorrer a aumentos permanentes de carga tributária.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reeleicao","postura":"favor","citacao":{"texto":"Propor o fim da reeleição no Poder Executivo Encaminhar ao Congresso, no início do mandato, proposta de emenda à Constituição para extinguir a reeleição consecutiva para os cargos do Poder Executivo, com aplicação inclusive ao mandato presidencial iniciado em 2027.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 8 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"Reordenar as emendas parlamentares Pactuar com o Congresso critérios de planejamento, transparência, manutenção, custo total e resultado, reduzindo pulverização e impedindo que recursos escassos sejam destinados a objetos sem capacidade de operação.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"Reduzir a maioridade penal e agravar o furto de celular","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 20 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_emocional_educacao","postura":"favor","citacao":{"texto":"Adaptar o ensino à adolescência, fortalecer matemática e ciência e prevenir abandono por busca ativa e apoio socioemocional.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 33 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C03","nome":"Romeu Zema","partido":"Novo","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","planoNota":"Plano de governo integral (81 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"favor","citacao":{"texto":"RETIRARO GOVERNODE ONDE ELE NÃO É ESSENCIAL Privatizar todas as empresas estatais: Privatizar todas as empresas estatais para que o governo possa se concentrar naquilo que de fato lhe cabe, como segurança pública e educação, reduzindo o espaço para escândalos de corrupção e garantindo maior eficiência no uso dos recursos públicos e mais competição na economia brasileira.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 15 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Ampliar as parcerias público-privadas em todos os serviços públicos, inclusive saúde e educação: Aumentar o investimento privado no país por meio da ampliação das parcerias público-privadas em todos os setores da administração pública, inclusive em projetos que geram impacto direto na qualidade dos serviços e na vida da população, como saúde e educação.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 15 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"Osetor privado, que tem estrutura e capacidade ociosa, é subutilizado para desafogar o sistema público e o excesso de regulação e a judicialização encarecem a saúde suplementar e empurram ainda mais pessoas para o SUS.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 57 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ans_planos_flexiveis","postura":"favor","citacao":{"texto":"Modernizar a regulação sobre planos de saúde para ampliar opções aos pacientes: Combater entraves excessivos do marco regulatório da ANS para permitir modelos diferenciados de planos de saúde, com variações de cobertura, segmentação de serviços e mecanismos de compartilhamento de custos flexíveis, ampliando a competição no setor e as opções disponíveis aos beneficiários, para que o aumento da concorrência se traduza em mais escolhas e melhor custo-benefício para os beneficiários.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 61 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"DARÀS FAMÍLIAS MAIS LIBERDADEDE ESCOLHAE PLURALIDADEDE MODELOS EDUCACIONAIS Aumentar as opções de modelos educacionais no país: Dar mais liberdade aos pais de escolher o modelo educacional de seus filhos, facilitando a formalização de parcerias com instituições comunitárias, filantrópicas e confessionais, avançando em uma agenda de parcerias com escolas conveniadas na educação, escolas cívico-militares e regulamentando o homeschooling.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 53 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"favor","citacao":{"texto":"Por isso, propomos enfrentar esses desafios em quatro eixos principais: CRIAR UMA AL TERNATIVA FLEXÍVEL À CLT Oferecer ao trabalhador e ao empregador um regime alternativo à CLT, com mais liberdade para negociarem as regras da contratação: Permitir que trabalhador e empregador ajustem o modelo de contratação às suas preferências e à realidade de cada atividade, com prevalência do negociado sobre o legislado.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 23 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estabilidade_emprego","postura":"contra","citacao":{"texto":"Modernizar os vínculos e formas de trabalho no setor público: Flexibilizar a composição da força de trabalho do setor público, reformulando os modelos de contratação existentes e instituindo novos vínculos adaptados a diferentes necessidades, como contratos por tempo determinado para projetos específicos, vínculos por tempo indeterminado sem estabilidade ampla e definição clara dos cargos típicos de estado.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 41 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"favor","citacao":{"texto":"Abrir o setor de petróleo à concorrência: Desverticalizar a Petrobras, separando as operações de produção, refino, transporte e logística em diferentes empresas para permitir a entrada de novos concorrentes e ampliar a concorrência em igualdade de condições.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 33 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"ROMEU ZEMA | 16 CORTAROS IMPOSTOS QUE SUFOCAMO BRASILEIRO Definir metas de redução de impostos que forcem o corte efetivo de gastos: Fixar metas progressivas de redução da carga tributária que imponham os cortes de gastos necessários para atingi-las, invertendo a lógica atual em que o gasto define o imposto.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 16 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida das metas declaradas de redução progressiva da carga tributária."},{"eixo":"e_reforma_previdencia","postura":"favor","citacao":{"texto":"Por isso, defendemos um plano de ação dividido em três eixos principais: REALIZARUM CHOQUE FISCAL NOS GASTOSDO GOVERNO Reformar a Previdência de forma definitiva: Fazer uma Reforma da Previdência envolvendo estados e municípios, bem como a previdência rural e militar, criando também um mecanismo de reajuste automático da idade mínima para aposentadoria com base na expectativa de vida da população e na sustentabilidade do sistema previdenciário no longo prazo, para que as futuras gerações tenham segurança de que serão protegidas na velhice.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 14 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_alinhamento_brics","postura":"contra","citacao":{"texto":"ALINHARO BRASILÀS DEMOCRACIASE AOS MERCADOS GLOBAIS Sair do BRICS: Retirar o Brasil do BRICS de forma diplomática, preservando pragmaticamente as relações comerciais com todos os países do bloco e recusando qualquer direcionamento que comprometa valores constitucionais e democráticos do Brasil.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 37 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Reduzir entraves do licenciamento ambiental à atividade agropecuária: Garantir a implementação efetiva da Nova Lei do Licenciamento Ambiental, com prazos definidos e critérios técnicos objetivos, distinguindo os diferentes graus de impacto e simplificando o licenciamento de atividades de baixo risco, para atrair investimentos sem abrir mão da conservação ambiental.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 44 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"favor","citacao":{"texto":"Proibir a censura nas redes sociais: Vedar a exclusão de perfis e a moderação de opiniões pelas plataformas, inclusive por determinação judicial, substituindo esses mecanismos por procedimentos administrativos e judiciais que garantam direito à retratação e indenização, assegurando que o debate público no Brasil seja resolvido pela livre circulação de ideias e não pelo controle de juízes ou empresas de tecnologia.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 74 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Apesar de a maioria das unidades básicas já utilizarem o prontuário eletrônico, apenas uma pequena parte está conectada à rede nacional de dados, e o histórico do paciente se perde a cada unidade que ele procura.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 57 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_administrativa","postura":"favor","citacao":{"texto":"Na gestão de pessoas, convivemos com um setor público desigual: mais de 300 tabelas salariais só na União, uma elite do funcionalismo com prêmio salarial de 96% em relação ao setor privado e supersalários acima do teto constitucional.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 39 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_simplificacao_fiscal","postura":"favor","citacao":{"texto":"Ocaminho para o Brasil transformar esse sonho em realidade está à nossa frente: derrubar os juros, libertar as famílias das dívidas, simplificar os impostos, destravar a infraestrutura, dar segurança a quem empreende e abrir o país ao mundo Assim, o Brasil terá as condições para atrair os investimentos das novas tecnologias e transformar nossas vantagens em riqueza.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 17 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"ROMEU ZEMA | 18 DERRUBARUM DOS JUROS MAISAL TOSDO MUNDO Criar condições para a queda da taxa de juros: Garantir a queda da curva de juros por meio de um choque fiscal para estabilizar a relação dívida/PIB, promovendo reformas e mantendo superávits primários que permitam o pagamento da dívida.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 18 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"Dessa forma, apresentamos soluções em três eixos principais: LIMITARO PODERDO SUPREMO Aumentar os requisitos para indicação de ministros do STF: Robustecer os requisitos mínimos para a indicação de ministros do STF, exigindo idade mínima de 60 anos e implementando mecanismos para evitar a vinculação política dos indicados, de modo que a ida ao Supremo seja a coroação de uma carreira jurídica exemplar.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 11 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"Ao mesmo tempo, a própria estrutura do Estado abriga distorções graves: hoje, mais de 53 mil servidores ativos e inativos recebem acima do teto constitucional, com custo anual estimado em cerca de R$ 20 bilhões, enquanto o orçamento público segue sendo desviado para privilégios e fins eleitorais, com bilhões em emendas parlamentares distribuídas sem transparência adequada.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 8 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_fim_fundo_eleitoral","postura":"favor","citacao":{"texto":"Extinguir o Fundo Partidário e o Fundo Eleitoral: Extinguir o Fundo Partidário e o Fundo Eleitoral, substituindo-os por um modelo de financiamento privado de campanhas, com doações permitidas por pessoas físicas e jurídicas, havendo critérios rígidos de transparência, rastreabilidade e limites que preservem a justa competição entre os candidatos.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 75 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"REDUZIRA MAIORIDADE PENALE ENDURECERA LEGISLAÇÃO Reduzir a maioridade penal para 16 anos ou menos: Reduzir a maioridade penal para 16 anos, assegurando a responsabilização criminal de adolescentes a partir dessa idade e permitindo, excepcionalmente, a imputação penal de pessoas ainda mais jovens nos casos de crimes graves, como homicídio e estupro, ou reincidência.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 6 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_porte_arma_rural","postura":"favor","citacao":{"texto":"DEFENDERA PROPRIEDADE RURAL Garantir o porte de armas em toda a extensão da propriedade rural e o direito à autodefesa do produtor: Consolidar e ampliar o direito do produtor rural de portar arma em toda a extensão de sua propriedade, avançando para além da posse estendida já prevista em lei, com segurança jurídica para o exercício da legítima defesa e proteção efetiva do Estado contra invasões.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 45 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_homeschooling","postura":"favor","citacao":{"texto":"DARÀS FAMÍLIAS MAIS LIBERDADEDE ESCOLHAE PLURALIDADEDE MODELOS EDUCACIONAIS Aumentar as opções de modelos educacionais no país: Dar mais liberdade aos pais de escolher o modelo educacional de seus filhos, facilitando a formalização de parcerias com instituições comunitárias, filantrópicas e confessionais, avançando em uma agenda de parcerias com escolas conveniadas na educação, escolas cívico-militares e regulamentando o homeschooling.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 53 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C04","nome":"Renan Santos","partido":"Missão","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","planoNota":"Plano de governo integral (51 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Agovernança desses polos opera por meio de Parcerias Público-Privadas (Lei 11.079/2004) e, quando cruzar fronteiras estaduais, de Consórcios Públicos (Lei 11.107/2005), com previsão de expansão para outros estados.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 36 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano critica explicitamente a fórmula de \"privatizar tudo\" (p. 5). A postura \"favor\" aqui vale para PPPs como instrumento de governança, que o plano adota, e NÃO para privatização como programa — por isso a candidatura não aparece no eixo de privatização de estatais."},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"Amilitarização das escolas deve ser vista como uma medida provisória, a fim de estancar a violência endêmica, em especial nas regiões com alta criminalidade no entorno.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 32 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"favor\" é qualificada na própria citação: o plano trata a militarização escolar como medida provisória e localizada, não como modelo educacional."},{"eixo":"e_renda_sem_contrapartida","postura":"contra","citacao":{"texto":"Traduzimos as ideias à nossa realidade política e adicionamos também outros temas de interesse, em especial o projeto de reforma do assistencialismo, com a substituição do Bolsa Família por um programa de Frentes Cidadãs que incentive a inserção dos beneficiários ao mercado formal de trabalho.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 21 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_encarceramento_excecao","postura":"favor","citacao":{"texto":"As lideranças condenadas serão deslocadas a superpresídios de segurança máxima em regiões remotas, no modelo do CECOT salvadorenho, equipados com blindagem eletromagnética e biometria contínua, neutralizando o comando das facções a partir do cárcere.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 13 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"contra","citacao":{"texto":"Ogoverno da Missão não criará um único novo assentamento enquanto os já existentes não atingirem níveis de produtividade compatíveis com os exigidos dos demais imóveis rurais brasileiros.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 42 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Racionalização e simplificação dos processos de licenciamento ambiental para a exploração dos minérios, com base na nova Lei Geral do Licenciamento Ambiental (Lei nº 15.190/2025, em vigor desde fevereiro de 2026).","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 39 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"favor","citacao":{"texto":"e construir, no Congresso, o marco da exploração mineral controlada em terras indígenas, que abrigam reservas estratégicas de fosfato e potássio.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 42 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_vigilancia_massa","postura":"favor","citacao":{"texto":"Um novo sistema de drones e totens de denúncia transformará a reação ao crime em prevenção, com patrulhamento autônomo e reconhecimento facial em tempo real, integrado ao uso de dados genéticos e identificação facial para a resolução de crimes hediondos.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 13 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","r ode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_autonomia_banco_central","postura":"contra","citacao":{"texto":"Agiremos para promover a revogação do Arcabouço Fiscal, da Lei de Responsabilidade Fiscal, da Lei das Estatais (13.303/2016), a retomada do Banco Central (fim da autonomia), desmontando todo fiscalismo e arcabouço jurídico e institucional neoliberal","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"contra","citacao":{"texto":"No lugar da exploração da Margem Equatorial, defendemos pesquisas e buscas em outras áreas e uma melhor exploração do Pré-Sal, reduzindo os lucros e a extração desenfreada, que visam apenas beneficiar o grande capital, drenando nossas reservas e encarecendo produtos e serviços.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 14 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"favor","citacao":{"texto":"No campo, realizaremos a reforma agrária popular, e todos os latifúndios improdutivos, áreas de trabalho escravo ou as fazendas que não cumpram sua função social serão desapropriados sem indenização.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"favor","citacao":{"texto":"Reforma tributária: redução da tributação sobre o consumo, com cobrança progressiva de impostos, de acordo com o rendimento de cada contribuinte, além da criação de um imposto especial sobre lucros e dividendos, grandes fortunas, transações financeiras e heranças.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 14 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_previdencia","postura":"contra","citacao":{"texto":"Uma política econômica anticapitalista Revogação de todas as contrarreformas neoliberais, como a previdenciária e a trabalhista e do Arcabouço Fiscal, bem como da autonomia do Banco Central.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"contra","citacao":{"texto":"Defendemos a forte regulação das Big Techs e redes sociais imperialistas e o monopólio estatal das telecomunicações, da telefonia e da internet, com incentivo à criação de cooperativas dos trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Demarcação e proteção integral de todos os territórios indígenas, que serão geridos por conselhos populares dos povos originários.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não menciona a regulamentação da mineração em terras indígenas. A postura \"contra\" é inferida da defesa de proteção integral dos territórios sob gestão dos próprios povos originários."},{"eixo":"e_reducao_jornada","postura":"favor","citacao":{"texto":"C) Propomos reformas estruturais nas áreas sociais e do mundo do trabalho, com a implantação da jornada de 30 horas semanais sem redução salarial e o fim da escala 6x1;","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 2 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ministerio_seguranca","postura":"contra","citacao":{"texto":"Segurança dos Direitos no lugar da velha “Segurança Pública” Asegurança pública será desmilitarizada e reorganizada sob o marco civil, com controle social substituindo uma política e um ministério de segurança pública para uma política de segurança dos direitos, com base na criminologia crítica e no acúmulo político e programático dos movimentos negros e populares.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"contra\" é inferida da proposta de substituir a política e o ministério de segurança pública por uma \"política de segurança dos direitos\" sob marco civil."},{"eixo":"e_desmilitarizacao","postura":"favor","citacao":{"texto":"Ogoverno do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a completa desmilitarização da segurança pública, com unificação das polícias e instituição do ciclo completo junto com a desvinculação das forças de segurança do exército, sob bases curriculares e formativas completamente reestruturadas numa lógica democrática.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_setores","postura":"favor","citacao":{"texto":"Defendemos a forte regulação das Big Techs e redes sociais imperialistas e o monopólio estatal das telecomunicações, da telefonia e da internet, com incentivo à criação de cooperativas dos trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_auditoria_divida","postura":"favor","citacao":{"texto":"Adívida pública será reestruturada e seu passivo será substituído por títulos de longo prazo.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"contra","citacao":{"texto":"Agiremos para promover a revogação do Arcabouço Fiscal, da Lei de Responsabilidade Fiscal, da Lei das Estatais (13.303/2016), a retomada do Banco Central (fim da autonomia), desmontando todo fiscalismo e arcabouço jurídico e institucional neoliberal","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"O Judiciário também será democratizado, com mandatos por tempo definido para os Tribunais Regionais e Superiores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_descriminalizacao_drogas","postura":"favor","citacao":{"texto":"Ogoverno do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a comp nselhos Populares, eleitos nos locais de trabalho, moradia e estudo, como instrumentos permanentes de participação popular.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_midia","postura":"favor","citacao":{"texto":"Ogoverno popular realizará a democratização dos meios de comunicação, com a transformação dos monopólios privados de comunicações em cooperativas dos trabalhadores e o fortalecimento da Empresa Brasileira de Comunicação (EBC), sob a direção de um Conselho de Trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C11","nome":"Hertz Dias","partido":"PSTU","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","planoNota":"Plano de governo integral (33 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"contra","citacao":{"texto":"Até mesmo o saneamento básico está sendo entregue aos grupos estrangeiros, num sentido inverso a diversos países da Europa que hoje estão sendo obrigados a reverterem uma série de privatizações do setor de saneamento.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 2 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ppp_servicos_publicos","postura":"contra","citacao":{"texto":"Avançam processos de privatização e concessão de metrôs, estradas e ferrovias, aprofundando a mercantilização da mobilidade.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 13 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"contra","citacao":{"texto":"Defesa do sus público, universal, gratuito e 100% estatal Fim da privatização e da gestão privada da saúde (OS, Fundações e PPP) Proibição da transferência de leitos públicos para planos privados Ampliação do investimento público em saúde, com prioridade para a atenção básica Cuidado com a saúde mental: ampliação do investimento público nos Centros de Atenção Psicossocial (Caps), no Serviço de Residências Terapêuticas e Centros de Convivência.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 11 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"contra","citacao":{"texto":"Não à militarização das escolas e a projetos de controle ideológico, como Escola Sem Partido!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 12 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"contra","citacao":{"texto":"Revogação da reforma trabalhista Revogação da lei das terceirizações.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_encarceramento_excecao","postura":"contra","citacao":{"texto":"Da mesma forma, exigir o fim da matança e do encarceramento em massa da juventude pobre e negra, a desmilitarização da PM, a eleição de delegados pelas comunidades e o controle popular da segurança significa enfrentar o braço armado do Estado burguês nas periferias, assim como as relações entre repressão, milícias, tráfico, poder econômico e poder político.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 30 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"contra","citacao":{"texto":"Não à exploração do petróleo da Margem Equatorial!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 15 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"favor","citacao":{"texto" Plano de governo registrado — Hertz Dias (PSTU)","local":"página 23 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Reparação e demarcação imediata das terras indígenas, titulação dos territórios quilombolas e proteção das comunidades tradicionais Reconhecimento e reparação das populações atingidas por crimes ambientais Garantia do direito à autodefesa de todas as comunidades e militantes que lutam em defesa do meio ambiente diante da violência patronal e estatal.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 15 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não menciona a regulamentação da mineração em terras indígenas. A postura \"contra\" é inferida da defesa de demarcação imediata e proteção das comunidades tradicionais."},{"eixo":"e_reducao_jornada","postura":"favor","citacao":{"texto":"Fim da escala 6×1 sem redução de salários e direitos, sem pejotização e sem demissões Redução da jornada de trabalho para 36 horas, sem redução dos salários e sem flexibilização de direitos, rumo à escala móvel de horas de trabalho (pleno emprego).","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"Creches e escolas públicas, gratuitas e em tempo integral para todas as crianças, como condição para a independência das mulheres Restaurantes populares e lavanderias públicas em todos os bairros Ampliação dos serviços públicos de cuidado (idosos, pessoas com necessidades especiais) retirando das mulheres essa sobrecarga.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 23 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_desmilitarizacao","postura":"favor","citacao":{"texto":"Contra a redução da maioridade penal Desmilitarização da pm e unificação das polícias sob controle dos trabalhadores Revogação da Lei Antidrogas e fim da privatização dos presídios.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 21 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_setores","postura":"favor","citacao":{"texto":"Suspensão do pagamento da dívida pública aos grandes investidores e auditoria Fim a Lei de Responsabilidade Fiscal Aestatização do sistema financeiro e centralização do crédito em um banco único é essencial para planejar a economia e garantir o controle de capitais.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 28 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"favor\" é inferida das propostas de estatização setorial declaradas ao longo do plano (transporte, ouro, plataformas), não de uma formulação geral de monopólio estatal."},{"eixo":"e_auditoria_divida","postura":"favor","citacao":{"texto":"Suspensão do pagamento da dívida pública aos grandes investidores e auditoria Fim a Lei de Responsabilidade Fiscal Aestatização do sistema financeiro e centralização do crédito em um banco único é essencial para planejar a economia e garantir o controle de capitais.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 28 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"contra","citacao":{"texto":"Mantém o arcabouço fiscal e a agiotagem escandalosa do pagamento da dívida, preserva os lucros dos bilionários, concede subsídios às multinacionais e submete o país às exigências do imperialismo.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 4 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_descriminalizacao_drogas","postura":"favor","citacao":{"texto":"Descriminalização das drogas e revogação da Lei Antidrogas, para efetivamente combater e acabar com o narcotráfico, junto com políticas públicas de prevenção, tratamento e redução de danos.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 19 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_cotas_trans","postura":"favor","citacao":{"texto":"Cotas trans nas universidades e concursos públicos, rumo ao pleno emprego!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 25 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_passe_livre","postura":"favor","citacao":{"texto":"Hoje, setores empresariais passam a defender a tarifa zero como forma de ampliar subsídios estatais, garantindo lucros sem assegurar qualidade, expansão da rede ou condições dignas de trabalho.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 13 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C12","nome":"Rui Costa Pimenta","partido":"PCO","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_PCO_Rui_Costa_Pimenta2026.pdf","planoNota":"Plano de governo integral (7 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"contra","citacao":{"texto":"É preciso cancelar a venda do patrimônio do povo brasileiro e reestatizar todas as empresas entregues ao capital estrangeiro por verdadeiros lesa-pátria.","fonte":"Plano de governo registrado — Rui Costa Pimenta (PCO)","local":"página 3 de 7","url":"https://static.poder360.com.br/

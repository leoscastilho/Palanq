/* Palanq — versão de cartões. Sem requisição de rede: a fonte vem embutida (fonte.css).
   Tema: os tokens claros vivem em :root; os escuros valem quando o sistema pede
   (e ninguém escolheu "claro" à mão) ou quando o botão da barra escolheu "escuro". */
:root {
  color-scheme: light;
  --bg: #ffffff; --caixa: #ffffff; --realce: #f2f4f6; --linha: #e4e7eb;
  --fg: #111418; --fg2: #4a535f; --fg3: #626c79;
  /* marca: coral → rosa. --botao é a mesma dupla, mais funda, para o texto branco
     em cima dela passar de 4.5:1 — a versão viva fica para o que é decoração. */
  --marca1: #fd267a; --marca2: #ff6036;
  --botao1: #e5125a; --botao2: #d93a17;
  --acento: #e5125a;
  /* respostas: a cor "texto" aguenta letra miúda em cima do fundo; a "viva" é para
     ícone, carimbo e barra, que são grandes. */
  --sim: #0a7f4e; --sim-vivo: #0ea765;
  --nao: #e8163f; --nao-vivo: #f0284f;
  --ine: #0b62c8; --ine-vivo: #1786ff;
  --pular: #626c79; --pular-vivo: #7c8794;
  --sobre: #ffffff;   /* texto e ícone em cima de um preenchimento vivo */
  /* cartão: luminosidade e croma OKLCH do degradê por tema; o matiz vem do JS */
  --cartao-l1: .55; --cartao-l2: .40; --cartao-c: .13;
  --sombra: 0 14px 36px rgb(17 20 24 / .14), 0 2px 6px rgb(17 20 24 / .06);
  --sombra-botao: 0 4px 12px rgb(17 20 24 / .10), 0 1px 2px rgb(17 20 24 / .06);
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111418; --caixa: #1a1f27; --realce: #1f252e; --linha: #2a313b;
    --fg: #f3f5f7; --fg2: #a9b1bc; --fg3: #8e97a3;
    --sim: #3ee6a0; --sim-vivo: #3ee6a0;
    --nao: #ff5c74; --nao-vivo: #ff5c74;
    --ine: #4d9eff; --ine-vivo: #4d9eff;
    --pular: #8e97a3; --pular-vivo: #8e97a3;
    --sobre: #111418;
    --acento: #fd267a;
    --cartao-l1: .50; --cartao-l2: .34; --cartao-c: .12;
    --sombra: 0 16px 40px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
    --sombra-botao: 0 4px 14px rgb(0 0 0 / .45), 0 1px 2px rgb(0 0 0 / .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111418; --caixa: #1a1f27; --realce: #1f252e; --linha: #2a313b;
  --fg: #f3f5f7; --fg2: #a9b1bc; --fg3: #8e97a3;
  --sim: #3ee6a0; --sim-vivo: #3ee6a0;
  --nao: #ff5c74; --nao-vivo: #ff5c74;
  --ine: #4d9eff; --ine-vivo: #4d9eff;
  --pular: #8e97a3; --pular-vivo: #8e97a3;
  --sobre: #111418;
  --acento: #fd267a;
  --cartao-l1: .50; --cartao-l2: .34; --cartao-c: .12;
  --sombra: 0 16px 40px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .3);
  --sombra-botao: 0 4px 14px rgb(0 0 0 / .45), 0 1px 2px rgb(0 0 0 / .3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
/* coluna flexível: a tela cresce, o rodapé fica embaixo dela — e não fora da
   página, como acontecia com body { height: 100% }. */
body {
  margin: 0; min-height: 100%; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg); font-family: var(--sans);
  font-size: 16px; line-height: 1.5; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
::selection { background: color-mix(in srgb, var(--marca1) 28%, transparent); }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
p { margin: 0 0 .8rem; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
:focus-visible { outline: 2px solid var(--ine-vivo); outline-offset: 3px; }
.mini { font-size: .84rem; color: var(--fg2); line-height: 1.45; }
.oculto { display: none !important; }

.tela { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center;
        padding: .75rem 1rem 1rem; max-width: 600px; margin: 0 auto; width: 100%; }
/* A coluna dos cartões é a largura de um telefone mesmo no desktop: o cartão é um
   objeto que se segura com a mão, não uma página. */
.tela[data-tela="cartoes"] { max-width: 480px; min-height: 100dvh; padding-bottom: .6rem; }

/* ── barra do topo ────────────────────────────────────────────────────────── */
.barra-topo { width: 100%; display: flex; align-items: center; gap: .75rem;
              padding: .15rem 0 .9rem; min-height: 44px; }
.marca { display: inline-flex; align-items: center; gap: .4rem; font-weight: 800;
         letter-spacing: -.03em; font-size: 1.2rem; color: var(--marca1); text-decoration: none; }
.marca svg { width: 22px; height: 22px; flex: 0 0 auto; }
/* o nome leva o degradê da marca — é o logotipo, não ênfase */
.marca span { background: linear-gradient(90deg, var(--marca1), var(--marca2));
              -webkit-background-clip: text; background-clip: text; color: transparent; }
.progresso { flex: 1; height: 5px; background: var(--realce); border-radius: 99px; overflow: hidden; }
.progresso i { display: block; height: 100%; width: 100%; border-radius: 99px;
               background: linear-gradient(90deg, var(--marca1), var(--marca2));
               transform: scaleX(var(--p, 0)); transform-origin: left;
               transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
.barra-topo .mini { white-space: nowrap; font-weight: 600; color: var(--fg3); }
.tema { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: grid;
        place-items: center; color: var(--fg2); background: var(--realce);
        transition: background .15s ease, color .15s ease, transform .15s ease; }
.tema svg { width: 18px; height: 18px; }
.tema:hover { background: var(--linha); color: var(--fg); }
.tema:active { transform: scale(.92); }

/* ── pilha de cartões ─────────────────────────────────────────────────────── */
.pilha { position: relative; width: 100%; flex: 1 1 auto; min-height: 380px; max-height: 600px; }
.cartao {
  position: absolute; inset: 0; border-radius: 24px;
  user-select: none; touch-action: none; will-change: transform;
  perspective: 1400px;   /* o arraste transforma ESTA camada… */
}
/* …e a virada transforma a de dentro, para os dois transform não brigarem. */
.giro { position: absolute; inset: 0; transform-style: preserve-3d;
        transition: transform .75s cubic-bezier(.3, .7, .2, 1); }
.giro.virado { transform: rotateY(180deg); }
/* Cor do tema. Só o matiz varia entre os cartões (--h vem do JS); luminosidade e
   croma são fixas e perceptuais (OKLCH), para que os 21 temas pareçam uma família,
   tenham o mesmo peso na tela e o texto branco passe em todos. A cor ocupa o
   cartão inteiro — é o lugar da foto. O hsl é a rede para navegador sem oklch. */
.cartao { --h: 250; isolation: isolate; }
.face {
  position: absolute; inset: 0; border-radius: 24px; padding: 1.5rem 1.5rem 3.4rem;
  display: flex; flex-direction: column; color: #fff; isolation: isolate;
  background: hsl(var(--h) 55% 42%);
  /* uma luz vinda de cima à esquerda, como numa foto: a cor deixa de ser chapada */
  background: radial-gradient(120% 55% at 12% 0%, rgb(255 255 255 / .17), transparent 62%),
              linear-gradient(172deg, oklch(var(--cartao-l1) var(--cartao-c) var(--h)) 0%,
                                       oklch(var(--cartao-l2) var(--cartao-c) var(--h)) 100%);
  box-shadow: var(--sombra); overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
/* O campo de cima é o lugar da foto: o nome do tema ocupa-o em tom sobre tom,
   grande e cortado pela borda, como a tipografia de uma capa. */
.face.frente::before {
  content: attr(data-dominio); position: absolute; right: -.06em; top: .55em; z-index: -1;
  font-size: clamp(5.4rem, 24vw, 7.2rem); font-weight: 900; line-height: .85; letter-spacing: -.05em;
  text-transform: uppercase; color: rgb(255 255 255 / .10); pointer-events: none; white-space: nowrap;
  user-select: none;
}
/* véu escuro no pé do cartão, como o de baixo de uma foto: o texto que fica ali
   ganha contraste sem mudar de cor, e os botões que invadem a borda assentam. */
.face::after {
  content: ""; position: absolute; inset: 38% 0 0; border-radius: 0 0 24px 24px; z-index: -1;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgb(0 0 0 / .22));
}
.face.verso { transform: rotateY(180deg); }
/* O cartão recebe foco por código, para as setas do teclado funcionarem. O anel
   padrão do navegador aparece nesse caso e fica feio; o anel próprio só aparece
   para quem está de fato navegando por teclado. */
.cartao:focus { outline: none; }
.cartao:focus-visible { outline: 2px solid var(--ine-vivo); outline-offset: 4px; }
/* os de trás: menores e mais baixos; sobem para o lugar quando o da frente sai */
.cartao.fundo  { transform: scale(.95) translateY(12px); pointer-events: none;
                 transition: transform .42s cubic-bezier(.2, .8, .2, 1); }
.cartao.fundo2 { transform: scale(.90) translateY(24px); pointer-events: none; }
.cartao.fundo .face  { box-shadow: 0 6px 18px rgb(0 0 0 / .10); filter: brightness(.94); }
.cartao.fundo2 .face { box-shadow: none; filter: brightness(.86); }
.cartao.fundo.sobe { transform: none; }
.cartao.fundo.sobe .face { filter: none; }
/* cartão saindo: a curva é a de algo que foi empurrado e desacelera longe */
.cartao.voando { transition: transform .46s cubic-bezier(.2, .7, .3, 1), opacity .46s ease-out; }
/* vindo de um toque no botão o cartão não tem impulso: sai mais devagar, com uma
   curva que acelera antes de desacelerar, como se tivesse sido empurrado */
.cartao.voando.toque { transition: transform .62s cubic-bezier(.4, 0, .2, 1), opacity .62s cubic-bezier(.4, 0, .2, 1); }
.cartao.fundo.sobe.lento { transition-duration: .58s; }

/* tema (o "nome" do cartão) e pergunta (a "bio") */
.face .dominio, .overlay .dominio {
  align-self: flex-start; display: inline-flex; align-items: center; gap: .4rem;
  font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .12em;
  padding: .32rem .7rem .32rem .55rem; border-radius: 999px;
  background: rgb(0 0 0 / .26); color: #fff; margin-bottom: auto;
}
.face .dominio i, .overlay .dominio i { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .9; }
/* título e pergunta assentam no pé do cartão, sobre o véu — o nome e a bio de uma
   foto; o olho desce da pergunta direto para os botões. */
.face h2 { font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.02; margin: 1rem 0 .7rem; text-align: left;
           letter-spacing: -.03em; }
.face .pergunta {
  font-size: clamp(1.22rem, 5vw, 1.45rem); font-weight: 500; line-height: 1.32;
  text-wrap: pretty; padding: 0 0 1.1rem; color: rgb(255 255 255 / .96);
}
.face .nota { font-size: .76rem; line-height: 1.35; color: rgb(255 255 255 / .82); padding-bottom: .8rem; }
/* botão de virar, no pé do cartão — vidro branco sobre a cor */
.virar {
  align-self: center; display: inline-flex; align-items: center; gap: .45rem;
  font-size: .86rem; font-weight: 700; color: #fff;
  background: rgb(255 255 255 / .18); border: 1px solid rgb(255 255 255 / .38);
  border-radius: 999px; padding: .5rem 1.05rem;
  transition: background .15s ease, transform .15s ease;
}
.virar:hover { background: rgb(255 255 255 / .28); }
.virar:active { transform: scale(.96); }
.virar svg { width: 15px; height: 15px; }
/* verso */
/* o verso tem título próprio — em caixa normal, como um título, não como etiqueta */
.face.verso .rotulo { font-size: clamp(1.25rem, 5vw, 1.45rem); font-weight: 800; letter-spacing: -.02em;
                      line-height: 1.15; margin-bottom: .6rem; }
.face.verso .explicacao { margin-bottom: 1rem; }
.face.verso .explicacao {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; align-items: center;
  font-size: clamp(1.08rem, 4.4vw, 1.2rem); font-weight: 500; line-height: 1.45; padding: .2rem 0 .8rem;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  scrollbar-color: rgb(255 255 255 / .4) transparent;
}

/* carimbos que aparecem ao arrastar — LIKE / NOPE, em cima de tudo no cartão */
.carimbo {
  position: absolute; top: 2.6rem; z-index: 4; padding: .15rem .6rem; border-radius: 8px;
  border: 4px solid currentColor; font-weight: 900; font-size: clamp(2rem, 8vw, 2.5rem); line-height: 1.05;
  letter-spacing: .06em; text-transform: uppercase; opacity: 0; pointer-events: none;
  background: transparent; transition: opacity .1s;
  /* sombra suave: o carimbo continua legível quando a cor dele é a do cartão */
  filter: drop-shadow(0 2px 8px rgb(0 0 0 / .4));
}
.carimbo.c-sim   { left: 1.4rem;  color: var(--sim-vivo); transform: rotate(-14deg); transform-origin: left top; }
.carimbo.c-nao   { right: 1.4rem; color: var(--nao-vivo); transform: rotate(14deg); transform-origin: right top; }
.carimbo.c-ine   { left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-6deg); color: var(--ine-vivo);
                   font-size: clamp(1.6rem, 6.5vw, 2rem); }
.carimbo.c-pular { left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-6deg); color: #fff;
                   font-size: clamp(1.6rem, 6.5vw, 2rem); }

/* ── botões ───────────────────────────────────────────────────────────────── */
/* Os cinco invadem a borda de baixo do cartão pela metade do maior — o cartão e
   os botões são um objeto só. `--d` é o diâmetro de cada coluna; o rótulo
   transborda dela, centrado, senão "INEGOCIÁVEL" ditaria a largura. */
.acoes { position: relative; z-index: 7; display: flex; justify-content: center; align-items: flex-start;
         gap: clamp(6px, 2.4vw, 22px); width: 100%;
         margin-top: calc(var(--d-max) / -2); padding: 0 0 .2rem; --d-max: clamp(62px, 17vw, 68px); }
.acao { --d: var(--d-max); width: var(--d); min-width: 0;
        display: grid; grid-template-columns: 100%; grid-template-rows: var(--d) auto;
        justify-items: center; align-items: start; gap: .35rem; flex: 0 0 auto; }
.acao:nth-child(2), .acao:nth-child(4) { --d: clamp(52px, 14.5vw, 56px); margin-top: 6px; }
.acao:nth-child(3) { --d: clamp(44px, 12.5vw, 48px); margin-top: 10px; }
.acao span { font-size: clamp(.58rem, 1.8vw, .66rem); font-weight: 700; color: var(--fg3);
             text-transform: uppercase; letter-spacing: .05em; text-align: center; line-height: 1.2;
             width: clamp(60px, 17vw, 84px); }
.acoes button {
  --cor: var(--fg2);
  width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center;
  color: var(--cor); background: var(--caixa); border: 1.5px solid color-mix(in srgb, var(--cor) 26%, var(--linha));
  box-shadow: var(--sombra-botao);
  transition: transform .14s cubic-bezier(.2, .8, .2, 1), background .14s ease, color .14s ease, border-color .14s ease;
}
.acoes button svg { width: 46%; height: 46%; }
.acoes button.b-nao     { --cor: var(--nao-vivo); }
.acoes button.b-sim     { --cor: var(--sim-vivo); }
.acoes button.b-pular   { --cor: var(--pular-vivo); }
/* Os escudos usam a cor da resposta — a direção é o que a pessoa escolhe primeiro —
   e a forma de escudo é o que diz que aquela resposta elimina em vez de descontar. */
.acoes button.b-ine-nao { --cor: var(--nao-vivo); }
.acoes button.b-ine-sim { --cor: var(--sim-vivo); }
.acoes button.b-ine-nao svg, .acoes button.b-ine-sim svg { width: 50%; height: 50%; }
@media (hover: hover) {
  .acoes button:hover { background: var(--cor); color: var(--sobre); border-color: var(--cor); transform: scale(1.06); }
}
.acoes button:active { background: var(--cor); color: var(--sobre); border-color: var(--cor); transform: scale(.9); }
.acoes button.b-ine-nao, .acoes button.b-ine-sim { touch-action: none; }
.acoes button.carregando { background: var(--cor); color: var(--sobre); border-color: var(--cor); }

/* A única ação cuja consequência não se adivinha pelo rótulo. A legenda some assim
   que a pessoa usa o escudo uma vez — quem nunca usou é quem precisa dela. */
.legenda-ine { max-width: 30rem; margin: .5rem auto 0; text-align: center;
               font-size: .76rem; line-height: 1.4; color: var(--fg3); }
.legenda-ine b { color: var(--ine); font-weight: 700; }

/* Encerrar agora: apertar e segurar. A barra que enche é o tempo de desistir —
   soltar antes do fim cancela, e o zero volta sem transição para isso ficar óbvio. */
.encerrar { position: relative; overflow: hidden; display: block; margin: .9rem auto 0;
            padding: .5rem 1.1rem; border-radius: 999px; background: transparent;
            color: var(--fg3); font-size: .8rem; font-weight: 600;
            cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
            transition: color .15s ease, background .15s ease; }
.encerrar:hover { color: var(--fg); background: var(--realce); }
.encerrar span { position: relative; z-index: 1; }
.encerrar .carga { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left;
                   background: color-mix(in srgb, var(--nao-vivo) 24%, transparent); }
.encerrar.carregando { color: var(--fg); background: var(--realce); }
.encerrar.carregando .carga { transform: scaleX(1); transition: transform .9s linear; }
@media (prefers-reduced-motion: reduce) {
  .encerrar.carregando .carga { transition: transform .9s steps(6); }
}

/* Os dois inegociáveis pedem apertar-e-segurar: eles eliminam candidaturas de vez, e
   ficavam a um toque acidental de distância dos botões de resposta simples. Quem se
   enche é o CARTÃO, não o botão — o dedo cobre o círculo inteiro, e ali o progresso
   ficava escondido justamente de quem precisa vê-lo. A moldura recorta nos cantos
   arredondados; o filho é que cresce. */
.cartao .carga-cartao { position: absolute; inset: 0; border-radius: 24px; overflow: hidden;
                        z-index: 5; pointer-events: none; }
.cartao .carga-cartao b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; }
@keyframes encher { from { height: 0; } to { height: 100%; } }
.cartao.carregando-nao .carga-cartao b,
.cartao.carregando-sim .carga-cartao b { animation: encher .8s linear forwards; }
.cartao.carregando-nao .carga-cartao b {
  background: linear-gradient(to top, color-mix(in srgb, var(--nao-vivo) 70%, transparent),
                                      color-mix(in srgb, var(--nao-vivo) 15%, transparent)); }
.cartao.carregando-sim .carga-cartao b {
  background: linear-gradient(to top, color-mix(in srgb, var(--sim-vivo) 70%, transparent),
                                      color-mix(in srgb, var(--sim-vivo) 15%, transparent)); }
@media (prefers-reduced-motion: reduce) {
  .cartao.carregando-nao .carga-cartao b,
  .cartao.carregando-sim .carga-cartao b { animation: encher .8s steps(6) forwards; }
}

/* Recado passageiro para quem só tocou. Fica no meio da tela, longe do polegar. */
.dica { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.96);
        z-index: 60; max-width: 18rem; text-align: center;
        padding: .75rem 1.15rem; border-radius: 14px;
        background: var(--fg); color: var(--bg); font-size: .88rem; font-weight: 600; line-height: 1.35;
        box-shadow: 0 10px 30px rgb(0 0 0 / .25);
        opacity: 0; pointer-events: none;
        transition: opacity .16s ease, transform .16s cubic-bezier(.2, .8, .2, 1); }
.dica.visivel { opacity: 1; transform: translate(-50%, -50%) scale(1); }
@media (prefers-reduced-motion: reduce) { .dica { transition: opacity .16s ease; } }

/* ── overlay do inegociável ───────────────────────────────────────────────── */
/* Cobre o cartão com a superfície da página: aqui a cor do tema sai de cena e o
   que fala é a consequência. Deixa espaço no pé para os botões que invadem a borda. */
.overlay { position: absolute; inset: 0; border-radius: 24px;
           padding: 1.5rem 1.4rem 3.2rem; display: flex; color: #fff;
           flex-direction: column; justify-content: flex-end; gap: .8rem; z-index: 6;
           background: hsl(var(--h) 55% 30%);
           background: linear-gradient(172deg, oklch(calc(var(--cartao-l1) - .12) var(--cartao-c) var(--h)) 0%,
                                               oklch(calc(var(--cartao-l2) - .10) var(--cartao-c) var(--h)) 100%);
           box-shadow: var(--sombra); }
/* O cartão continua legível por baixo da pergunta de lado: mesmo tema, mesmo título,
   mesma pergunta, um degrau menores para caber com as duas escolhas. */
.overlay { gap: 0; overflow-y: auto; scrollbar-width: none; }
.overlay h2 { font-size: clamp(1.5rem, 6.2vw, 1.8rem); line-height: 1.05; margin: .8rem 0 .5rem;
              letter-spacing: -.03em; }
.overlay .pergunta { font-size: clamp(1.02rem, 4.2vw, 1.15rem); font-weight: 500; line-height: 1.35;
                     padding: 0 0 1rem; color: rgb(255 255 255 / .94); text-wrap: pretty; }
.overlay h3 { color: #fff; font-size: .78rem; font-weight: 800; text-transform: none; letter-spacing: .02em;
              margin: 0 0 .55rem; opacity: .92; }
.overlay .escolhas { display: grid; gap: .6rem; margin-bottom: .8rem; }
/* as duas escolhas são pílulas cheias na cor da resposta — a mesma gramática dos
   botões redondos, que também se enchem ao apertar */
.overlay .escolhas button { --cor: var(--fg2); background: var(--cor); color: var(--sobre);
                            border-radius: 18px; padding: .8rem 1rem; text-align: left;
                            transition: transform .15s cubic-bezier(.2, .8, .2, 1), filter .15s ease; }
.overlay .escolhas button:hover { filter: brightness(1.06); }
.overlay .escolhas button:active { transform: scale(.98); }
.overlay .escolhas .rot { display: flex; align-items: center; gap: .45rem;
                          font-size: 1.05rem; font-weight: 800; }
.overlay .escolhas .rot svg { width: 19px; height: 19px; flex: 0 0 auto; }
/* mesma leitura de cor dos botões grandes do cartão: verde concorda, vermelho discorda */
.overlay .escolhas .b-sim { --cor: var(--sim); }
.overlay .escolhas .b-nao { --cor: var(--nao); }
.overlay .escolhas button small { display: block; font-weight: 600; opacity: .9;
                                  font-size: .8rem; margin-top: .2rem; line-height: 1.35; }
.overlay .voltar { align-self: center; color: rgb(255 255 255 / .92); font-size: .88rem; font-weight: 700;
                   text-decoration: underline; text-underline-offset: 3px; }

/* ── abertura ─────────────────────────────────────────────────────────────── */
/* A cor da marca ocupa a tela inteira; o produto se apresenta antes de pedir
   qualquer coisa. Mesma cena no claro e no escuro. */
.tela.abertura { max-width: none; min-height: 100dvh; padding: 0; color: #fff;
                 justify-content: center; text-align: center;
                 background: #fd267a;
                 background: linear-gradient(160deg, var(--marca1) 0%, var(--marca2) 100%); }
/* véu no pé, como no cartão: a letra miúda de baixo passa de 4.5:1 sem trocar de cor */
.tela.abertura::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
                         background: linear-gradient(to bottom, transparent 40%, rgb(0 0 0 / .22)); }
.abertura-in { position: relative; z-index: 1; width: 100%; max-width: 30rem; padding: 3rem 1.5rem 2.5rem;
               display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.abertura-in .marca { color: #fff; --marca-check: var(--marca1); font-size: clamp(3rem, 12vw, 3.8rem);
                      letter-spacing: -.045em; gap: .5rem; line-height: 1; margin-bottom: .2rem; }
.abertura-in .marca svg { width: .82em; height: .82em; }
.abertura-in .marca span { background-image: none; background-color: #fff; }   /* sobre o degradê, o nome é branco */
.abertura .slogan { font-size: clamp(1.3rem, 5.4vw, 1.55rem); line-height: 1.25; font-weight: 700;
                    text-wrap: balance; margin: .6rem 0 .5rem; max-width: 20ch; }
.abertura .meta { font-size: .9rem; font-weight: 600; color: rgb(255 255 255 / .92); margin: 0 0 1.6rem; }
.abertura .nota { max-width: 26rem; margin: 0 0 .4rem; }
.abertura .nota h3 { color: #fff; font-size: 1.05rem; margin-bottom: .25rem; }
.abertura .nota .mini { color: rgb(255 255 255 / .92); font-size: .9rem; }
.abertura .comecar { background: #fff; color: var(--botao1); border-radius: 999px;
                     padding: 1rem 2.6rem; font-weight: 800; font-size: 1.1rem; margin-top: 1.4rem;
                     box-shadow: 0 8px 24px rgb(0 0 0 / .22), 0 1px 3px rgb(0 0 0 / .18);
                     transition: transform .15s cubic-bezier(.2, .8, .2, 1), box-shadow .15s ease; }
.abertura .comecar:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgb(0 0 0 / .26), 0 1px 3px rgb(0 0 0 / .18); }
.abertura .comecar:active { transform: scale(.97); }
.abertura .recomecar { margin-top: 1rem; color: rgb(255 255 255 / .9); font-weight: 600; font-size: .9rem;
                       text-decoration: underline; text-underline-offset: 3px; }
.abertura :focus-visible { outline-color: #fff; }

/* ── resultado ────────────────────────────────────────────────────────────── */
.tela[data-tela="resultado"] h1 { font-size: 1.85rem; margin: .2rem 0 1rem; align-self: flex-start; }

/* Seletor de ordenação: um trilho com a marca deslizando entre as três leituras.
   A marca move-se em vez de piscar para deixar claro que é a MESMA lista sendo
   reordenada, e não três telas diferentes. */
.ordenar { position: relative; display: grid; grid-auto-flow: column;
           grid-auto-columns: 1fr; width: min(26rem, 100%); margin: 0 auto 1rem;
           padding: 4px; border-radius: 999px; background: var(--realce); }
.ordenar .marca-ordem { position: absolute; top: 4px; bottom: 4px; border-radius: 999px;
                        background: var(--caixa); box-shadow: var(--sombra-botao);
                        transition: left .26s cubic-bezier(.2, .8, .2, 1); }
.ordenar button { position: relative; z-index: 1; padding: .5rem .3rem; border-radius: 999px;
                  font-size: .82rem; font-weight: 600; color: var(--fg3); white-space: nowrap; cursor: pointer;
                  transition: color .15s ease; }
.ordenar button[aria-pressed="true"] { color: var(--fg); font-weight: 800; }
.ordenar button:hover { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .ordenar .marca-ordem { transition: none; } }

.grafico { width: 100%; }
/* Uma raia por candidatura: a posição num círculo (como um retrato), nome e sigla,
   a contagem, e a barra por baixo. Toca-se a raia inteira. */
.raia { padding: .35rem 0; border-bottom: 1px solid var(--linha); }
.raia:last-child { border-bottom: 0; }
.raia .quem { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center;
              column-gap: .7rem; row-gap: .15rem; width: 100%; text-align: left;
              padding: .55rem .5rem; margin: 0 -.5rem; width: calc(100% + 1rem);
              border-radius: 16px; cursor: pointer; transition: background .15s ease; }
.raia .quem:hover { background: var(--realce); }
.raia .pos { grid-row: 1 / span 2; width: 42px; height: 42px; border-radius: 50%;
             display: grid; place-items: center; font-weight: 800; font-size: 1rem;
             color: var(--fg2); background: var(--realce); }
.raia.topo .pos { color: #fff; background: linear-gradient(150deg, var(--marca1), var(--marca2)); }
.raia .nome { display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; min-width: 0; font-size: 1rem; }
.raia .nome b { font-weight: 800; letter-spacing: -.01em; }
.raia .nome em { font-style: normal; font-size: .78rem; font-weight: 600; color: var(--fg3); }
.raia .nome em.lider { color: var(--acento); }
.raia .nome em.fora { color: var(--nao); }
.raia .conta { grid-column: 3; grid-row: 1 / span 2; font-size: .78rem; font-weight: 700; color: var(--nao);
               white-space: nowrap; }
.raia .conta.acordo { color: var(--sim); }
.raia .seta { grid-column: 4; grid-row: 1 / span 2; color: var(--fg3); flex: 0 0 auto; display: grid;
              transition: transform .15s ease, color .15s ease; }
.raia .seta svg { width: 18px; height: 18px; }
.raia .quem:hover .seta { color: var(--fg); transform: translateX(2px); }
.raia .barra { grid-column: 2 / span 3; display: flex; height: 10px; border-radius: 999px; overflow: hidden;
               background: var(--realce); }
.raia .barra i { display: block; height: 100%; }
.raia .barra .a { background: var(--sim-vivo); }
.raia .barra .d { background: var(--nao-vivo); }
.raia .barra .s { background: repeating-linear-gradient(-45deg, var(--linha) 0 3px, transparent 3px 7px); }
.raia.morta { opacity: .55; }
.raia.morta .nome b { text-decoration: line-through; }
/* entrada do resultado: as raias sobem uma atrás da outra, uma vez só */
@keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.raia { animation: subir .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@media (prefers-reduced-motion: reduce) { .raia { animation: none; } }

.chave { display: flex; gap: .4rem 1rem; flex-wrap: wrap; font-size: .78rem; font-weight: 600;
         color: var(--fg2); margin: .4rem 0 1rem; }
.chave i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: .35rem;
           vertical-align: -1px; }
.chave i.s { background: repeating-linear-gradient(-45deg, var(--linha) 0 2px, var(--realce) 2px 5px); }

/* recados: texto solto, sem caixa — o título faz o trabalho */
.nota { width: 100%; margin: 0 0 1.1rem; }
.nota h3 { font-size: 1.05rem; margin-bottom: .25rem; }
.nota.perigo h3 { color: var(--nao); }
.nota .mini { color: var(--fg2); }
/* cartões de ação: superfície tingida com um botão dentro (continuar, responder o resto) */
.aviso { background: var(--realce); padding: 1.1rem 1.2rem; border-radius: 20px; margin: 0 0 1rem; width: 100%; }
.aviso h3 { font-size: 1.1rem; margin-bottom: .3rem; }
.aviso.afinar { background: color-mix(in srgb, var(--marca1) 9%, var(--bg)); }
.aviso.afinar h3 { color: var(--acento); }
.aviso .mini { color: var(--fg2); }
/* botão principal dentro de uma caixa (continuar, responder os restantes) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
       border-radius: 999px; padding: .65rem 1.3rem; font-weight: 800; font-size: .92rem;
       color: #fff; background: linear-gradient(135deg, var(--botao1), var(--botao2));
       box-shadow: 0 6px 16px color-mix(in srgb, var(--botao1) 30%, transparent);
       transition: transform .15s cubic-bezier(.2, .8, .2, 1), box-shadow .15s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px color-mix(in srgb, var(--botao1) 38%, transparent); }
.btn:active { transform: scale(.97); }
.btn.contorno { color: var(--fg); background: var(--caixa); box-shadow: none; border: 1.5px solid var(--linha); }
.btn.contorno:hover { background: var(--realce); box-shadow: none; }

/* fileira de ações do resultado — não confundir com o rodapé da página (.rodape) */
.acoes-final { width: 100%; margin-top: 1.6rem; display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.acoes-final button, .acoes-final a {
  border: 1.5px solid var(--linha); background: var(--caixa); border-radius: 999px;
  padding: .6rem 1.2rem; font-size: .9rem; font-weight: 700; color: inherit; text-decoration: none;
  transition: background .15s ease;
}
.acoes-final button:hover, .acoes-final a:hover { background: var(--realce); }
.tela h3.secao { width: 100%; font-size: 1.1rem; margin-top: 1.4rem; }
.planos { width: 100%; font-size: .9rem; }
.planos a { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .6rem .2rem;
            border-bottom: 1px solid var(--linha); color: inherit; text-decoration: none; font-weight: 600;
            transition: background .15s ease; border-radius: 8px; }
.planos a:hover { background: var(--realce); }
.planos a span:last-child { color: var(--acento); white-space: nowrap; font-weight: 700; font-size: .84rem; }

/* ── painel de uma candidatura ────────────────────────────────────────────────
   Folha sobreposta em vez de acordeão: a citação é literal, portanto longa, e
   dentro da linha do gráfico ela ficava numa coluna estreita demais para ler.
   O resultado continua atrás, na mesma posição de rolagem. */
/* `display: flex` de autor vence o estilo de agente do atributo `hidden` — sem esta
   linha o fundo invisível fica sobre a página inteira e engole todo clique. */
.painel-fundo[hidden] { display: none; }
.painel-fundo { position: fixed; inset: 0; z-index: 50; display: flex;
                justify-content: center; align-items: flex-end;
                background: rgb(17 20 24 / .5);
                opacity: 0; transition: opacity .2s ease; }
.painel-fundo.visivel { opacity: 1; }
body.travado { overflow: hidden; }

.painel { display: flex; flex-direction: column; width: min(46rem, 100%);
          max-height: min(92dvh, 100%); background: var(--bg);
          border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgb(0 0 0 / .25);
          transform: translateY(24px); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.painel-fundo.visivel .painel { transform: none; }

.painel > header { position: sticky; top: 0; z-index: 1; padding: .6rem 1.3rem .9rem;
                   background: var(--bg); border-bottom: 1px solid var(--linha);
                   border-radius: 24px 24px 0 0; }
/* puxador, como numa folha de celular */
.painel > header::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 99px;
                           background: var(--linha); margin: 0 auto .8rem; }
.painel .cab { display: flex; align-items: center; gap: .7rem; }
.painel .cab .pos { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
                    font-weight: 800; color: var(--fg2); background: var(--realce); flex: 0 0 auto; }
.painel .cab .pos.topo { color: #fff; background: linear-gradient(150deg, var(--marca1), var(--marca2)); }
.painel .cab .nome { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap; min-width: 0; }
.painel .cab .nome b { font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; }
.painel .cab .nome em { font-style: normal; font-size: .8rem; font-weight: 600; color: var(--fg3); }
.painel .cab .nome em.morto { color: var(--nao); }
.painel .fechar { margin-left: auto; flex: 0 0 auto; display: grid; place-items: center;
                  width: 2.3rem; height: 2.3rem; border-radius: 999px;
                  background: var(--realce); color: var(--fg2); transition: background .15s ease, color .15s ease; }
.painel .fechar svg { width: 1.05rem; height: 1.05rem; }
.painel .fechar:hover { background: var(--linha); color: var(--fg); }
.painel > header .barra { display: flex; height: 10px; margin-top: .8rem;
                          border-radius: 999px; overflow: hidden; background: var(--realce); }
.painel > header .barra i { display: block; height: 100%; }
.painel > header .barra .a { background: var(--sim-vivo); }
.painel > header .barra .d { background: var(--nao-vivo); }
.painel > header .barra .s { background: repeating-linear-gradient(-45deg, var(--linha) 0 3px, transparent 3px 7px); }
.painel .contagem { margin: .5rem 0 0; font-size: .78rem; font-weight: 600; color: var(--fg3); }

.painel .corpo { overflow-y: auto; overscroll-behavior: contain;
                 padding: .4rem 1.3rem 1.6rem; -webkit-overflow-scrolling: touch;
                 scrollbar-width: thin; scrollbar-color: var(--linha) transparent; }
/* Cada bloco leva um fundo de sua cor e um título que gruda no topo da rolagem —
   sem isso, no meio da lista não dá para saber se o que está na tela é divergência
   ou concordância. O fundo do título é opaco de propósito: o texto passa por baixo. */
.painel .grupo { margin: 0 -1.3rem; padding: 0 1.3rem .6rem; }
.painel .grupo.d { background: color-mix(in srgb, var(--nao-vivo) 5%, transparent); }
.painel .grupo.a { background: color-mix(in srgb, var(--sim-vivo) 5%, transparent); }
.painel .grupo h3 { position: sticky; top: 0; z-index: 1;
                    margin: 0 -1.3rem .2rem; padding: .55rem 1.3rem;
                    font-size: .74rem; text-transform: uppercase;
                    letter-spacing: .1em; font-weight: 800; }
.painel .grupo.d h3 { color: var(--nao); background: color-mix(in srgb, var(--nao-vivo) 11%, var(--bg)); }
.painel .grupo.a h3 { color: var(--sim); background: color-mix(in srgb, var(--sim-vivo) 11%, var(--bg)); }
.painel .item { padding: .9rem 0; border-bottom: 1px solid var(--linha); }
.painel .item:last-of-type { border-bottom: 0; }
.painel .grupo.d .item { border-bottom-color: color-mix(in srgb, var(--nao-vivo) 15%, transparent); }
.painel .grupo.a .item { border-bottom-color: color-mix(in srgb, var(--sim-vivo) 15%, transparent); }
.painel .item b { font-size: 1rem; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; }
.painel .item em.fora { font-style: normal; font-size: .68rem; font-weight: 700; color: var(--fg3);
                        background: var(--realce); border-radius: 999px;
                        padding: .1rem .5rem; margin-left: .4rem; white-space: nowrap; vertical-align: 2px; }
.painel .cit { margin: .45rem 0 0; font-size: .92rem; line-height: 1.6; color: var(--fg2);
               border-left: 1px solid var(--linha); padding: .1rem 0 .1rem .85rem; }
.painel .cit .fonte { display: block; font-size: .74rem; font-weight: 600; color: var(--fg3); margin-top: .4rem; }
.painel .plano { display: inline-block; margin-top: 1.2rem; font-size: .9rem; font-weight: 700; color: var(--acento);
                 text-decoration: none; }
.painel .plano:hover { text-decoration: underline; text-underline-offset: 3px; }
.painel .voltar { display: block; width: 100%; margin-top: 1.2rem; padding: .75rem;
                  border: 1.5px solid var(--linha); border-radius: 999px;
                  background: var(--caixa); font-size: .9rem; font-weight: 700; color: var(--fg2);
                  transition: background .15s ease; }
.painel .voltar:hover { background: var(--realce); color: var(--fg); }

/* Em telas largas a folha vira caixa centralizada — nada de 92vh de altura vazia. */
@media (min-width: 720px) {
  .painel-fundo { align-items: center; padding: 2rem 1rem; }
  .painel { border-radius: 24px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); max-height: 100%; }
  .painel > header { border-radius: 24px 24px 0 0; }
  .painel > header::before { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .painel-fundo, .painel, .giro, .cartao.fundo, .cartao.voando, .progresso i { transition: none; }
  .painel { transform: none; }
}


/* Rodapé compartilhado pelas duas páginas. Usa apenas cores próprias, em vez das
   variáveis de cada folha de estilo, para ficar igual nos dois layouts. */
.rodape {
  margin-top: 2.5rem; padding: 16px 20px; flex-shrink: 0;
  border-top: 1px solid rgba(0, 0, 0, .1);
  background: rgba(0, 0, 0, .02);
  color: #626c79; font-size: .76rem; line-height: 1.5;
}
.rodape-in {
  max-width: 1000px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 14px;
}
.rodape a { color: #4a535f; text-decoration: none; text-underline-offset: 3px; }
.rodape a:hover { text-decoration: underline; }
.rodape-sep { opacity: .5; }
.rodape-lema { font-weight: 700; color: #4a535f; }
.rodape-ano { display: inline-flex; align-items: center; gap: 5px; }

/* ── recolher no celular ────────────────────────────────────────────────────
   Sem JS: o checkbox fica fora de vista e o rótulo é o botão. `display: contents`
   faz os itens de .rodape-extra participarem do flex do rodapé como se o span
   não existisse — só assim os separadores continuam alinhados na mesma linha. */
.rodape-check { position: absolute; width: 1px; height: 1px; opacity: 0;
                pointer-events: none; margin: 0; }
.rodape-extra { display: contents; }
.rodape-abrir { display: none; }

@media (max-width: 640px) {
  .rodape-in { flex-wrap: nowrap; }
  .rodape-extra { display: none; }
  .rodape-check:checked ~ .rodape-in .rodape-extra { display: contents; }
  .rodape-check:checked ~ .rodape-in { flex-wrap: wrap; }
  .rodape-abrir {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(0, 0, 0, .12); color: inherit;
    transition: transform .2s ease;
  }
  .rodape-abrir svg { width: 12px; height: 12px; }
  .rodape-check:checked ~ .rodape-in .rodape-abrir { transform: rotate(180deg); }
  .rodape-check:focus-visible ~ .rodape-in .rodape-abrir { outline: 2px solid currentColor;
                                                           outline-offset: 2px; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .rodape-abrir { border-color: rgba(255, 255, 255, .18); }
}
:root[data-theme="dark"] .rodape-abrir { border-color: rgba(255, 255, 255, .18); }
.rodape-ano-sel { position: relative; display: inline-flex; align-items: center; }
.rodape-ano-sel select {
  appearance: none; -webkit-appearance: none;
  background: rgba(255, 255, 255, .8); border: 1px solid rgba(0, 0, 0, .12);
  border-radius: 6px; padding: 2px 22px 2px 8px;
  font: inherit; font-size: .75rem; color: inherit; cursor: pointer;
}
.rodape-ano-seta {
  position: absolute; right: 6px; width: 12px; height: 12px;
  pointer-events: none; opacity: .6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .rodape { border-top-color: rgba(255, 255, 255, .1);
            background: rgba(255, 255, 255, .03); color: #8e97a3; }
  :root:not([data-theme="light"]) .rodape a,
  :root:not([data-theme="light"]) .rodape-lema { color: #b6bdc6; }
  :root:not([data-theme="light"]) .rodape-ano-sel select { background: rgba(255, 255, 255, .06);
                           border-color: rgba(255, 255, 255, .15); }
}
:root[data-theme="dark"] .rodape { border-top-color: rgba(255, 255, 255, .1);
          background: rgba(255, 255, 255, .03); color: #8e97a3; }

<script type="module">
/**
 * Motor de alinhamento entre posições do usuário e posições declaradas em planos
 * de governo. Híbrido: ELIMINAÇÃO para o inegociável, ACUMULAÇÃO para o resto.
 *
 * Porte de `engine.js` do classificador clínico. Ver MOTOR-E-PORT-POLITICO.md.
 *
 * CONTRATO — nenhuma função deste arquivo pode quebrar isto:
 *   1. Pureza. Sem Date, sem Math.random, sem I/O, sem dependências. Todo estado
 *      é derivado de (corpus, respostas, linhasVermelhas) e recalculado do zero.
 *   2. Sem vencedor único imposto. `lideres` pode ter mais de um elemento.
 *   3. Ignorância ≠ negação. "ns" mantém a pendência e não move o score.
 *   4. Não perguntado ≠ inconclusivo ≠ indiferente. Três ausências distintas,
 *      preservadas até o relatório.
 *   5. Toda eliminação tem motivo estruturado, com a citação que a causou.
 *   6. Contraste nunca elimina. É sinal.
 *   7. Silêncio nunca soma nem subtrai; reduz `cobertura`.
 *   8. Eixo não discriminante (unânime ou unilateral) fica FORA de afinidade e
 *      cobertura, mesmo que respondido — ver §20 da especificação.
 *   9. Determinismo. Empates resolvidos lexicograficamente.
 *  10. Terminação. Toda pergunta devolvida consome uma variável não respondida.
 */

const RESPOSTAS_VALIDAS = ["concordo", "discordo", "indiferente", "ns"];

/**
 * Como cada valor é escrito para o usuário. O motor guarda "indiferente" e "ns"
 * separados porque a distinção é do contrato (invariante 4); a tela mostra os dois
 * como escolhas de não opinar, e o relatório preserva a diferença.
 */
const ROTULO_RESPOSTA = {
  concordo: "concordo", discordo: "discordo",
  indiferente: "não opinou", ns: "não soube", sim: "sim", nao: "não",
};
const rotularResposta = (v) => ROTULO_RESPOSTA[v] ?? v;
const MARGEM_PADRAO = 0.05;

const asSet = (x) => (x instanceof Set ? x : new Set(x || []));
const pesoDe = (corpus, eixo) => corpus.eixos[eixo]?.peso ?? 1;

/** Postura declarada por `cand` no `eixo`, ou null. */
function postura(cand, eixo) {
  return cand.posicoes.find((p) => p.eixo === eixo) || null;
}

/**
 * Lógica de quatro valores, análoga a `testar()` do motor clínico.
 * Devolve: true alinhado · false divergente · null neutralizado (indiferente)
 *          · undefined sem sinal (não perguntado, "ns", ou candidato mudo).
 */
function confrontar(resposta, postura) {
  if (resposta === undefined || resposta === "ns") return undefined;
  if (resposta === "indiferente") return null;
  if (!postura) return undefined;
  return (
    (resposta === "concordo" && postura.postura === "favor") ||
    (resposta === "discordo" && postura.postura === "contra")
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Eliminações — passada independente da classificação dos eixos
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Linhas vermelhas e portões. Roda ANTES de qualquer cálculo de score, porque
 * a eliminação não depende de quais eixos são discriminantes: se o usuário
 * declarou um eixo inegociável, divergir nele elimina — inclusive num eixo
 * unânime, caso em que o campo inteiro cai e §21 manda mostrar o contrafactual.
 *
 * "ns" e "indiferente" NUNCA eliminam: ignorância e indiferença não são divergência.
 */
function eliminacoes(corpus, respostas, linhasVermelhas = new Set()) {
  const lv = asSet(linhasVermelhas);
  const out = {};
  for (const cand of corpus.candidatos) {
    let motivo = null;
    for (const eixo of Object.keys(corpus.eixos)) {
      if (!lv.has(eixo)) continue;
      const p = postura(cand, eixo);
      if (confrontar(respostas[eixo], p) !== false) continue;
      motivo = { tipo: "linha-vermelha", eixo, postura: p.postura, citacao: p.citacao, interpretacao: p.interpretacao };
      break; // só a PRIMEIRA linha violada vira motivo — o relatório diz por que caiu
    }
    out[cand.id] = motivo;
  }
  for (const [id, portao] of Object.entries(corpus.portoes || {})) {
    if (portao.efeito !== "invalida-todos-se-nao") continue;
    if (respostas[id] !== "nao") continue;
    for (const cand of corpus.candidatos) {
      out[cand.id] = out[cand.id] || { tipo: "portao", portao: id, pergunta: portao.pergunta };
    }
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// Classificação dos eixos — §20
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Reparte os eixos em quatro categorias, sobre o conjunto de candidatos `vivos`:
 *   divisivo    — há favor E contra. É o único que entra no ranking.
 *   unanime     — todos os vivos falaram, todos na mesma direção.
 *   unilateral  — só parte falou, sem oposição declarada.
 *   mudo        — nenhum vivo falou.
 * Incluir unânime ou unilateral no ranking INVERTE a ordem (§20). Fora.
 */
function classificarEixos(corpus, vivos) {
  const divisivos = [], unanimes = [], unilaterais = [], mudos = [];
  for (const eixo of Object.keys(corpus.eixos)) {
    const falam = vivos.map((c) => postura(c, eixo)).filter(Boolean);
    const nFavor = falam.filter((p) => p.postura === "favor").length;
    const nContra = falam.filter((p) => p.postura === "contra").length;
    const info = { eixo, nFavor, nContra, nFalam: falam.length, mudos: vivos.length - falam.length,
                   peso: pesoDe(corpus, eixo), separacoes: nFavor * nContra };
    if (nFavor > 0 && nContra > 0) divisivos.push({ ...info, categoria: "divisivo" });
    else if (falam.length === 0) mudos.push({ ...info, categoria: "mudo", postura: null });
    else if (falam.length === vivos.length) unanimes.push({ ...info, categoria: "unanime", postura: falam[0].postura });
    else unilaterais.push({ ...info, categoria: "unilateral", postura: falam[0].postura });
  }
  return { divisivos, unanimes, unilaterais, mudos };
}

const setDe = (lista) => new Set(lista.map((x) => x.eixo));

// ─────────────────────────────────────────────────────────────────────────────
// avaliar() — score, afinidade, cobertura
// ─────────────────────────────────────────────────────────────────────────────

/**
 * avaliar(corpus, respostas, linhasVermelhas) → { [id]: estado do candidato }
 *
 * `opts.discriminantes` permite injetar o conjunto de eixos que entra no ranking
 * (usado pelo motor para congelá-lo a partir dos vivos). Sem ele, é derivado
 * dos candidatos não eliminados.
 */
function avaliar(corpus, respostas, linhasVermelhas = new Set(), opts = {}) {
  const mortos = eliminacoes(corpus, respostas, linhasVermelhas);
  const vivos = corpus.candidatos.filter((c) => !mortos[c.id]);
  const classes = opts.classes || classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const discriminantes = opts.discriminantes || setDe(classes.divisivos);

  const out = {};
  for (const cand of corpus.candidatos) {
    const acc = {
      rank: { score: 0, pesoDeclarado: 0, pesoRespondido: 0, pesoSilencioso: 0,
              alinhados: [], divergentes: [], silencios: [] },
      comp: { score: 0, pesoDeclarado: 0, pesoRespondido: 0, pesoSilencioso: 0,
              alinhados: [], divergentes: [], silencios: [] },
    };
    const inconclusivos = [], indiferentes = [];

    for (const eixo of Object.keys(corpus.eixos)) {
      const r = respostas[eixo];
      if (r === undefined) continue;
      const p = postura(cand, eixo);
      if (r === "ns") { if (p) inconclusivos.push(eixo); continue; }
      if (r === "indiferente") { if (p) indiferentes.push(eixo); continue; }
      const bucket = discriminantes.has(eixo) ? acc.rank : acc.comp;
      const peso = pesoDe(corpus, eixo);
      bucket.pesoRespondido += peso;
      if (!p) { bucket.silencios.push(eixo); bucket.pesoSilencioso += peso; continue; }
      bucket.pesoDeclarado += peso;
      if (confrontar(r, p)) { bucket.score += peso; bucket.alinhados.push(eixo); }
      else { bucket.score -= peso; bucket.divergentes.push(eixo); }
    }

    const norm = (b) => (b.pesoDeclarado ? (b.score + b.pesoDeclarado) / (2 * b.pesoDeclarado) : null);
    const cob = (b) => (b.pesoRespondido ? b.pesoDeclarado / b.pesoRespondido : null);

    out[cand.id] = {
      id: cand.id,
      estado: mortos[cand.id] ? "eliminado" : "vivo",
      motivo: mortos[cand.id] || null,
      score: acc.rank.score,
      afinidade: norm(acc.rank),
      cobertura: cob(acc.rank),
      pesoDeclarado: acc.rank.pesoDeclarado,
      pesoRespondido: acc.rank.pesoRespondido,
      pesoSilencioso: acc.rank.pesoSilencioso,
      alinhados: acc.rank.alinhados,
      divergentes: acc.rank.divergentes,
      silencios: acc.rank.silencios,
      inconclusivos,
      indiferentes,
      // Métricas dos eixos NÃO discriminantes. Nunca entram no ranking (§20);
      // existem para separar candidaturas que empatam nos eixos divisivos.
      complementar: {
        score: acc.comp.score,
        afinidade: norm(acc.comp),
        cobertura: cob(acc.comp),
        pesoDeclarado: acc.comp.pesoDeclarado,
        pesoRespondido: acc.comp.pesoRespondido,
        alinhados: acc.comp.alinhados,
        divergentes: acc.comp.divergentes,
        silencios: acc.comp.silencios,
      },
    };
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// Ranking
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Afinidade `null` (o candidato não declarou nada sobre nada que foi respondido)
 * NÃO vira 0 — fica fora da ordem, listado à parte em `semSinal`.
 */
function ranking(corpus, estados, margem = MARGEM_PADRAO) {
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const comSinal = vivos.filter((c) => estados[c.id].afinidade !== null);
  const semSinal = vivos.filter((c) => estados[c.id].afinidade === null).map((c) => c.id);
  const ord = [...comSinal].sort(
    (a, b) => estados[b.id].afinidade - estados[a.id].afinidade || a.id.localeCompare(b.id)
  );
  if (!ord.length) return { ordem: [], lideres: [], empate: false, semSinal, margem };
  const topo = estados[ord[0].id].afinidade;
  const lideres = ord.filter((c) => topo - estados[c.id].afinidade <= margem).map((c) => c.id);
  return { ordem: ord.map((c) => c.id), lideres, empate: lideres.length > 1, semSinal, margem };
}

// ─────────────────────────────────────────────────────────────────────────────
// Consenso do campo — §20
// ─────────────────────────────────────────────────────────────────────────────

/**
 * afinidadeComOCampo: o quanto o campo eleitoral INTEIRO representa o usuário,
 * medido nos eixos NÃO discriminantes — unânimes e unilaterais (§20). São eixos
 * em que o campo fala com uma voz só, então a resposta do usuário não favorece
 * ninguém: é informação sobre o campo, não sobre a disputa. Nunca entra no ranking.
 *
 * `cobertura` aqui é o peso ponderado pela fração de candidatos vivos que de fato
 * declararam a posição: 1,00 num eixo unânime, menor num unilateral. Sem ela, um
 * campo em que uma única candidatura fala pareceria um campo comprometido.
 */
function afinidadeComOCampo(corpus, respostas, classes) {
  let score = 0, peso = 0, pesoPonderado = 0, pesoTotal = 0;
  const eixos = [];
  for (const u of [...classes.unanimes, ...classes.unilaterais]) {
    const r = respostas[u.eixo];
    if (r === undefined || r === "ns" || r === "indiferente") continue;
    const alinha = (r === "concordo" && u.postura === "favor") || (r === "discordo" && u.postura === "contra");
    const w = u.peso;
    const fracao = u.nFalam / (u.nFalam + u.mudos);
    peso += w;
    pesoPonderado += w * fracao;
    pesoTotal += w;
    score += alinha ? w : -w;
    eixos.push({ eixo: u.eixo, categoria: u.categoria, postura: u.postura, resposta: r,
                 alinha, peso: w, nFalam: u.nFalam, mudos: u.mudos });
  }
  return {
    afinidade: peso ? (score + peso) / (2 * peso) : null,
    cobertura: pesoTotal ? pesoPonderado / pesoTotal : null,
    score, pesoDeclarado: peso, eixos,
    respondidos: eixos.length,
    total: classes.unanimes.length + classes.unilaterais.length,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Parada antecipada — quando a disputa já está decidida
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Intervalo em que a afinidade de cada candidatura ainda pode terminar, dadas as
 * respostas que faltam.
 *
 * A conta sai de uma identidade da §17: com `P` = peso declarado e `a` = peso
 * alinhado, `afinidade = (score + P) / (2P)` e `score = a − d`, logo
 *
 *     afinidade = a / P
 *
 * Então, se `R` é o peso ainda não respondido dos temas em que ESTA candidatura
 * declara posição, o piso é responder tudo contra ela (`a / (P+R)`) e o teto é
 * responder tudo a favor (`(a+R) / (P+R)`). Exato, não estimativa.
 *
 * RESSALVA: os limites valem para respostas comuns. Marcar um tema como
 * inegociável elimina candidaturas, e eliminar candidaturas pode tirar um tema da
 * conta (§20) — o que move os limites. Por isso `decisaoEstavel()` só é consultada
 * para PARAR de perguntar, nunca para impedir o usuário de continuar.
 */
function limitesAfinidade(corpus, respostas, estados, classes) {
  const pendentes = classes.divisivos.filter((d) => respostas[d.eixo] === undefined);
  const out = {};
  for (const cand of corpus.candidatos) {
    const s = estados[cand.id];
    const P = s.pesoDeclarado;
    const alinhado = (P + s.score) / 2;
    const R = pendentes.reduce((n, d) => n + (postura(cand, d.eixo) ? d.peso : 0), 0);
    const total = P + R;
    out[cand.id] = total
      ? { min: alinhado / total, max: (alinhado + R) / total, emJogo: R, decidido: P }
      : { min: null, max: null, emJogo: 0, decidido: 0 };
  }
  return out;
}

/**
 * A decisão está estável quando nenhuma resposta futura consegue mudar QUEM
 * lidera. Uma candidatura ainda pode liderar se o teto dela alcança o maior piso
 * do campo, descontada a margem de empate; quando esse conjunto coincide com os
 * líderes de agora, perguntar mais não muda o desfecho.
 */
function decisaoEstavel(corpus, respostas, estados, opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const classes = opts.classes || classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const lim = limitesAfinidade(corpus, respostas, estados, classes);
  const comSinal = vivos.filter((c) => lim[c.id].min !== null);
  const lideres = ranking(corpus, estados, margem).lideres;

  if (!comSinal.length) {
    const restam = classes.divisivos.filter((d) => respostas[d.eixo] === undefined).length;
    return { estavel: restam === 0, possiveis: [], lideres, emDisputa: 0, restam };
  }
  const maiorPiso = Math.max(...comSinal.map((c) => lim[c.id].min));
  const possiveis = comSinal
    .filter((c) => lim[c.id].max >= maiorPiso - margem)
    .map((c) => c.id)
    .sort();
  const restam = classes.divisivos.filter((d) => respostas[d.eixo] === undefined).length;
  const igual = possiveis.length === lideres.length &&
    [...lideres].sort().every((x, i) => x === possiveis[i]);
  return { estavel: restam === 0 || igual, possiveis, lideres, limites: lim,
           emDisputa: possiveis.length, restam };
}

// ─────────────────────────────────────────────────────────────────────────────
// Contrastes — porte direto de diferenciais(). NUNCA elimina.
// ─────────────────────────────────────────────────────────────────────────────

function contrastes(corpus, respostas, estados) {
  const vivo = (id) => estados[id]?.estado === "vivo";
  const naoInvestigados = [], investigados = [], inativos = [];
  for (const t of corpus.contrastes || []) {
    const [a, z] = t.entre;
    if (!vivo(a) || !vivo(z)) { inativos.push({ ...t, motivo: "um dos lados foi eliminado" }); continue; }
    const v = respostas[t.discriminador];
    if (v === undefined) naoInvestigados.push({ ...t, motivo: "não perguntado" });
    else if (v === "ns") naoInvestigados.push({ ...t, motivo: "resposta inconclusiva" });
    else if (v === "indiferente") naoInvestigados.push({ ...t, motivo: "declarado indiferente" });
    else investigados.push({ ...t, resposta: v, inclina: t.inclina?.[v] || null });
  }
  return { naoInvestigados, investigados, inativos };
}

// ─────────────────────────────────────────────────────────────────────────────
// proximaPergunta() — quatro fases, estritamente ordenadas
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Fase 1 — eixos divisivos, por ganho = nFavor × nContra × peso (§19).
 *          Alcance máximo é inútil aqui: um eixo unânime não separa ninguém.
 * Fase 2 — discriminadores de contraste entre dois lados vivos. Prioriza pares
 *          em que AMBOS estão na liderança: é a pergunta mais valiosa que o
 *          instrumento pode fazer (§22, regra 2).
 * Fase 3 — portões. Só entram quando já existe ranking — mas o ranking usado é
 *          o CONTRAFACTUAL SEM PORTÕES (correção do B1): um portão que elimina
 *          todos não pode impedir que os portões seguintes sejam perguntados.
 * Fase 4 — opcional (opts.complementar). Eixos não discriminantes, marcados
 *          como tal. Alimentam `afinidadeComOCampo` e a afinidade complementar;
 *          nunca o ranking.
 */
function proximaPergunta(corpus, respostas, estados, opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const base = vivos.length ? vivos : corpus.candidatos;
  const classes = opts.classes || classificarEixos(corpus, base);

  // Fase 1 — eixos divisivos
  const cands = classes.divisivos
    .filter((d) => respostas[d.eixo] === undefined && d.separacoes > 0)
    .map((d) => ({ ...d, ganho: d.separacoes * d.peso }))
    .sort((a, b) => b.ganho - a.ganho || b.peso - a.peso || a.eixo.localeCompare(b.eixo));
  if (cands.length) {
    const m = cands[0];
    // §22, regra 2: se este eixo é o discriminador de um contraste entre dois
    // líderes empatados, é a pergunta mais valiosa do instrumento. A ORDEM segue
    // o ganho (§19); o que muda é o destaque.
    const lideres = new Set(ranking(corpus, estados, margem).lideres);
    const par = (corpus.contrastes || []).find(
      (t) => t.discriminador === m.eixo && t.entre.every((id) => lideres.has(id))
    );
    return {
      tipo: "eixo", fase: 1, id: m.eixo, ...corpus.eixos[m.eixo],
      naoDiscriminante: false,
      separa: { favor: m.nFavor, contra: m.nContra, mudos: m.mudos, separacoes: m.separacoes, ganho: m.ganho },
      entreLideres: Boolean(par), desempata: par ? par.entre : null,
    };
  }

  // Fase 2 — contrastes.
  // NOTA MEDIDA: com as travas 15 e 16 do §24 em vigor, todo discriminador de
  // contraste tem posturas opostas declaradas pelos dois lados do par; se ambos
  // estão vivos, o eixo é divisivo por construção e a fase 1 já o consumiu. Esta
  // fase portanto NÃO dispara neste corpus — o valor dos contrastes está no
  // relatório ("não investigado" quando a resposta foi "ns" ou "indiferente") e no
  // destaque de desempate da fase 1. O código fica porque a arquitetura de fases
  // é do contrato do motor e um corpus com contraste em eixo não divisivo
  // (por exemplo, com as travas relaxadas) voltaria a alcançá-la.
  const { naoInvestigados } = contrastes(corpus, respostas, estados);
  const abertos = naoInvestigados.filter((t) => respostas[t.discriminador] === undefined);
  if (abertos.length) {
    const lideres = new Set(ranking(corpus, estados, margem).lideres);
    const entreLideres = abertos.find((t) => t.entre.every((id) => lideres.has(id)));
    const t = entreLideres || abertos[0];
    return {
      tipo: "contraste", fase: 2, id: t.discriminador, ...corpus.eixos[t.discriminador],
      naoDiscriminante: !setDe(classes.divisivos).has(t.discriminador),
      entre: t.entre, nota: t.nota || null, inclina: t.inclina || null,
      entreLideres: Boolean(entreLideres),
    };
  }

  // Fase 3 — portões.
  // `opts.pularPortoes` existe para o cliente que trata o conteúdo dos portões de
  // outra forma — a tela de cartões mostra a ressalva na abertura, não como cartão.
  // Sem essa opção, um portão não respondido bloquearia a fase 4 para sempre.
  if (!opts.pularPortoes) {
  // Gatilho lido do estado SEM portões (correção do B1).
  const semPortoes = { ...respostas };
  for (const g of Object.keys(corpus.portoes || {})) delete semPortoes[g];
  const estadosSemPortoes = avaliar(corpus, semPortoes, opts.linhasVermelhas || new Set(), { classes });
  if (ranking(corpus, estadosSemPortoes, margem).ordem.length > 0) {
    const g = Object.keys(corpus.portoes || {}).find((k) => respostas[k] === undefined);
    if (g) return { tipo: "portao", fase: 3, id: g, ...corpus.portoes[g], naoDiscriminante: false };
  }
  }

  // Fase 4 — encerramento complementar, opcional
  if (opts.complementar) {
    const comp = [...classes.unanimes, ...classes.unilaterais]
      .filter((c) => respostas[c.eixo] === undefined)
      .sort((a, b) => b.peso - a.peso || a.eixo.localeCompare(b.eixo));
    if (comp.length) {
      const m = comp[0];
      return {
        tipo: "eixo", fase: 4, id: m.eixo, ...corpus.eixos[m.eixo],
        naoDiscriminante: true, categoria: m.categoria,
        campo: { postura: m.postura, nFalam: m.nFalam, mudos: m.mudos },
        restantes: comp.length,
      };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// analisar() — o orquestrador que a UI e o relatório consomem
// ─────────────────────────────────────────────────────────────────────────────

function analisar(corpus, respostas, linhasVermelhas = new Set(), opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const mortos = eliminacoes(corpus, respostas, linhasVermelhas);
  const vivos = corpus.candidatos.filter((c) => !mortos[c.id]);
  const classes = classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const estados = avaliar(corpus, respostas, linhasVermelhas, { classes });
  const rk = ranking(corpus, estados, margem);

  // §21, regra 3: se TODOS caíram, mostrar o ranking que existiria sem as linhas
  // vermelhas. Devolver conjunto vazio sem explicação é o pior resultado possível.
  const houveEliminacao = Object.values(estados).some((e) => e.estado === "eliminado");
  let contrafactual = null;
  if (houveEliminacao) {
    // Sem linhas vermelhas o conjunto de vivos é outro, e com ele muda a
    // classificação dos eixos: reclassificar é parte do "ranking que existiria".
    const estadosCf = avaliar(corpus, respostas, new Set());
    contrafactual = {
      estados: estadosCf,
      ranking: ranking(corpus, estadosCf, margem),
      classes: classificarEixos(corpus, corpus.candidatos),
    };
  }

  // Efeito colateral do §20 que precisa ser dito em voz alta: eliminar candidatos
  // pode deixar um eixo antes divisivo com um lado só, tirando-o do ranking. Se
  // isso zerar o conjunto discriminante, a afinidade some — e sem explicação isso
  // parece defeito.
  const respondeuAlgo = Object.keys(corpus.eixos).some((e) => {
    const r = respostas[e];
    return r !== undefined && r !== "ns" && r !== "indiferente";
  });
  const diagnostico = {
    semEixosDiscriminantes: classes.divisivos.length === 0,
    rankingVazioComRespostas: respondeuAlgo && rk.ordem.length === 0 && vivos.length > 0,
    reclassificados: houveEliminacao
      ? classificarEixos(corpus, corpus.candidatos).divisivos
          .filter((d) => !classes.divisivos.some((x) => x.eixo === d.eixo))
          .map((d) => d.eixo)
      : [],
  };

  // §22, regra 2: contrastes ainda abertos entre dois líderes empatados.
  const lideres = new Set(rk.lideres);
  const ctr = contrastes(corpus, respostas, estados);
  const desempates = ctr.naoInvestigados.filter((t) => t.entre.every((id) => lideres.has(id)));

  return {
    respostas, linhasVermelhas: [...asSet(linhasVermelhas)], margem,
    estados, ranking: rk, classes, diagnostico,
    decisao: decisaoEstavel(corpus, respostas, estados, { margem, classes }),
    contrastes: { ...ctr, desempates },
    campo: afinidadeComOCampo(corpus, respostas, classes),
    portoes: Object.fromEntries(
      Object.keys(corpus.portoes || {}).map((k) => [k, respostas[k] ?? null])
    ),
    contrafactual,
    todosEliminados: vivos.length === 0,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Rastro
// ─────────────────────────────────────────────────────────────────────────────

/** Diff entre duas análises: o que a última resposta mudou. */
function transicoes(anterior, atual) {
  const estados = [];
  for (const id of Object.keys(atual.estados)) {
    const de = anterior?.estados?.[id]?.estado ?? null;
    const para = atual.estados[id].estado;
    if (de !== para) estados.push({ id, de, para, motivo: atual.estados[id].motivo });
  }
  const ordemDe = anterior?.ranking?.ordem ?? [];
  const ordemPara = atual.ranking.ordem;
  const lideresDe = anterior?.ranking?.lideres ?? [];
  const lideresPara = atual.ranking.lideres;
  const igual = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  return {
    estados,
    ranking: { de: ordemDe, para: ordemPara, mudou: !igual(ordemDe, ordemPara) },
    lideres: { de: lideresDe, para: lideresPara, mudou: !igual(lideresDe, lideresPara) },
  };
}

function explicarMotivo(corpus, motivo) {
  if (!motivo) return null;
  if (motivo.tipo === "linha-vermelha") {
    const e = corpus.eixos[motivo.eixo];
    const dir = motivo.postura === "favor" ? "é favorável" : "é contrário";
    return `ponto inegociável · ${e?.label ?? motivo.eixo} — o plano ${dir} a essa posição`;
  }
  if (motivo.tipo === "portao") {
    // B8 corrigido: o texto vem do portão que disparou, não de uma string fixa.
    const g = corpus.portoes?.[motivo.portao];
    return `portão não atendido · ${g?.nota ?? g?.pergunta ?? motivo.portao}`;
  }
  return `eliminado · ${motivo.tipo}`;
}


/**
 * montarRelatorio() — texto puro, seções fixas, espelhando §27 etapa 7.
 *
 * Esta é a ÚNICA função do projeto com efeito de ambiente: o carimbo de tempo do
 * cabeçalho. Todo o resto vem da análise, que é pura. Passe `meta.geradoEm` para
 * tornar a saída determinística (é o que o executor de perfis faz).
 */

const pct = (x) => (x === null || x === undefined ? "—" : x.toFixed(3));
const cob = (x) => (x === null || x === undefined ? "—" : x.toFixed(2));
const linha = (n = 78) => "─".repeat(n);

function montarRelatorio(corpus, analise, rastro = [], meta = {}) {
  const L = [];
  const nome = (id) => {
    const c = corpus.candidatos.find((x) => x.id === id);
    return c ? `${c.nome}${c.partido ? ` (${c.partido})` : ""}` : id;
  };
  const eixoLabel = (id) => corpus.eixos[id]?.label ?? id;
  const geradoEm = meta.geradoEm ?? new Date().toLocaleString("pt-BR");
  const { estados, ranking: rk, classes, campo, contrastes: ctr, diagnostico } = analise;

  const e = corpus.escopo || {};
  L.push(`PALANQ · COMPARAÇÃO DE PROPOSTAS — ${e.eleicao ?? "?"}, ${e.cargo ?? "?"}, ${e.ambito ?? "?"}`);
  L.push(linha());
  L.push(`Gerado em: ${geradoEm}`);
  L.push(`Corpus: versão ${corpus.corpusVersion} · schema ${corpus.schemaVersion} · status ${corpus.status}`);
  L.push(`Curadoria: ${corpus.curadoria?.responsavel ?? "NÃO IDENTIFICADA"}` +
         (corpus.curadoria?.data ? ` · ${corpus.curadoria.data}` : "") +
         (corpus.curadoria?.revisadoPor ? ` · revisado por ${corpus.curadoria.revisadoPor}` : " · SEM REVISÃO INDEPENDENTE"));
  L.push(`Método de curadoria: ${corpus.curadoria?.metodo ?? "—"}`);
  L.push(`Critério de inclusão: ${corpus.curadoria?.criterioDeInclusao ?? "—"}`);
  if (meta.identificador) L.push(`Identificador da sessão: ${meta.identificador}`);
  L.push("");
  if (corpus.status !== "verified") { L.push(`[ATENÇÃO] ${corpus.aviso}`); L.push(""); }
  for (const lim of corpus.curadoria?.limitacoesConhecidas || []) L.push(`[LIMITAÇÃO] ${lim}`);
  if (corpus.curadoria?.limitacoesConhecidas?.length) L.push("");

  // ── RANKING ───────────────────────────────────────────────────────────────
  L.push("RANKING");
  L.push(linha());
  L.push("Afinidade mede alinhamento NOS PONTOS EM QUE OS CANDIDATOS DIVERGEM entre si —");
  L.push("não é percentual de concordância com o plano. Eixos em que o campo inteiro pensa");
  L.push("igual ficam fora da conta e aparecem em CONSENSO DO CAMPO.");
  L.push("Cobertura é a fração do que você respondeu sobre a qual o candidato se pronunciou.");
  L.push(`Margem de empate: ${rk.margem.toFixed(2)} (parâmetro; candidatos dentro dela são declarados empatados)`);
  L.push("");
  if (!rk.ordem.length) {
    L.push("  Nenhum candidato com afinidade calculável.");
    if (diagnostico?.semEixosDiscriminantes)
      L.push("  Motivo: não há eixo em que os candidatos ainda vivos divirjam entre si.");
    if (analise.todosEliminados) L.push("  Motivo: todas as candidaturas foram eliminadas. Ver ELIMINADOS e RANKING CONTRAFACTUAL.");
  }
  for (const [i, id] of rk.ordem.entries()) {
    const s = estados[id];
    const lider = rk.lideres.includes(id);
    const marca = lider ? (rk.empate ? " ⟨líder — empatado⟩" : " ⟨líder⟩") : "";
    L.push(`  ${String(i + 1).padStart(2)}. ${nome(id).padEnd(34)} afinidade ${pct(s.afinidade)}   cobertura ${cob(s.cobertura)}${marca}`);
  }
  if (rk.empate) {
    L.push("");
    L.push(`  EMPATE declarado entre: ${rk.lideres.map(nome).join(" · ")}`);
    L.push("  Não há ordem entre eles. A diferença está dentro da margem, e a margem existe");
    L.push("  porque os pesos dos eixos foram escolhidos à mão e não têm essa precisão.");
  }
  // §18, regra 3 — o líder com cobertura baixa precisa ser denunciado na mesma tela.
  const alertas = [];
  const PROXIMIDADE = 0.25;   // "logo atrás": 5× a margem padrão de empate
  for (const id of rk.lideres) {
    const s = estados[id];
    if (s.cobertura !== null && s.cobertura < 0.7)
      alertas.push(`${nome(id)} lidera com cobertura ${cob(s.cobertura)}: pronunciou-se sobre menos de 70% do peso que você respondeu.`);
    // "quem vem atrás" (§18, regra 3) é quem está logo atrás — não o campo inteiro.
    // Citar alguém com afinidade 0,21 como referência de cobertura é ruído.
    // Quem tem cobertura maior e está por perto: tanto quem vem logo atrás quanto
    // outro LÍDER empatado. Empatar com quem falou o dobro não é o mesmo empate.
    const perto = rk.ordem
      .filter((x) => x !== id)
      .filter((x) => estados[x].afinidade >= s.afinidade - PROXIMIDADE)
      .filter((x) => estados[x].cobertura !== null && s.cobertura !== null && estados[x].cobertura > s.cobertura + 0.15);
    if (perto.length) {
      const empatados = perto.filter((x) => rk.lideres.includes(x));
      const atras = perto.filter((x) => !rk.lideres.includes(x));
      if (empatados.length)
        alertas.push(`${nome(id)} está empatado com ${empatados.map(nome).join(", ")}, que se pronunciaram sobre bem mais do que você respondeu (cobertura ${empatados.map((x) => cob(estados[x].cobertura)).join(", ")} contra ${cob(s.cobertura)}). Empatar com quem falou o dobro não é o mesmo empate.`);
      if (atras.length)
        alertas.push(`${nome(id)} lidera com cobertura menor que ${atras.map(nome).join(", ")}, logo atrás — falou menos e por isso errou menos.`);
    }
  }
  if (alertas.length) {
    L.push("");
    L.push("  [SILÊNCIO — leia antes do ranking]");
    for (const a of alertas) L.push(`  · ${a}`);
  }
  if (rk.semSinal.length) {
    L.push("");
    L.push(`  Sem afinidade calculável (não declararam nada sobre o que você respondeu): ${rk.semSinal.map(nome).join(", ")}`);
    L.push("  Ausência de posição não é zero e não é concordância. Ficam fora da ordem.");
  }
  L.push("");

  // ── POR QUE / DIVERGÊNCIAS / SILÊNCIOS ────────────────────────────────────
  const comCitacao = (id, eixos) => eixos.map((ex) => {
    const c = corpus.candidatos.find((x) => x.id === id);
    const p = c.posicoes.find((q) => q.eixo === ex);
    const out = [`    · ${eixoLabel(ex)} [peso ${corpus.eixos[ex].peso}] — plano ${p.postura === "favor" ? "é favorável" : "é contrário"}`,
                 `      "${p.citacao.texto}"`,
                 `      ${p.citacao.fonte} · ${p.citacao.local}`];
    if (p.citacao.contexto) out.push(`      contexto: ${p.citacao.contexto}`);
    if (p.interpretacao) out.push(`      [INTERPRETAÇÃO DO CURADOR — a postura não é literal na citação] ${p.interpretacao}`);
    return out.join("\n");
  });

  for (const [titulo, chave, nota] of [
    ["POR QUE", "alinhados", "Eixos em que sua posição coincide com a posição declarada no plano."],
    ["DIVERGÊNCIAS", "divergentes", "Eixos em que sua posição contraria a posição declarada no plano."],
  ]) {
    L.push(titulo); L.push(linha()); L.push(nota); L.push("");
    for (const id of [...rk.ordem, ...rk.semSinal]) {
      const s = estados[id];
      if (!s[chave].length) continue;
      L.push(`  ${nome(id)}`);
      L.push(comCitacao(id, s[chave]).join("\n"));
      L.push("");
    }
  }

  L.push("SILÊNCIOS");
  L.push(linha());
  L.push("Eixos que você respondeu e sobre os quais o plano não diz nada. Não somam nem");
  L.push("subtraem — e é exatamente por isso que reduzem a cobertura. Listados nominalmente.");
  L.push("");
  for (const id of [...rk.ordem, ...rk.semSinal]) {
    const s = estados[id];
    if (!s.silencios.length) continue;
    const peso = s.silencios.reduce((n, ex) => n + corpus.eixos[ex].peso, 0);
    L.push(`  ${nome(id)} — ${s.silencios.length} eixo(s), peso ${peso}`);
    for (const ex of s.silencios) L.push(`    · ${eixoLabel(ex)} [peso ${corpus.eixos[ex].peso}]`);
  }
  L.push("");

  // ── ELIMINADOS ────────────────────────────────────────────────────────────
  const eliminados = corpus.candidatos.filter((c) => estados[c.id].estado === "eliminado");
  L.push("ELIMINADOS");
  L.push(linha());
  if (!eliminados.length) L.push("  Nenhum.");
  for (const c of eliminados) {
    const m = estados[c.id].motivo;
    L.push(`  ${nome(c.id)} — ${explicarMotivo(corpus, m)}`);
    if (m.tipo === "linha-vermelha") {
      L.push(`    ponto: ${eixoLabel(m.eixo)} [marcado por você como inegociável]`);
      L.push(`    "${m.citacao.texto}"`);
      L.push(`    ${m.citacao.fonte} · ${m.citacao.local}`);
      if (m.interpretacao) L.push(`    [INTERPRETAÇÃO DO CURADOR] ${m.interpretacao}`);
    }
  }
  if (analise.contrafactual) {
    L.push("");
    L.push("  RANKING CONTRAFACTUAL — a ordem que existiria sem nenhum ponto inegociável:");
    const cf = analise.contrafactual;
    if (!cf.ranking.ordem.length) L.push("    (nenhuma afinidade calculável)");
    for (const [i, id] of cf.ranking.ordem.entries())
      L.push(`    ${String(i + 1).padStart(2)}. ${nome(id).padEnd(34)} afinidade ${pct(cf.estados[id].afinidade)}   cobertura ${cob(cf.estados[id].cobertura)}`);
  }
  L.push("");

  // ── CONSENSO DO CAMPO ─────────────────────────────────────────────────────
  L.push("CONSENSO DO CAMPO");
  L.push(linha());
  L.push("Eixos que NÃO separam ninguém e por isso não entram no ranking — incluí-los");
  L.push("inverteria a ordem em favor de quem falou pouco (§20 da especificação).");
  L.push("");
  L.push(`  Unânimes (todos os vivos declaram a mesma coisa): ${classes.unanimes.length}`);
  for (const u of classes.unanimes)
    L.push(`    · ${eixoLabel(u.eixo)} — ${u.nFalam} candidatos, todos ${u.postura === "favor" ? "a favor" : "contrários"}`);
  L.push(`  Unilaterais (parte declara, ninguém se opõe): ${classes.unilaterais.length}`);
  for (const u of classes.unilaterais)
    L.push(`    · ${eixoLabel(u.eixo)} — ${u.nFalam} ${u.postura === "favor" ? "a favor" : "contrários"}, ${u.mudos} sem dizer nada`);
  if (classes.mudos.length) {
    L.push(`  Sem nenhuma menção: ${classes.mudos.length}`);
    for (const u of classes.mudos) L.push(`    · ${eixoLabel(u.eixo)}`);
  }
  L.push("");
  if (campo.respondidos) {
    L.push(`  AFINIDADE COM O CAMPO: ${pct(campo.afinidade)}   cobertura ${cob(campo.cobertura)}   (${campo.respondidos} de ${campo.total} eixos respondidos)`);
    L.push("  Métrica separada, que NÃO influencia o ranking. Responde outra pergunta:");
    L.push("  não \"quem é mais parecido comigo\", mas \"o quanto este campo eleitoral inteiro");
    L.push("  me representa\". Afinidade com o campo baixa significa que nenhum ranking entre");
    L.push("  estes candidatos conserta o problema.");
    const compTem = [...rk.ordem, ...rk.semSinal].filter((id) => estados[id].complementar.afinidade !== null);
    if (compTem.length) {
      L.push("");
      L.push("  Por candidato, nos eixos não discriminantes (também fora do ranking):");
      for (const id of compTem) {
        const cp = estados[id].complementar;
        L.push(`    ${nome(id).padEnd(34)} afinidade ${pct(cp.afinidade)}   cobertura ${cob(cp.cobertura)}`);
      }
      L.push("  É aqui que candidaturas empatadas nos eixos divisivos se separam.");
    }
  } else {
    L.push("  Nenhum eixo não discriminante foi respondido. A fase complementar é opcional.");
  }
  L.push("");

  // ── NÃO INVESTIGADO ───────────────────────────────────────────────────────
  L.push("NÃO INVESTIGADO");
  L.push(linha());
  L.push("Pares de candidatos vivos e próximos, e a única coisa que os separa — ainda sem");
  L.push("resposta sua. Esta seção é a defesa contra o fechamento prematuro: o instrumento");
  L.push("existe para dizer o que ficou de fora, não só o que fechou.");
  L.push("");
  if (!ctr.naoInvestigados.length) L.push("  Nenhum. Todos os contrastes ativos foram investigados.");
  for (const t of ctr.naoInvestigados) {
    const destaque = ctr.desempates?.some((d) => d.discriminador === t.discriminador && d.entre.join() === t.entre.join());
    L.push(`  ${t.entre.map(nome).join("  vs  ")}${destaque ? "   ⟨DESEMPATARIA A LIDERANÇA⟩" : ""}`);

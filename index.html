    L.push(`    discriminador: ${eixoLabel(t.discriminador)} — ${t.motivo}`);
    if (t.nota) L.push(`    ${t.nota}`);
  }
  if (ctr.investigados.length) {
    L.push("");
    L.push("  Investigados:");
    for (const t of ctr.investigados)
      L.push(`    ${t.entre.map(nome).join(" vs ")} · ${eixoLabel(t.discriminador)} = "${rotulo(t.resposta)}" → inclina para ${t.inclina ? nome(t.inclina) : "nenhum lado"}`);
  }
  if (ctr.inativos.length) {
    L.push("");
    L.push(`  Inativos (um dos lados eliminado): ${ctr.inativos.map((t) => t.entre.map(nome).join(" vs ")).join(" · ")}`);
  }
  L.push("");

  // ── PORTÕES ───────────────────────────────────────────────────────────────
  L.push("PORTÕES");
  L.push(linha());
  for (const [id, g] of Object.entries(corpus.portoes || {})) {
    const r = analise.portoes[id];
    L.push(`  ${g.pergunta}`);
    L.push(`    resposta: ${r ? rotulo(r) : "[PENDENTE]"}   efeito: ${g.efeito}${g.efeito === "registro" ? " (apenas registro — não altera nenhum estado)" : ""}`);
  }
  L.push("");

  // ── SUAS RESPOSTAS ────────────────────────────────────────────────────────
  L.push("SUAS RESPOSTAS");
  L.push(linha());
  const lv = new Set(analise.linhasVermelhas);
  for (const [id, def] of Object.entries(corpus.eixos)) {
    const r = analise.respostas[id];
    if (r === undefined) continue;
    L.push(`  ${eixoLabel(id)} [peso ${def.peso}]${lv.has(id) ? " [INEGOCIÁVEL]" : ""}: ${rotulo(r)}`);
    if (def.explicacao) L.push(`    ${def.explicacao}`);
    if (def.formulacaoNeutra === false)
      L.push(`    [REDAÇÃO NÃO NEUTRA] ${def.notaRedacao}`);
  }
  const naoResp = Object.keys(corpus.eixos).filter((id) => analise.respostas[id] === undefined);
  if (naoResp.length) {
    L.push("");
    L.push(`  Não perguntados (${naoResp.length}): ${naoResp.map(eixoLabel).join(" · ")}`);
    L.push("  Não perguntado é diferente de ter escolhido não opinar. Nenhum dos dois pesou.");
  }
  L.push("");

  // ── RASTRO ────────────────────────────────────────────────────────────────
  L.push("RASTRO DA AVALIAÇÃO");
  L.push(linha());
  L.push("Cada resposta e o que ela mudou. É isto que permite auditar a conclusão depois.");
  L.push("");
  if (!rastro.length) L.push("  (vazio)");
  for (const [i, passo] of rastro.entries()) {
    const q = passo.pergunta;
    L.push(`  ${String(i + 1).padStart(2)}. [${q.tipo}${q.fase ? ` · fase ${q.fase}` : ""}] ${q.pergunta ?? eixoLabel(q.id)}`);
    L.push(`      resposta: ${rotulo(passo.resposta)}${passo.linhaVermelha ? " · marcado como inegociável" : ""}`);
    const tr = passo.transicoes;
    if (tr?.estados?.length)
      for (const e2 of tr.estados) L.push(`      ${nome(e2.id)}: ${e2.de} → ${e2.para}${e2.motivo ? ` (${explicarMotivo(corpus, e2.motivo)})` : ""}`);
    if (tr?.ranking?.mudou) L.push(`      ranking: ${tr.ranking.de.join(" > ") || "—"}  →  ${tr.ranking.para.join(" > ") || "—"}`);
    if (tr?.lideres?.mudou) L.push(`      líderes: ${tr.lideres.de.join(", ") || "—"}  →  ${tr.lideres.para.join(", ") || "—"}`);
    if (!tr?.estados?.length && !tr?.ranking?.mudou && !tr?.lideres?.mudou) L.push("      (nada mudou no ranking)");
  }
  L.push("");

  // ── PLANOS ────────────────────────────────────────────────────────────────
  L.push("PLANOS DE GOVERNO INTEGRAIS");
  L.push(linha());
  L.push("As citações deste relatório são resumos. Os documentos abaixo prevalecem sobre");
  L.push("qualquer coisa dita aqui. Leia o plano de quem você está considerando.");
  L.push("");
  for (const c of corpus.candidatos) L.push(`  ${nome(c.id).padEnd(34)} ${c.planoUrl ?? "—"}`);
  L.push("");

  L.push(linha());
  L.push("Este documento compara POSIÇÕES DECLARADAS EM DOCUMENTOS. NÃO RECOMENDA VOTO.");
  L.push("Ignora, por construção: histórico de mandato, capacidade de execução, coalizão,");
  L.push("financiamento de campanha e a distância conhecida entre plano de governo e governo.");
  L.push("A escolha dos eixos e das citações é o maior viés deste sistema, e ele é invisível");
  L.push("no resultado: quem decidiu quais eixos existem determinou o resultado antes da sua");
  L.push("primeira resposta.");
  return L.join("\n");
}


const CORPUS = Object.freeze({"schemaVersion":"1.0.0","corpusVersion":"0.2.0","escopo":{"eleicao":"Eleição Geral de 2026","cargo":"Presidente da República","ambito":"Brasil","turno":1},"status":"draft","aviso":"Este comparador ainda não passou por revisão independente. Todas as frases citadas são trechos reproduzidos literalmente dos planos de governo registrados, com a página indicada e um link para o documento completo. O que falta é alguém de fora conferir as escolhas de quem montou a comparação: quais temas entraram e qual trecho representa cada candidatura. Ele compara posições declaradas em documentos e NÃO recomenda voto.","curadoria":{"responsavel":null,"data":"2026-08-26","metodo":"Os planos de governo registrados das 12 candidaturas foram lidos por inteiro e percorridos tema a tema. Uma posição só entrou na comparação quando o plano a afirma por escrito; a frase citada é o próprio texto do plano, e a página é indicada ao lado. Quando a posição não está literal na frase e foi deduzida dela, a dedução aparece em destaque junto da citação, para você poder recusá-la. Não dizer nada sobre um assunto nunca foi tratado como ser contra ele.","criterioDeInclusao":"Um tema entra quando ao menos uma candidatura declara posição sobre ele por escrito. Temas em que ninguém se opõe ficam de fora do ranking — não separam ninguém — e são apresentados à parte, como retrato do que o conjunto das candidaturas pensa.","revisadoPor":null,"limitacoesConhecidas":["As frases são literais, mas a escolha delas não é: um trecho citado é sempre um trecho entre outros do mesmo plano. Nenhuma verificação automática protege contra uma escolha tendenciosa — só a revisão de alguém de fora, que esta comparação ainda não teve.","A importância atribuída a cada tema foi decidida por quem montou a comparação e não vem dos planos. Ela altera o resultado.","Planos muito curtos, ou escritos como roteiro genérico, rendem poucas posições e cobertura baixa. Isso diz respeito ao documento, não à candidatura — e a cobertura, exibida sempre ao lado da afinidade, existe para tornar essa diferença visível.","A leitura automática de PDF introduz pequenos ruídos de espaçamento. Diferenças de formatação em relação ao original são artefato dessa leitura, não alteração de conteúdo.","Cobertura baixa pode significar que a candidatura não se posicionou — ou que este projeto não encontrou onde ela se posicionou. Uma segunda passada de extração já corrigiu sete casos; restam lacunas não lidas uma a uma. Enquanto for assim, a cobertura é um piso, não uma medida."]},"eixos":{"e_privatizacao_estatais":{"label":"Privatização de empresas estatais","pergunta":"O Estado deve vender as empresas estatais que controla hoje?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O governo é dono de empresas como Petrobras, Correios e bancos públicos. Privatizar é vendê-las a investidores. Quem defende diz que empresa privada é mais eficiente e que a venda abate dívida; quem é contra diz que o país perde controle sobre setores estratégicos e que o novo dono passa a cobrar pelo que era serviço."},"e_ppp_servicos_publicos":{"label":"PPPs e concessões em serviços públicos","pergunta":"Serviços públicos como saúde, educação e infraestrutura devem ser prestados por concessões e parcerias público-privadas?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O serviço continua público e gratuito para você, mas quem constrói e opera é uma empresa contratada, remunerada pelo Estado ou por tarifa — como já acontece em rodovias e em alguns hospitais. Discute-se se entrega mais rápido e mais barato, ou se transfere o lucro ao particular e deixa o risco com o poder público."},"e_gestao_privada_saude":{"label":"Organizações sociais e setor privado no SUS","pergunta":"O poder público deve entregar a gestão de serviços de saúde a organizações sociais e comprar atendimento da rede privada?","dominio":"saude","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Em vez de contratar médicos por concurso, o poder público paga uma organização social para tocar o hospital, ou compra consultas e exames de clínicas privadas. O atendimento segue pelo SUS e de graça. Discute-se se diminui fila, ou se precariza o vínculo de quem trabalha e drena dinheiro da rede própria."},"e_ans_planos_flexiveis":{"label":"Desregulação dos planos de saúde","pergunta":"A regulação dos planos de saúde deve ser flexibilizada, permitindo produtos com cobertura reduzida e preço menor?","dominio":"saude","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Hoje todo plano de saúde é obrigado a cobrir uma lista mínima de procedimentos. Flexibilizar é permitir planos mais baratos que cobrem menos. Quem defende diz que dá acesso a quem não tem plano nenhum; quem é contra diz que a pessoa só descobre o que ficou de fora na hora em que adoece."},"e_ensino_civico_militar":{"label":"Escolas cívico-militares","pergunta":"As escolas cívico-militares devem ser ampliadas na educação básica?","dominio":"educacao","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"São escolas públicas comuns em que militares ou policiais da reserva cuidam da disciplina, do uniforme e da rotina, enquanto professores civis dão as aulas. Discute-se se isso melhora o ambiente e as notas, ou se escola não é lugar de hierarquia militar."},"e_negociado_sobre_legislado":{"label":"Negociado sobre o legislado","pergunta":"O que empregado e empregador negociarem deve prevalecer sobre o que a lei estabelece?","dominio":"trabalho","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Hoje a CLT define um piso que nenhum acordo pode rebaixar. A mudança permite que o acordo entre empresa e trabalhadores valha mais do que a lei em pontos como jornada e intervalos. Quem defende fala em flexibilidade para cada setor; quem é contra diz que quem precisa do emprego não negocia de igual para igual."},"e_estabilidade_emprego":{"label":"Estabilidade no emprego","pergunta":"A lei deve garantir estabilidade no emprego depois de um período de vínculo?","dominio":"trabalho","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Depois de um tempo de casa, a empresa não poderia demitir sem justificar o motivo — como já vale para servidores concursados. Quem defende fala em segurança para planejar a vida; quem é contra diz que empresa que não pode demitir também contrata menos."},"e_renda_sem_contrapartida":{"label":"Transferência de renda sem contrapartida","pergunta":"Programas de transferência de renda devem ser pagos sem exigir contrapartida em trabalho ou serviço comunitário?","dominio":"social","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"É o desenho do Bolsa Família: o dinheiro entra na conta de quem está abaixo de uma linha de renda, sem exigir trabalho em troca. A alternativa é pagar mediante horas de serviço comunitário. Discute-se se a contrapartida ajuda a sair da pobreza ou se vira mão de obra barata."},"e_encarceramento_excecao":{"label":"Suspensão de garantias como política penal","pergunta":"A segurança pública deve adotar um regime prisional de exceção, com encarceramento em larga escala e restrição de garantias individuais?","dominio":"seguranca","peso":3,"formulacaoNeutra":false,"notaRedacao":"Não há redação deste eixo que descreva o mecanismo sem já o qualificar: \"suspensão de garantias\" e \"regime de exceção\" são os termos usados pelas próprias candidaturas dos dois lados, e ambos carregam juízo. Marcado para revisão.","explicacao":"É o modelo aplicado em El Salvador: prender em massa e suspender temporariamente garantias como o direito de defesa e o limite de tempo sem julgamento. Não se trata de construir presídio de segurança máxima, o que quase todos defendem, mas de afrouxar as regras do processo. Quem defende aponta a queda de homicídios lá; quem é contra aponta prisões de inocentes e mortes sob custódia."},"e_autonomia_banco_central":{"label":"Autonomia do Banco Central","pergunta":"O Banco Central deve manter autonomia em relação ao governo para definir a política monetária?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O Banco Central define os juros básicos, e hoje seu presidente tem mandato fixo — não pode ser demitido pelo presidente da República. Acabar com a autonomia devolve essa decisão à influência do governo. Quem defende a autonomia diz que ela protege contra inflação em ano eleitoral; quem é contra diz que juro alto demais trava emprego e que ninguém elegeu quem decide."},"e_margem_equatorial":{"label":"Exploração de novas fronteiras de petróleo","pergunta":"Novas fronteiras de exploração de petróleo, como a Margem Equatorial, devem ser abertas?","dominio":"energia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A Margem Equatorial é a costa entre o Amapá e o Rio Grande do Norte, perto da foz do Amazonas, onde há indício de muito petróleo. Abrir a exploração é autorizar perfuração em área ambientalmente sensível. Discute-se se o país deve extrair essa riqueza enquanto ela vale algo, ou se apostar em petróleo novo contradiz o compromisso climático."},"e_reforma_agraria":{"label":"Reforma agrária e desapropriação","pergunta":"A reforma agrária deve continuar, com desapropriação de terras e criação de novos assentamentos?","dominio":"agrario","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O governo desapropria terras que não cumprem função social, indeniza o dono e assenta famílias sem terra. Continuar é criar novos assentamentos; parar é concentrar esforço em tornar produtivos os que já existem. Discute-se se corrige uma concentração histórica de terra ou se atrapalha a produção e estimula invasões."},"e_tributar_altas_rendas":{"label":"Tributar grandes fortunas, lucros e heranças","pergunta":"Grandes fortunas, heranças e lucros e dividendos devem ser tributados, ainda que isso eleve a carga tributária total?","dominio":"tributacao","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O Brasil cobra pouco sobre patrimônio, herança e lucro distribuído a sócios, e muito sobre consumo — o que pesa proporcionalmente mais em quem ganha menos. A proposta cria ou aumenta imposto sobre o topo. Quem defende fala em justiça e em financiar serviços; quem é contra diz que capital sai do país e que o Estado deveria gastar melhor antes de arrecadar mais."},"e_reforma_previdencia":{"label":"Nova reforma da previdência","pergunta":"Uma nova reforma da previdência deve elevar a idade mínima de aposentadoria automaticamente, conforme a expectativa de vida?","dominio":"previdencia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A idade mínima para se aposentar passaria a subir sozinha, conforme os brasileiros vivem mais, sem depender de nova votação. Quem defende diz que é o que mantém a conta fechando com menos jovens contribuindo; quem é contra diz que quem faz trabalho pesado não chega inteiro a essa idade."},"e_alinhamento_brics":{"label":"Permanência no BRICS","pergunta":"O Brasil deve permanecer no BRICS e manter uma política externa independente das grandes potências ocidentais?","dominio":"externa","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O BRICS reúne Brasil, Rússia, Índia, China e outros, como bloco fora da órbita dos Estados Unidos e da Europa. Permanecer é manter essa aposta; sair é aproximar-se do bloco ocidental. Discute-se se o país ganha mais barganhando com todos ou escolhendo um lado."},"e_licenciamento_simplificado":{"label":"Licenciamento ambiental simplificado","pergunta":"O licenciamento ambiental deve ser simplificado, com prazos fixos e ritos abreviados para acelerar obras e investimentos?","dominio":"ambiental","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Antes de uma obra ou mineração começar, órgãos ambientais analisam impactos e podem exigir mudanças. Simplificar é fixar prazos curtos e dispensar etapas para projetos tidos como de menor risco. Quem defende diz que hoje obra trava por anos; quem é contra lembra que desastres recentes passaram por licenciamento abreviado."},"e_liberdade_irrestrita_redes":{"label":"Liberdade de expressão irrestrita nas redes","pergunta":"O debate nas redes deve correr sem moderação, com as plataformas proibidas de remover conteúdo e suspender perfis?","dominio":"comunicacao","peso":3,"formulacaoNeutra":false,"notaRedacao":"\"Censura\" e \"moderação\" descrevem o mesmo ato com sinais opostos, e as duas candidaturas deste eixo usam palavras diferentes para ele. A pergunta descreve o mecanismo (remover conteúdo e suspender perfis) para evitar escolher entre os dois vocabulários, mas a escolha não é neutra. Marcado para revisão.","explicacao":"Hoje as plataformas removem posts e derrubam perfis por regras próprias, e a Justiça também manda tirar conteúdo do ar. A proposta proíbe essa remoção: o que fosse ilegal se resolveria depois, com processo e indenização. Quem defende diz que nem empresa nem juiz deveria decidir o que pode ser dito; quem é contra diz que golpe, fraude e ataque coordenado se espalham antes de qualquer processo terminar."},"e_mineracao_terras_indigenas":{"label":"Mineração em terras indígenas","pergunta":"A exploração mineral dentro de terras indígenas deve ser regulamentada?","dominio":"agrario","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A Constituição admite mineração em terra indígena se o Congresso aprovar uma lei regulamentando — o que nunca aconteceu, então hoje toda extração ali é ilegal. Regulamentar é criar essa lei, com regras de consulta e divisão de ganhos. Discute-se se organiza o que hoje é garimpo criminoso, ou se abre território protegido a mineradoras."},"e_reducao_jornada":{"label":"Redução legal da jornada de trabalho","pergunta":"A jornada semanal de trabalho deve ser reduzida por lei, sem redução de salário?","dominio":"trabalho","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Reduzir por lei a jornada semanal — por exemplo, acabar com a escala de seis dias de trabalho e um de folga — mantendo o salário. Quem defende diz que a produtividade já cresceu o bastante para dividir o ganho em tempo livre; quem é contra diz que o custo por hora sobe e o emprego formal encolhe."},"e_vigilancia_massa":{"label":"Reconhecimento facial e vigilância eletrônica","pergunta":"Reconhecimento facial e vigilância eletrônica devem ser usados em larga escala na segurança pública?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Câmeras nas ruas comparam rostos com bancos de dados de procurados, em tempo real. Quem defende aponta prisões de foragidos; quem é contra aponta erros de identificação — mais frequentes com pessoas negras — e o fato de todos passarem a ser filmados e conferidos o tempo todo."},"e_ministerio_seguranca":{"label":"Ministério da Segurança Pública","pergunta":"Deve ser criado um ministério federal dedicado à segurança pública?","dominio":"seguranca","peso":1,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Segurança pública hoje é responsabilidade sobretudo dos estados, e a União coordena pouco. Criar o ministério dá ao governo federal comando próprio para integrar polícias, dados e fronteiras. Discute-se se resolve a falta de coordenação ou se apenas soma mais uma estrutura à que já existe."},"e_ensino_integral":{"label":"Escola em tempo integral","pergunta":"A escola pública em tempo integral deve ser ampliada?","dominio":"educacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O aluno passa o dia inteiro na escola, em vez de um turno, com aulas, reforço, esporte e refeições. Quem defende fala em aprendizagem e em tirar a criança da rua; a dificuldade é custo, professor e prédio — cada vaga integral custa perto do dobro."},"e_interoperabilidade_saude":{"label":"Prontuário eletrônico integrado","pergunta":"Prontuários e exames devem ser centralizados numa base nacional integrada?","dominio":"saude","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Seu histórico, exames e receitas ficariam num sistema único, acessível em qualquer posto ou hospital do país. Evita repetir exame e ajuda em emergência. A discussão é sobre quem pode ver esses dados e o que acontece se vazarem."},"e_desmilitarizacao":{"label":"Desmilitarização das polícias","pergunta":"As polícias militares devem se tornar forças civis de policiamento de proximidade?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A polícia militar deixaria de ter estrutura, hierarquia e formação de caserna, virando polícia civil de bairro. Quem defende diz que treinamento militar produz confronto onde caberia mediação; quem é contra diz que a disciplina militar é o que sustenta uma força que atua armada na rua."},"e_isolamento_liderancas":{"label":"Isolamento de lideranças de facções","pergunta":"Lideranças de facções devem ser isoladas em presídios federais de segurança máxima, com a comunicação bloqueada?","dominio":"seguranca","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Chefes de facção iriam para presídios federais longe de sua região, com visita restrita e bloqueio de celular, para não seguirem mandando no crime de dentro da cadeia. Tem apoio amplo; discute-se o custo e se o comando apenas passa para outro nome."},"e_reforma_administrativa":{"label":"Reforma administrativa e corte de ministérios","pergunta":"Uma reforma administrativa deve cortar ministérios, cargos comissionados e supersalários?","dominio":"estado","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Reduzir o número de ministérios, cortar cargos de confiança e limitar salários acima do teto no funcionalismo. Quem defende fala em máquina mais barata; quem é contra diz que o corte costuma cair sobre serviço que atende gente, e não sobre os privilégios do topo."},"e_simplificacao_fiscal":{"label":"Simplificação tributária","pergunta":"As obrigações tributárias devem ser simplificadas e digitalizadas para reduzir o custo de conformidade?","dominio":"tributacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Empresas gastam milhares de horas por ano só para calcular e declarar imposto. Simplificar é unificar regras e automatizar isso: não muda quanto se paga, muda o trabalho de pagar. É das poucas ideias com apoio quase unânime."},"e_ia_soberania_digital":{"label":"Inteligência artificial e soberania digital","pergunta":"O Estado deve investir pesadamente em inteligência artificial e infraestrutura digital própria como política nacional?","dominio":"tecnologia","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O Estado investir em centros de dados, modelos e nuvem próprios, em vez de depender de empresas estrangeiras. Quem defende fala em não ficar refém de tecnologia de fora; quem é contra questiona o custo e se o governo consegue acompanhar o ritmo do setor privado."},"e_estatizacao_setores":{"label":"Monopólio estatal em setores estratégicos","pergunta":"Setores estratégicos como energia, mineração e telecomunicações devem ser monopólio estatal?","dominio":"economia","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Energia, mineração, telecomunicações e bancos passariam a ser operados só pelo Estado, sem concorrência privada. É mais forte do que reestatizar uma empresa: fecha o setor inteiro. Quem defende diz que serviço essencial não deve dar lucro a ninguém; quem é contra lembra de fila, atraso e falta de investimento em monopólios estatais."},"e_auditoria_divida":{"label":"Suspensão e auditoria da dívida pública","pergunta":"O pagamento da dívida pública deve ser suspenso e seus contratos auditados?","dominio":"fiscal","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Boa parte do orçamento vai para juros e amortização da dívida pública. A proposta é suspender esses pagamentos e revisar contrato por contrato antes de retomar. Quem defende diz que esse dinheiro faltaria menos na saúde; quem é contra diz que país que suspende pagamento perde crédito e paga mais caro depois."},"e_arcabouco_fiscal":{"label":"Regras de teto de gastos","pergunta":"Devem ser mantidas regras que limitam o crescimento do gasto público, como o arcabouço fiscal?","dominio":"fiscal","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"É a regra que limita quanto o gasto público pode crescer por ano, para a dívida não subir sem parar. Quem defende diz que sem limite a inflação e os juros voltam; quem é contra diz que a regra corta investimento e serviço justamente quando mais se precisa deles."},"e_controle_externo_stf":{"label":"Limitação e controle do Supremo","pergunta":"O poder do Supremo Tribunal Federal deve ser limitado, com mandato para ministros ou controle externo?","dominio":"justica","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Ministros do Supremo ficam no cargo até os 75 anos e são fiscalizados por eles mesmos. As propostas variam: mandato com prazo, órgão externo de correição, aval do Senado para derrubar leis. Quem defende fala em freio a decisões individuais de muito alcance; quem é contra diz que tribunal sob pressão política deixa de proteger quem é minoria."},"e_reeleicao":{"label":"Fim da reeleição no Executivo","pergunta":"A reeleição consecutiva para presidente, governadores e prefeitos deve acabar?","dominio":"politica","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Presidente, governador e prefeito não poderiam mais disputar um segundo mandato seguido. Quem defende diz que o mandatário usa a máquina para se reeleger e governa pensando na próxima eleição; quem é contra diz que tira do eleitor o direito de manter quem vai bem."},"e_emendas_parlamentares":{"label":"Controle das emendas parlamentares","pergunta":"As emendas parlamentares devem ser restringidas e ter rastreabilidade obrigatória?","dominio":"orcamento","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Emendas são fatias do orçamento que cada parlamentar direciona para onde quiser, hoje em boa parte sem rastro de quem pediu. Restringir e rastrear é obrigar a dizer quem indicou, para onde foi e o que foi entregue. Discute-se se limita a barganha política ou se reduz o poder do Legislativo sobre o orçamento."},"e_fim_fundo_eleitoral":{"label":"Fim do fundo eleitoral e partidário","pergunta":"O financiamento público de partidos e campanhas deve acabar?","dominio":"politica","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Campanhas e partidos hoje são bancados por dinheiro público, já que doação de empresa é proibida. Acabar com o fundo faria a campanha depender só de doação de pessoas físicas. Quem defende diz que é dinheiro que faria mais falta em outro lugar; quem é contra diz que sem fundo só quem tem dinheiro ou acesso a doadores disputa."},"e_maioridade_penal":{"label":"Redução da maioridade penal","pergunta":"A maioridade penal deve ser reduzida?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Hoje quem tem menos de 18 anos responde pelo ECA e cumpre no máximo três anos de internação. Reduzir é responder como adulto e ir para presídio comum a partir dos 16. Quem defende fala em crimes graves cometidos por adolescentes; quem é contra diz que presídio brasileiro devolve a pessoa pior do que entrou."},"e_porte_arma_rural":{"label":"Porte de arma no meio rural","pergunta":"O produtor rural deve poder portar arma em toda a extensão de sua propriedade?","dominio":"seguranca","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"O produtor rural já pode ter arma em casa; a proposta estende o direito de andar armado por toda a extensão da propriedade, que pode ter quilômetros. Quem defende fala em socorro que demora horas para chegar; quem é contra diz que amplia o risco em conflitos por terra."},"e_homeschooling":{"label":"Educação domiciliar","pergunta":"O ensino domiciliar (homeschooling) deve ser regulamentado?","dominio":"educacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"A família educaria a criança em casa, sem matrícula em escola, com avaliação periódica pelo Estado. É comum nos Estados Unidos e hoje proibido no Brasil. Quem defende fala em liberdade da família; quem é contra diz que a escola também é onde a criança convive com quem é diferente e onde maus-tratos são percebidos."},"e_descriminalizacao_drogas":{"label":"Descriminalização das drogas","pergunta":"As drogas devem ser descriminalizadas, encerrando a política de guerra às drogas?","dominio":"seguranca","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Usar e portar droga para consumo próprio deixaria de ser crime — o tráfico continuaria sendo. É o que Portugal faz desde 2001, tratando dependência como caso de saúde. Quem defende diz que a lei atual enche presídio de usuário pobre e pequeno traficante; quem é contra diz que afrouxar a lei aumenta o consumo."},"e_aborto":{"label":"Descriminalização do aborto","pergunta":"O aborto deve ser descriminalizado e legalizado?","dominio":"saude","peso":3,"formulacaoNeutra":false,"notaRedacao":"Tema em que a formulação da pergunta move a resposta mais do que em qualquer outro eixo do corpus. A redação adotada usa os termos da citação favorável (\"descriminalização e legalização\"); uma redação a partir do lado contrário (\"vida desde a concepção\") colheria respostas diferentes. Marcado para revisão.","explicacao":"Hoje o aborto é crime, com três exceções: risco de vida da mulher, gravidez por estupro e feto sem cérebro. Descriminalizar é deixar de ser crime; legalizar é oferecer o procedimento na rede de saúde. É o tema mais dividido deste comparador, e a forma de perguntar já influencia a resposta."},"e_cotas_trans":{"label":"Cotas e políticas para pessoas trans","pergunta":"Deve haver cotas para pessoas trans em universidades e concursos públicos?","dominio":"social","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Reservar vagas em universidade e concurso público para pessoas trans, como já existe para candidatos negros e pessoas com deficiência. Quem defende aponta a expectativa de vida e a exclusão desse grupo do mercado formal; quem é contra diz que a seleção deveria olhar só o mérito."},"e_passe_livre":{"label":"Tarifa zero no transporte público","pergunta":"O transporte público deve ter tarifa zero, custeada integralmente pelo Estado?","dominio":"transporte","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Ninguém paga passagem: o custo do ônibus e do metrô sai inteiro do orçamento público, como já acontece com escola e posto de saúde. Algumas cidades brasileiras já fazem. Discute-se se cabe no caixa e o que se deixa de financiar para pagar."},"e_plebiscito_penitenciario":{"label":"Plebiscito sobre o modelo penitenciário","pergunta":"O modelo penitenciário do país deve ser decidido por plebiscito popular?","dominio":"seguranca","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Em vez de o governo decidir sozinho como serão os presídios, a pergunta iria a voto popular. Quem defende diz que decisão desse tamanho precisa de mandato explícito; quem é contra diz que política penal por votação tende ao mais severo e que direito fundamental não se decide por maioria."},"e_fusao_municipios":{"label":"Fusão compulsória de municípios","pergunta":"Pequenos municípios economicamente inviáveis devem ser fundidos compulsoriamente?","dominio":"federativo","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Municípios pequenos demais para se sustentar — que vivem de repasse e gastam quase tudo com a própria máquina — seriam fundidos a vizinhos. Quem defende fala em economia e serviço melhor; quem é contra diz que a cidade pequena perde voz e o serviço fica mais longe."},"e_unicameralismo":{"label":"Parlamento unicameral e conselhos populares","pergunta":"O Congresso deve ser substituído por um parlamento unicameral com conselhos populares deliberativos?","dominio":"politica","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Acabar com o Senado e deixar uma câmara só, somada a conselhos de trabalhadores e moradores com poder de decidir. Quem defende diz que duas casas emperram e que o Senado super-representa estados pequenos; quem é contra diz que a segunda casa é freio contra decisão tomada no calor do momento."},"e_estatizacao_midia":{"label":"Estatização de grupos de comunicação","pergunta":"As concessões dos grandes grupos de mídia devem ser canceladas e seus ativos transferidos ao controle dos trabalhadores?","dominio":"comunicacao","peso":3,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Cancelar as concessões de rádio e TV dos grandes grupos e passar o controle desses veículos a trabalhadores do setor. Quem defende fala em quebrar a concentração de quem informa o país; quem é contra diz que governo escolhendo quem pode transmitir é o começo da censura."},"e_saude_animal_unica":{"label":"Saúde única (humana, animal e ambiental)","pergunta":"A política sanitária deve integrar saúde humana, animal e ambiental num único sistema de vigilância?","dominio":"saude","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Vigiar junto a saúde de pessoas, animais e ambiente, porque a maior parte das epidemias novas começa em animal. Na prática, é integrar veterinária, saúde pública e meio ambiente num sistema só de alerta. Há pouca controvérsia; a discussão é de custo e prioridade."},"e_gestao_emocional_educacao":{"label":"Educação socioemocional","pergunta":"O ensino básico deve incorporar formalmente o desenvolvimento socioemocional ao currículo?","dominio":"educacao","peso":2,"formulacaoNeutra":true,"notaRedacao":null,"explicacao":"Incluir no currículo o ensino de lidar com frustração, ansiedade e conflito, com aula e método próprios, e não só como projeto isolado da escola. Quem defende aponta o adoecimento mental de adolescentes; quem é contra diz que a escola já não dá conta do básico e que isso é papel da família."}},"portoes":{"p_apto":{"pergunta":"Você está apto a votar nesta eleição (título eleitoral em situação regular)?","nota":"Sem aptidão eleitoral a comparação não tem consequência prática. Nenhuma candidatura se sustenta como resultado.","efeito":"invalida-todos-se-nao"},"p_ciente_limites":{"pergunta":"Você entende que este instrumento compara apenas posições declaradas em documentos — ignorando histórico de mandato, capacidade de execução, coalizão e financiamento — e que ele não recomenda voto?","nota":"Portão de registro. Não altera nenhum estado; a resposta é gravada no relatório.","efeito":"registro"}},"candidatos":[{"id":"C01","nome":"Flávio Bolsonaro","partido":"PL","planoUrl":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","planoNota":"Plano de governo integral (76 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"favor","citacao":{"texto":"E vamos retomar o Programa Nacional de Desestatização com critério, avaliando caso a caso onde a presença do Estado deixou de fazer sentido.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 70 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"Também estruturaremos uma Rede Nacional de Cuidado, ampliando o apoio a idosos e pessoas com deficiência, com centros-dia e atendimento domiciliar em parcerias público privado com estados, municípios e organizações sociais.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 21 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"Vamos ampliar as Escolas Cívico-Militares, que uniram disciplina e bom desempenho onde foram implantadas, e garantir atendimento ao aluno com altas habilidades, que hoje se perde por falta de estímulo: a política nacional que trata do tema é lei mas segue sem implementação, e nós vamos tirá-la do papel.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 35 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"favor","citacao":{"texto":"Por isso defendemos o negociado sobre o legislado, ou seja, permitir que trabalhador e empresa combinem diretamente as condições de trabalho que funcionam para os dois, dentro da lei, em vez de seguir uma regra única imposta a todos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 44 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"O esforço de simplificação continuará: menos impostos, legislação unificada, desoneração das exportações e dos investimentos e redução das exceções, para que grupos parecidos paguem impostos parecidos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 30 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida do compromisso declarado de reduzir a carga tributária total, que é incompatível com a criação de um novo tributo sobre patrimônio."},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Se não decidir nem se manifestar dentro desse prazo, a licença deve ser concedida, porque a demora do Estado não pode ser um castigo para quem fez a sua parte.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 50 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reducao_jornada","postura":"contra","citacao":{"texto":"Situações que se repetem na discussão de jornada – onde o governo deseja ignorar a prevalência do negociado sobre o legislado – ou na discussão de situações já pacificadas pela reforma trabalhista, aprovada há quase dez anos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 45 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não rejeita a redução de jornada em si; rejeita que ela seja imposta por lei em vez de negociada. A postura \"contra\" refere-se à redução LEGAL da jornada e é inferida dessa posição."},{"eixo":"e_vigilancia_massa","postura":"favor","citacao":{"texto":"Luz, câmara, prisão Vamos implantar o Muralha Brasileira - um sistema nacional de reconhecimento facial integrado a bancos de dados criminais, inspirado no Smart Sampa, da Prefeitura de São Paulo, e no Muralha Paulista, do Governo do Estado.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 15 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"Apoiamos a escola em tempo integral, para que a criança tenha mais tempo de aprendizado, reforço e atividades formativas, e não fique entregue à própria sorte no contraturno.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 35 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Saúde digital e prontuário eletrônico único seu histórico de saúde vai com você Todos os anos, milhares de brasileiros morrem de doenças que poderiam ter sido tratadas a tempo, porque a informação sobre a própria saúde está","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 25 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_isolamento_liderancas","postura":"favor","citacao":{"texto":"Mais presídios, menos bandidos soltos O Brasil terá 5 novos presídios de segurança máxima no modelo adotado por El Salvador.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 14 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_administrativa","postura":"favor","citacao":{"texto":"Isso inclui o corte de no mínimo 10 ministérios, a redução de cargos comissionados e de despesas administrativas e o combate aos penduricalhos e supersalários que corroem o orçamento, tudo com um objetivo: mais eficiência e racionalidade para servir à sociedade.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 69 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_simplificacao_fiscal","postura":"favor","citacao":{"texto":"O esforço de simplificação continuará: menos impostos, legislação unificada, desoneração das exportações e dos investimentos e redução das exceções, para que grupos parecidos paguem impostos parecidos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 30 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ia_soberania_digital","postura":"favor","citacao":{"texto":"Inteligência artificial a serviço do cidadão o governo se antecipa à sua necessidade A inteligência artificial não precisa ser uma abstração distante.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 25 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"Vamos construir o equilíbrio fiscal duradouro, entregando superávits primários e limitando o crédito subsidiado com recursos do Tesouro, mitigando pressões inflacionárias.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 71 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"Fim das competências criminais originárias do STF, permitindo que parlamentares sejam julgados por instâncias inferiores, como o STJ ou os TRFs, para que exerçam seus mandatos com mais altivez, sem que isso represente qualquer contrapartida de impunidade.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 65 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"No mesmo esforço de organizar melhor o orçamento, daremos mais transparência, controle e rastreabilidade às emendas parlamentares, priorizando sua alocação em políticas públicas prioritárias do Plano Plurianual, aprovado pelo parlamento.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 69 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"O crime do menor não é menor O novo governo do Brasil vai apoiar e sancionar a redução da maioridade penal de 18 para 16 anos.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 13 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_aborto","postura":"contra","citacao":{"texto":"Nossos valores Nossa forma de governar permanece fiel a valores que consideramos inegociáveis e que sustentam a sociedade brasileira: o respeito à liberdade, à família, à vida desde a concepção, à propriedade privada, à democracia, à liberdade de expressão e à liberdade religiosa.","fonte":"Plano de governo registrado — Flávio Bolsonaro (PL)","local":"página 9 de 76","url":"https://static.poder360.com.br/uploads/2026/08/FLAVIO-BOLSONARO-PARA-O-BRASIL-VENCER-O-ATRASO-1-1.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C02","nome":"Ronaldo Caiado","partido":"PSD","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","planoNota":"Plano de governo integral (100 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Ampliação das concessões e parcerias público-privadas Manter um calendário permanente e previsível de leilões (dando continuidade ao Programa de Parcerias em Investimentos, o PPI) em rodovias, ferrovias, portos, aeroportos, saneamento, energia e infraestrutura social, como hospitais, escolas e iluminação pública.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 47 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"mobilizar hospitais públicos, filantrópicos, universitários e privados contratados quando necessário;","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 77 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_renda_sem_contrapartida","postura":"favor","citacao":{"texto":"Transferência de renda com segurança e porta de saída Preservar os programas de transferência de renda, atualizar cadastros e combater fraude sem constranger beneficiários.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 61 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_autonomia_banco_central","postura":"favor","citacao":{"texto":"Coordenar políticas fiscal e monetária com respeito à autonomia do Banco Central Reduzir pressões fiscais sobre preços, aperfeiçoar comunicação e previsibilidade e criar condições para que inflação controlada, juros menores e desenvolvimento coexistam de forma sustentável.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"favor","citacao":{"texto":"Petróleo: pilar da matriz, motor da transição Assegurar previsibilidade na oferta de petróleo e derivados, orientando a avaliação de novas fronteiras pelo rigor ambiental, pela segurança operacional e pela melhor evidência técnica disponível.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 37 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"COMPROMISSO: estabilizar a dívida, reconstruir superávits, proteger o investimento e reduzir o peso dos juros sem transferir a conta aos mais pobres e sem recorrer a aumentos permanentes de carga tributária.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida do compromisso explícito de não recorrer a aumentos permanentes de carga tributária."},{"eixo":"e_alinhamento_brics","postura":"favor","citacao":{"texto":"Multilateralismo com resultado e aproximação com a OCDE Participar ativamente da ONU, da OMC, do G20 e do BRICS e retomar, com pragmatismo, o processo de aproximação com a OCDE.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 74 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Licenciamento ambiental com prazo e previsibilidade Dar ao licenciamento prazos definidos, procedimentos simplificados para projetos padronizados e de baixo impacto, e coordenação unificada para os projetos estruturantes.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 47 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_vigilancia_massa","postura":"favor","citacao":{"texto":"Segurança pública sem discriminação Aperfeiçoar formação, protocolos de abordagem, videomonitoramento com Inteligência Artificial (estratégias de reconhecimento facial e uso de câmeras deverão considerar toda a diversidade brasileira, com auditoria permanente e medidas para treinar, identificar e reduzir vieses raciais e enfrentar o racismo algorítmico), supervisão e responsabilização, protegendo simultaneamente cidadãos e policiais.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 67 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ministerio_seguranca","postura":"favor","citacao":{"texto":"Implantar o Ministério da Segurança Pública e o Sistema Integrado de Proteção à Soberania Nacional","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 16 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"Esporte e educação em todas as etapas Garantir educação física de qualidade, iniciação multiesportiva, jogos escolares e acesso a atividades no contraturno e na escola de tempo integral.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 39 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"A saúde preservará os princípios do SUS, mas mudará sua capacidade de entrega: cuidado preventivo, atendimento perto de casa, prontuário interoperável, fila transparente, especialista no tempo certo e hospitais remunerados por qualidade e resultado.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 2 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_isolamento_liderancas","postura":"favor","citacao":{"texto":"Criar uma Rede Nacional de Presídios de Segurança Máxima, com padrões comuns para unidades federais e estaduais.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 18 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_simplificacao_fiscal","postura":"favor","citacao":{"texto":"A carga tributária já é elevada e o sistema permanece complexo.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 12 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ia_soberania_digital","postura":"favor","citacao":{"texto":"Digitalizar a indústria e ampliar o uso da Inteligência Artificial Acelerar a transformação digital da indústria, com prioridade para as pequenas e médias empresas, e fazer da inteligência artificial um vetor de produtividade.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 44 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"COMPROMISSO: estabilizar a dívida, reconstruir superávits, proteger o investimento e reduzir o peso dos juros sem transferir a conta aos mais pobres e sem recorrer a aumentos permanentes de carga tributária.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reeleicao","postura":"favor","citacao":{"texto":"Propor o fim da reeleição no Poder Executivo Encaminhar ao Congresso, no início do mandato, proposta de emenda à Constituição para extinguir a reeleição consecutiva para os cargos do Poder Executivo, com aplicação inclusive ao mandato presidencial iniciado em 2027.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 8 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"Reordenar as emendas parlamentares Pactuar com o Congresso critérios de planejamento, transparência, manutenção, custo total e resultado, reduzindo pulverização e impedindo que recursos escassos sejam destinados a objetos sem capacidade de operação.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"Reduzir a maioridade penal e agravar o furto de celular","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 20 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_emocional_educacao","postura":"favor","citacao":{"texto":"Adaptar o ensino à adolescência, fortalecer matemática e ciência e prevenir abandono por busca ativa e apoio socioemocional.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 33 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C03","nome":"Romeu Zema","partido":"Novo","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","planoNota":"Plano de governo integral (81 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"favor","citacao":{"texto":"RETIRAR O GOVERNO DE ONDE ELE NÃO É ESSENCIAL Privatizar todas as empresas estatais: Privatizar todas as empresas estatais para que o governo possa se concentrar naquilo que de fato lhe cabe, como segurança pública e educação, reduzindo o espaço para escândalos de corrupção e garantindo maior eficiência no uso dos recursos públicos e mais competição na economia brasileira.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 15 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Ampliar as parcerias público-privadas em todos os serviços públicos, inclusive saúde e educação: Aumentar o investimento privado no país por meio da ampliação das parcerias público-privadas em todos os setores da administração pública, inclusive em projetos que geram impacto direto na qualidade dos serviços e na vida da população, como saúde e educação.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 15 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"O setor privado, que tem estrutura e capacidade ociosa, é subutilizado para desafogar o sistema público e o excesso de regulação e a judicialização encarecem a saúde suplementar e empurram ainda mais pessoas para o SUS.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 57 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ans_planos_flexiveis","postura":"favor","citacao":{"texto":"Modernizar a regulação sobre planos de saúde para ampliar opções aos pacientes: Combater entraves excessivos do marco regulatório da ANS para permitir modelos diferenciados de planos de saúde, com variações de cobertura, segmentação de serviços e mecanismos de compartilhamento de custos flexíveis, ampliando a competição no setor e as opções disponíveis aos beneficiários, para que o aumento da concorrência se traduza em mais escolhas e melhor custo-benefício para os beneficiários.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 61 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"DAR ÀS FAMÍLIAS MAIS LIBERDADE DE ESCOLHA E PLURALIDADE DE MODELOS EDUCACIONAIS Aumentar as opções de modelos educacionais no país: Dar mais liberdade aos pais de escolher o modelo educacional de seus filhos, facilitando a formalização de parcerias com instituições comunitárias, filantrópicas e confessionais, avançando em uma agenda de parcerias com escolas conveniadas na educação, escolas cívico-militares e regulamentando o homeschooling.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 53 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"favor","citacao":{"texto":"Por isso, propomos enfrentar esses desafios em quatro eixos principais: CRIAR UMA ALTERNATIVA FLEXÍVEL À CLT Oferecer ao trabalhador e ao empregador um regime alternativo à CLT, com mais liberdade para negociarem as regras da contratação: Permitir que trabalhador e empregador ajustem o modelo de contratação às suas preferências e à realidade de cada atividade, com prevalência do negociado sobre o legislado.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 23 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estabilidade_emprego","postura":"contra","citacao":{"texto":"Modernizar os vínculos e formas de trabalho no setor público: Flexibilizar a composição da força de trabalho do setor público, reformulando os modelos de contratação existentes e instituindo novos vínculos adaptados a diferentes necessidades, como contratos por tempo determinado para projetos específicos, vínculos por tempo indeterminado sem estabilidade ampla e definição clara dos cargos típicos de estado.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 41 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"favor","citacao":{"texto":"Abrir o setor de petróleo à concorrência: Desverticalizar a Petrobras, separando as operações de produção, refino, transporte e logística em diferentes empresas para permitir a entrada de novos concorrentes e ampliar a concorrência em igualdade de condições.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 33 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"ROMEU ZEMA | 16 CORTAR OS IMPOSTOS QUE SUFOCAM O BRASILEIRO Definir metas de redução de impostos que forcem o corte efetivo de gastos: Fixar metas progressivas de redução da carga tributária que imponham os cortes de gastos necessários para atingi-las, invertendo a lógica atual em que o gasto define o imposto.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 16 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida das metas declaradas de redução progressiva da carga tributária."},{"eixo":"e_reforma_previdencia","postura":"favor","citacao":{"texto":"Por isso, defendemos um plano de ação dividido em três eixos principais: REALIZAR UM CHOQUE FISCAL NOS GASTOS DO GOVERNO Reformar a Previdência de forma definitiva: Fazer uma Reforma da Previdência envolvendo estados e municípios, bem como a previdência rural e militar, criando também um mecanismo de reajuste automático da idade mínima para aposentadoria com base na expectativa de vida da população e na sustentabilidade do sistema previdenciário no longo prazo, para que as futuras gerações tenham segurança de que serão protegidas na velhice.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 14 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_alinhamento_brics","postura":"contra","citacao":{"texto":"ALINHAR O BRASIL ÀS DEMOCRACIAS E AOS MERCADOS GLOBAIS Sair do BRICS: Retirar o Brasil do BRICS de forma diplomática, preservando pragmaticamente as relações comerciais com todos os países do bloco e recusando qualquer direcionamento que comprometa valores constitucionais e democráticos do Brasil.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 37 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Reduzir entraves do licenciamento ambiental à atividade agropecuária: Garantir a implementação efetiva da Nova Lei do Licenciamento Ambiental, com prazos definidos e critérios técnicos objetivos, distinguindo os diferentes graus de impacto e simplificando o licenciamento de atividades de baixo risco, para atrair investimentos sem abrir mão da conservação ambiental.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 44 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"favor","citacao":{"texto":"Proibir a censura nas redes sociais: Vedar a exclusão de perfis e a moderação de opiniões pelas plataformas, inclusive por determinação judicial, substituindo esses mecanismos por procedimentos administrativos e judiciais que garantam direito à retratação e indenização, assegurando que o debate público no Brasil seja resolvido pela livre circulação de ideias e não pelo controle de juízes ou empresas de tecnologia.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 74 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Apesar de a maioria das unidades básicas já utilizarem o prontuário eletrônico, apenas uma pequena parte está conectada à rede nacional de dados, e o histórico do paciente se perde a cada unidade que ele procura.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 57 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_administrativa","postura":"favor","citacao":{"texto":"Na gestão de pessoas, convivemos com um setor público desigual: mais de 300 tabelas salariais só na União, uma elite do funcionalismo com prêmio salarial de 96% em relação ao setor privado e supersalários acima do teto constitucional.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 39 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_simplificacao_fiscal","postura":"favor","citacao":{"texto":"O caminho para o Brasil transformar esse sonho em realidade está à nossa frente: derrubar os juros, libertar as famílias das dívidas, simplificar os impostos, destravar a infraestrutura, dar segurança a quem empreende e abrir o país ao mundo Assim, o Brasil terá as condições para atrair os investimentos das novas tecnologias e transformar nossas vantagens em riqueza.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 17 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"ROMEU ZEMA | 18 DERRUBAR UM DOS JUROS MAIS ALTOS DO MUNDO Criar condições para a queda da taxa de juros: Garantir a queda da curva de juros por meio de um choque fiscal para estabilizar a relação dívida/PIB, promovendo reformas e mantendo superávits primários que permitam o pagamento da dívida.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 18 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"Dessa forma, apresentamos soluções em três eixos principais: LIMITAR O PODER DO SUPREMO Aumentar os requisitos para indicação de ministros do STF: Robustecer os requisitos mínimos para a indicação de ministros do STF, exigindo idade mínima de 60 anos e implementando mecanismos para evitar a vinculação política dos indicados, de modo que a ida ao Supremo seja a coroação de uma carreira jurídica exemplar.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 11 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"Ao mesmo tempo, a própria estrutura do Estado abriga distorções graves: hoje, mais de 53 mil servidores ativos e inativos recebem acima do teto constitucional, com custo anual estimado em cerca de R$ 20 bilhões, enquanto o orçamento público segue sendo desviado para privilégios e fins eleitorais, com bilhões em emendas parlamentares distribuídas sem transparência adequada.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 8 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_fim_fundo_eleitoral","postura":"favor","citacao":{"texto":"Extinguir o Fundo Partidário e o Fundo Eleitoral: Extinguir o Fundo Partidário e o Fundo Eleitoral, substituindo-os por um modelo de financiamento privado de campanhas, com doações permitidas por pessoas físicas e jurídicas, havendo critérios rígidos de transparência, rastreabilidade e limites que preservem a justa competição entre os candidatos.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 75 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"REDUZIR A MAIORIDADE PENAL E ENDURECER A LEGISLAÇÃO Reduzir a maioridade penal para 16 an

umento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reeleicao","postura":"favor","citacao":{"texto":"Propor o fim da reeleição no Poder Executivo Encaminhar ao Congresso, no início do mandato, proposta de emenda à Constituição para extinguir a reeleição consecutiva para os cargos do Poder Executivo, com aplicação inclusive ao mandato presidencial iniciado em 2027.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 8 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"Reordenar as emendas parlamentares Pactuar com o Congresso critérios de planejamento, transparência, manutenção, custo total e resultado, reduzindo pulverização e impedindo que recursos escassos sejam destinados a objetos sem capacidade de operação.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 13 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"Reduzir a maioridade penal e agravar o furto de celular","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 20 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_emocional_educacao","postura":"favor","citacao":{"texto":"Adaptar o ensino à adolescência, fortalecer matemática e ciência e prevenir abandono por busca ativa e apoio socioemocional.","fonte":"Plano de governo registrado — Ronaldo Caiado (PSD)","local":"página 33 de 100","url":"https://static.poder360.com.br/uploads/2026/08/Plano-de-Governo-Ronaldo-Caiado-Presidente.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C03","nome":"Romeu Zema","partido":"Novo","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","planoNota":"Plano de governo integral (81 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"favor","citacao":{"texto":"RETIRARO GOVERNODE ONDE ELE NÃO É ESSENCIAL Privatizar todas as empresas estatais: Privatizar todas as empresas estatais para que o governo possa se concentrar naquilo que de fato lhe cabe, como segurança pública e educação, reduzindo o espaço para escândalos de corrupção e garantindo maior eficiência no uso dos recursos públicos e mais competição na economia brasileira.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 15 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Ampliar as parcerias público-privadas em todos os serviços públicos, inclusive saúde e educação: Aumentar o investimento privado no país por meio da ampliação das parcerias público-privadas em todos os setores da administração pública, inclusive em projetos que geram impacto direto na qualidade dos serviços e na vida da população, como saúde e educação.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 15 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"favor","citacao":{"texto":"Osetor privado, que tem estrutura e capacidade ociosa, é subutilizado para desafogar o sistema público e o excesso de regulação e a judicialização encarecem a saúde suplementar e empurram ainda mais pessoas para o SUS.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 57 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ans_planos_flexiveis","postura":"favor","citacao":{"texto":"Modernizar a regulação sobre planos de saúde para ampliar opções aos pacientes: Combater entraves excessivos do marco regulatório da ANS para permitir modelos diferenciados de planos de saúde, com variações de cobertura, segmentação de serviços e mecanismos de compartilhamento de custos flexíveis, ampliando a competição no setor e as opções disponíveis aos beneficiários, para que o aumento da concorrência se traduza em mais escolhas e melhor custo-benefício para os beneficiários.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 61 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"DARÀS FAMÍLIAS MAIS LIBERDADEDE ESCOLHAE PLURALIDADEDE MODELOS EDUCACIONAIS Aumentar as opções de modelos educacionais no país: Dar mais liberdade aos pais de escolher o modelo educacional de seus filhos, facilitando a formalização de parcerias com instituições comunitárias, filantrópicas e confessionais, avançando em uma agenda de parcerias com escolas conveniadas na educação, escolas cívico-militares e regulamentando o homeschooling.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 53 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"favor","citacao":{"texto":"Por isso, propomos enfrentar esses desafios em quatro eixos principais: CRIAR UMA AL TERNATIVA FLEXÍVEL À CLT Oferecer ao trabalhador e ao empregador um regime alternativo à CLT, com mais liberdade para negociarem as regras da contratação: Permitir que trabalhador e empregador ajustem o modelo de contratação às suas preferências e à realidade de cada atividade, com prevalência do negociado sobre o legislado.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 23 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estabilidade_emprego","postura":"contra","citacao":{"texto":"Modernizar os vínculos e formas de trabalho no setor público: Flexibilizar a composição da força de trabalho do setor público, reformulando os modelos de contratação existentes e instituindo novos vínculos adaptados a diferentes necessidades, como contratos por tempo determinado para projetos específicos, vínculos por tempo indeterminado sem estabilidade ampla e definição clara dos cargos típicos de estado.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 41 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"favor","citacao":{"texto":"Abrir o setor de petróleo à concorrência: Desverticalizar a Petrobras, separando as operações de produção, refino, transporte e logística em diferentes empresas para permitir a entrada de novos concorrentes e ampliar a concorrência em igualdade de condições.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 33 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"ROMEU ZEMA | 16 CORTAROS IMPOSTOS QUE SUFOCAMO BRASILEIRO Definir metas de redução de impostos que forcem o corte efetivo de gastos: Fixar metas progressivas de redução da carga tributária que imponham os cortes de gastos necessários para atingi-las, invertendo a lógica atual em que o gasto define o imposto.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 16 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida das metas declaradas de redução progressiva da carga tributária."},{"eixo":"e_reforma_previdencia","postura":"favor","citacao":{"texto":"Por isso, defendemos um plano de ação dividido em três eixos principais: REALIZARUM CHOQUE FISCAL NOS GASTOSDO GOVERNO Reformar a Previdência de forma definitiva: Fazer uma Reforma da Previdência envolvendo estados e municípios, bem como a previdência rural e militar, criando também um mecanismo de reajuste automático da idade mínima para aposentadoria com base na expectativa de vida da população e na sustentabilidade do sistema previdenciário no longo prazo, para que as futuras gerações tenham segurança de que serão protegidas na velhice.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 14 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_alinhamento_brics","postura":"contra","citacao":{"texto":"ALINHARO BRASILÀS DEMOCRACIASE AOS MERCADOS GLOBAIS Sair do BRICS: Retirar o Brasil do BRICS de forma diplomática, preservando pragmaticamente as relações comerciais com todos os países do bloco e recusando qualquer direcionamento que comprometa valores constitucionais e democráticos do Brasil.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 37 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Reduzir entraves do licenciamento ambiental à atividade agropecuária: Garantir a implementação efetiva da Nova Lei do Licenciamento Ambiental, com prazos definidos e critérios técnicos objetivos, distinguindo os diferentes graus de impacto e simplificando o licenciamento de atividades de baixo risco, para atrair investimentos sem abrir mão da conservação ambiental.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 44 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"favor","citacao":{"texto":"Proibir a censura nas redes sociais: Vedar a exclusão de perfis e a moderação de opiniões pelas plataformas, inclusive por determinação judicial, substituindo esses mecanismos por procedimentos administrativos e judiciais que garantam direito à retratação e indenização, assegurando que o debate público no Brasil seja resolvido pela livre circulação de ideias e não pelo controle de juízes ou empresas de tecnologia.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 74 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Apesar de a maioria das unidades básicas já utilizarem o prontuário eletrônico, apenas uma pequena parte está conectada à rede nacional de dados, e o histórico do paciente se perde a cada unidade que ele procura.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 57 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_administrativa","postura":"favor","citacao":{"texto":"Na gestão de pessoas, convivemos com um setor público desigual: mais de 300 tabelas salariais só na União, uma elite do funcionalismo com prêmio salarial de 96% em relação ao setor privado e supersalários acima do teto constitucional.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 39 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_simplificacao_fiscal","postura":"favor","citacao":{"texto":"Ocaminho para o Brasil transformar esse sonho em realidade está à nossa frente: derrubar os juros, libertar as famílias das dívidas, simplificar os impostos, destravar a infraestrutura, dar segurança a quem empreende e abrir o país ao mundo Assim, o Brasil terá as condições para atrair os investimentos das novas tecnologias e transformar nossas vantagens em riqueza.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 17 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"ROMEU ZEMA | 18 DERRUBARUM DOS JUROS MAISAL TOSDO MUNDO Criar condições para a queda da taxa de juros: Garantir a queda da curva de juros por meio de um choque fiscal para estabilizar a relação dívida/PIB, promovendo reformas e mantendo superávits primários que permitam o pagamento da dívida.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 18 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"Dessa forma, apresentamos soluções em três eixos principais: LIMITARO PODERDO SUPREMO Aumentar os requisitos para indicação de ministros do STF: Robustecer os requisitos mínimos para a indicação de ministros do STF, exigindo idade mínima de 60 anos e implementando mecanismos para evitar a vinculação política dos indicados, de modo que a ida ao Supremo seja a coroação de uma carreira jurídica exemplar.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 11 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_emendas_parlamentares","postura":"favor","citacao":{"texto":"Ao mesmo tempo, a própria estrutura do Estado abriga distorções graves: hoje, mais de 53 mil servidores ativos e inativos recebem acima do teto constitucional, com custo anual estimado em cerca de R$ 20 bilhões, enquanto o orçamento público segue sendo desviado para privilégios e fins eleitorais, com bilhões em emendas parlamentares distribuídas sem transparência adequada.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 8 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_fim_fundo_eleitoral","postura":"favor","citacao":{"texto":"Extinguir o Fundo Partidário e o Fundo Eleitoral: Extinguir o Fundo Partidário e o Fundo Eleitoral, substituindo-os por um modelo de financiamento privado de campanhas, com doações permitidas por pessoas físicas e jurídicas, havendo critérios rígidos de transparência, rastreabilidade e limites que preservem a justa competição entre os candidatos.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 75 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"favor","citacao":{"texto":"REDUZIRA MAIORIDADE PENALE ENDURECERA LEGISLAÇÃO Reduzir a maioridade penal para 16 anos ou menos: Reduzir a maioridade penal para 16 anos, assegurando a responsabilização criminal de adolescentes a partir dessa idade e permitindo, excepcionalmente, a imputação penal de pessoas ainda mais jovens nos casos de crimes graves, como homicídio e estupro, ou reincidência.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 6 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_porte_arma_rural","postura":"favor","citacao":{"texto":"DEFENDERA PROPRIEDADE RURAL Garantir o porte de armas em toda a extensão da propriedade rural e o direito à autodefesa do produtor: Consolidar e ampliar o direito do produtor rural de portar arma em toda a extensão de sua propriedade, avançando para além da posse estendida já prevista em lei, com segurança jurídica para o exercício da legítima defesa e proteção efetiva do Estado contra invasões.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 45 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_homeschooling","postura":"favor","citacao":{"texto":"DARÀS FAMÍLIAS MAIS LIBERDADEDE ESCOLHAE PLURALIDADEDE MODELOS EDUCACIONAIS Aumentar as opções de modelos educacionais no país: Dar mais liberdade aos pais de escolher o modelo educacional de seus filhos, facilitando a formalização de parcerias com instituições comunitárias, filantrópicas e confessionais, avançando em uma agenda de parcerias com escolas conveniadas na educação, escolas cívico-militares e regulamentando o homeschooling.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 53 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C04","nome":"Renan Santos","partido":"Missão","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","planoNota":"Plano de governo integral (51 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"Agovernança desses polos opera por meio de Parcerias Público-Privadas (Lei 11.079/2004) e, quando cruzar fronteiras estaduais, de Consórcios Públicos (Lei 11.107/2005), com previsão de expansão para outros estados.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 36 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano critica explicitamente a fórmula de \"privatizar tudo\" (p. 5). A postura \"favor\" aqui vale para PPPs como instrumento de governança, que o plano adota, e NÃO para privatização como programa — por isso a candidatura não aparece no eixo de privatização de estatais."},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"Amilitarização das escolas deve ser vista como uma medida provisória, a fim de estancar a violência endêmica, em especial nas regiões com alta criminalidade no entorno.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 32 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"favor\" é qualificada na própria citação: o plano trata a militarização escolar como medida provisória e localizada, não como modelo educacional."},{"eixo":"e_renda_sem_contrapartida","postura":"contra","citacao":{"texto":"Traduzimos as ideias à nossa realidade política e adicionamos também outros temas de interesse, em especial o projeto de reforma do assistencialismo, com a substituição do Bolsa Família por um programa de Frentes Cidadãs que incentive a inserção dos beneficiários ao mercado formal de trabalho.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 21 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_encarceramento_excecao","postura":"favor","citacao":{"texto":"As lideranças condenadas serão deslocadas a superpresídios de segurança máxima em regiões remotas, no modelo do CECOT salvadorenho, equipados com blindagem eletromagnética e biometria contínua, neutralizando o comando das facções a partir do cárcere.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 13 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"contra","citacao":{"texto":"Ogoverno da Missão não criará um único novo assentamento enquanto os já existentes não atingirem níveis de produtividade compatíveis com os exigidos dos demais imóveis rurais brasileiros.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 42 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Racionalização e simplificação dos processos de licenciamento ambiental para a exploração dos minérios, com base na nova Lei Geral do Licenciamento Ambiental (Lei nº 15.190/2025, em vigor desde fevereiro de 2026).","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 39 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"favor","citacao":{"texto":"e construir, no Congresso, o marco da exploração mineral controlada ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estabilidade_emprego","postura":"favor","citacao":{"texto":"Resgataremos o direito à estabilidade no trabalho, em consonância com a convenção 158 da OIT, que combate a demissão sem justa causa.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 5 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_encarceramento_excecao","postura":"contra","citacao":{"texto":"Adoção das 16 medidas contra o encarceramento em massa do IBCCRIM.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_autonomia_banco_central","postura":"contra","citacao":{"texto":"Agiremos para promover a revogação do Arcabouço Fiscal, da Lei de Responsabilidade Fiscal, da Lei das Estatais (13.303/2016), a retomada do Banco Central (fim da autonomia), desmontando todo fiscalismo e arcabouço jurídico e institucional neoliberal","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"contra","citacao":{"texto":"No lugar da exploração da Margem Equatorial, defendemos pesquisas e buscas em o a econômica anticapitalista Revogação de todas as contrarreformas neoliberais, como a previdenciária e a trabalhista e do Arcabouço Fiscal, bem como da autonomia do Banco Central.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"contra","citacao":{"texto":"Defendemos a forte regulação das Big Techs e redes sociais imperialistas e o monopólio estatal das telecomunicações, da telefonia e da internet, com incentivo à criação de cooperativas dos trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Demarcação e proteção integral de todos os territórios indígenas, que serão geridos por conselhos populares dos povos originários.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não menciona a regulamentação da mineração em terras indígenas. A postura \"contra\" é inferida da defesa de proteção integral dos territórios sob gestão dos próprios povos originários."},{"eixo":"e_reducao_jornada","postura":"favor","citacao":{"texto":"C) Propomos reformas estruturais nas áreas sociais e do mundo do trabalho, com a implantação da jornada de 30 horas semanais sem redução salarial e o fim da escala 6x1;","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 2 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ministerio_seguranca","postura":"contra","citacao":{"texto":"Segurança dos Direitos no lugar da velha “Segurança Pública” Asegurança pública será desmilitarizada e reorganizada sob o marco civil, com controle social substituindo uma política e um ministério de segurança pública para uma política de segurança dos direitos, com base na criminologia crítica e no acúmulo político e programático dos movimentos negros e populares.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"contra\" é inferida da proposta de substituir a política e o ministério de segurança pública por uma \"política de segurança dos direitos\" sob marco civil."},{"eixo":"e_desmilitarizacao","postura":"favor","citacao":{"texto":"Ogoverno do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a completa desmilitarização da segurança pública, com unificação das polícias e instituição do ciclo completo junto com a desvinculação das forças de segurança do exército, sob bases curriculares e formativas completamente reestruturadas numa lógica democrática.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_setores","postura":"favor","citacao":{"texto":"Defendemos a forte regulação das Big Techs e redes sociais imperialistas e o monopólio estatal das telecomunicações, da telefonia e da internet, com incentivo à criação de cooperativas dos trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_auditoria_divida","postura":"favor","citacao":{"texto":"Adívida pública será reestruturada e seu passivo será substituído por títulos de longo prazo.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"contra","citacao":{"texto":"Agiremos para promover a revogação do Arcabouço Fiscal, da Lei de Responsabilidade Fiscal, da Lei das Estatais (13.303/2016), a retomada do Banco Central (fim da autonomia), desmontando todo fiscalismo e arcabouço jurídico e institucional neoliberal","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"O Judiciário também será democratizado, com mandatos por tempo definido para os Tribunais Regionais e Superiores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_descriminalizacao_drogas","postura":"favor","citacao":{"texto":"Ogoverno do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a completa desmilitarização da segurança pública, com unificação das polícias e instituição do ciclo completo junto com a desvinculação das forças de segurança do exército, sob bases curriculares e formativas completamente reestruturadas numa lógica democrática.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_cotas_trans","postura":"favor","citacao":{"texto":"Universalização das cotas universitárias para a população Trans.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_passe_livre","postura":"favor","citacao":{"texto":"No transporte será implantada a tarifa zero com transporte 100% público em todo território nacional, acabando com a política de emendas parlamentares para contribuir com o custeio, processo que se complementará com ampliação da malha ferroviária e hidroviária.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 7 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_unicameralismo","postura":"favor","citacao":{"texto":"Visando aprofundar as liberdades democráticas e implantar mecanismos de democracia direta, serão instituídos os Conselhos Populares, eleitos nos locais de trabalho, moradia e estudo, como instrumentos permanentes de participação popular.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_midia","postura":"favor","citacao":{"texto":"Ogoverno popular realizará a democratização dos meios de comunicação, com a transformação dos monopólios privados de comunicações em cooperativas dos trabalhadores e o fortalecimento da Empresa Brasileira de Comunicação (EBC), sob a direção de um Conselho de Trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C11","nome":"Hertz Dias","partido":"PSTU","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","planoNota":"Plano de governo integral (33 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"contra","citacao":{"texto":"Até mesmo o saneamento básico está sendo entregue aos grupos estrangeiros, num sentido inverso a diversos países da Europa que hoje estão sendo obrigados a reverterem uma série de privatizações do setor de saneamento.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 2 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ppp_servicos_publicos","postura":"contra","citacao":{"texto":"Avançam processos de privatização e concessão de metrôs, estradas e ferrovias, aprofundando a mercantilização da mobilidade.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 13 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"contra","citacao":{"texto":"Defesa do sus público, universal, gratuito e 100% estatal Fim da privatização e da gestão privada da saúde (OS, Fundações e PPP) Proibição da transferência de leitos públicos para planos privados Ampliação do investimento público em saúde, com prioridade para a atenção básica Cuidado com a saúde mental: ampliação do investimento público nos Centros de Atenção Psicossocial (Caps), no Serviço de Residências Terapêuticas e Centros de Convivência.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 11 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"contra","citacao":{"texto":"Não à militarização das escolas e a projetos de controle ideológico, como Escola Sem Partido!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 12 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"contra","citacao":{"texto":"Revogação da reforma trabalhista Revogação da lei das terceirizações.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_encarceramento_excecao","postura":"contra","citacao":{"texto":"Da mesma forma, exigir o fim da matança e do encarceramento em massa da juventude pobre e negra, a desmilitarização da PM, a eleição de delegados pelas comunidades e o controle popular da segurança significa enfrentar o braço armado do Estado burguês nas periferias, assim como as relações entre repressão, milícias, tráfico, poder econômico e poder político.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 30 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"contra","citacao":{"texto":"Não à exploração do petróleo da Margem Equatorial!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 15 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"favor","citacao":{"texto":"Por reforma agrária e por uma revolução na estrutura do campo brasileiro!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 16 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"favor","citacao":{"texto":"Imposto progressivo sobre as verdadeiras grandes fortunas, o topo da pirâmide, os que possuem de R$ 1 bilhão para cima.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 27 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_previdencia","postura":"contra","citacao":{"texto":"Revogação da reforma da Previdência Correção anual e atualização integral da tabela do Imposto de Renda para os assalariados Ao lutar por salário, jornada e direitos, os trabalhadores se deparam com os limites impostos pelas empresas, pelo mercado e pela lógica do lucro, o que abre o caminho para questionarmos quem controla a produção e a riqueza.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"contra","citacao":{"texto":"Combate às ideologias misóginas e responsabilização das plataformas que lucram com a disseminação do ódio contra as mulheres.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 23 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Reparação e demarcação imediata das terras indígenas, titulação dos territórios quilombolas e proteção das comunidades tradicionais Reconhecimento e reparação das populações atingidas por crimes ambientais Garantia do direito à autodefesa de todas as comunidades e militantes que lutam em defesa do meio ambiente diante da violência patronal e estatal.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 15 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não menciona a regulamentação da mineração em terras indígenas. A postura \"contra\" é inferida da defesa de demarcação imediata e proteção das comunidades tradicionais."},{"eixo":"e_reducao_jornada","postura":"favor","citacao":{"texto":"Fim da escala 6×1 sem redução de salários e direitos, sem pejotização e sem demissões Redução da jornada de trabalho para 36 horas, sem redução dos salários e sem flexibilização de direitos, rumo à escala móvel de horas de trabalho (pleno emprego).","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"Creches e escolas públicas, gratuitas e em tempo integral para todas as crianças, como condição para a independência das mulheres Restaurantes populares e lavanderias públicas em todos os bairros Ampliação dos serviços públicos de cuidado (idosos, pessoas com necessidades especiais) retirando das mulheres essa sobrecarga.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 23 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_desmilitarizacao","postura":"favor","citacao":{"texto":"Contra a redução da maioridade penal Desmilitarização da pm e unificação das polícia /**
 * Palanq — versão de cartões.
 *
 * Mesmo motor, mesmas perguntas, mesma ordem. O que muda é só a forma de
 * responder e o que a tela mostra: aqui não se explica por que a pergunta veio
 * agora, não se mostra quem está a favor ou contra, e o resultado é um gráfico
 * em vez de números.
 *
 * Arrastar: → concordo · ← discordo · ↑ inegociável (pergunta o lado) · ↓ não opinar.
 * Os quatro botões abaixo do cartão fazem o mesmo, e as setas do teclado também.
 */
const CHAVE_S = "palanq/cards/v1";
const appEl = document.getElementById("app");

const Z = {
  tela: "abertura",
  respostas: {},
  linhasVermelhas: [],
  pedindoLado: false,
  margem: 0.05,
};

/**
 * Um matiz por tema. Saturação e luminosidade ficam por conta do CSS, iguais para
 * todos, para que as 21 cores pareçam uma família e não um arco-íris. Temas
 * vizinhos no assunto ficam vizinhos no círculo cromático.
 */
const MATIZ = {
  economia: 208, tributacao: 196, fiscal: 188, orcamento: 182,
  trabalho: 28, previdencia: 40, social: 344, federativo: 222,
  saude: 166, ambiental: 132, agrario: 104, energia: 52,
  educacao: 272, tecnologia: 254, comunicacao: 292,
  seguranca: 12, justica: 238, politica: 246, estado: 216,
  externa: 228, transporte: 176,
};
const matizDe = (d) => MATIZ[d] ?? 215;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cand_ = (id) => CORPUS.candidatos.find((c) => c.id === id);
const nomeC = (id) => { const c = cand_(id); return c ? c.nome : id; };
const siglaC = (id) => cand_(id)?.partido || "";

const olhar = () => analisar(CORPUS, Z.respostas, new Set(Z.linhasVermelhas), { margem: Z.margem });
const proxima = (a) => proximaPergunta(CORPUS, Z.respostas, a.estados,
  { linhasVermelhas: new Set(Z.linhasVermelhas), margem: Z.margem });

/** Só os temas em disputa entram nesta versão: nada de portões nem de fase extra. */
function pergunta(a) {
  const q = proxima(a);
  return q && q.tipo === "eixo" && q.fase === 1 ? q : null;
}
/**
 * Pisos de produto para aceitar a parada antecipada. A garantia do motor é sobre
 * matemática — ninguém mais consegue ultrapassar quem lidera — e pode chegar com 5
 * respostas; encerrar ali é correto e ruim: o resultado fica apoiado em pouca coisa
 * e o gráfico sai quase todo hachurado. Por isso os pisos moram aqui e não em
 * `decisaoEstavel()`.
 *
 *   MINIMO        quantidade mínima de perguntas respondidas.
 *   MINIMO_TEMAS  quantidade mínima de temas distintos tocados, para o resultado não
 *                 sair de um punhado de perguntas todas do mesmo assunto.
 *
 * Os dois são limitados pelo que de fato existe: marcar um tema como inegociável
 * elimina candidaturas, e isso pode encolher o questionário para menos de dez
 * perguntas (§20). Sem esse teto, o app nunca chegaria ao resultado nesses casos.
 *
 * Medido na ordem atual, sem eliminações: o oitavo tema distinto aparece na nona
 * pergunta, então quem manda de fato é o piso de dez. `MINIMO_TEMAS` age como rede
 * de proteção — se o corpus mudar e a ordem passar a agrupar assuntos, ele segura.
 */
const MINIMO = 10;
const MINIMO_TEMAS = 8;
function acabou(a) {
  if (!pergunta(a)) return true;                 // acabaram as perguntas
  if (!a.decisao.estavel) return false;          // ainda dá para mudar quem lidera
  const div = a.classes.divisivos;
  const feitas = div.filter((d) => Z.respostas[d.eixo] !== undefined);
  const temaDe = (d) => CORPUS.eixos[d.eixo].dominio;
  const tocados = new Set(feitas.map(temaDe)).size;
  const existentes = new Set(div.map(temaDe)).size;
  return feitas.length >= Math.min(MINIMO, div.length) &&
         tocados >= Math.min(MINIMO_TEMAS, existentes);
}

function gravar() {
  try { localStorage.setItem(CHAVE_S, JSON.stringify({ v: 1, cv: CORPUS.corpusVersion, ...Z })); } catch {}
}
function recuperar() {
  try {
    const d = JSON.parse(localStorage.getItem(CHAVE_S) || "null");
    if (!d || d.cv !== CORPUS.corpusVersion) return false;
    Object.assign(Z, { tela: d.tela, respostas: d.respostas || {}, linhasVermelhas: d.linhasVermelhas || [] });
    Z.pedindoLado = false;
    return Object.keys(Z.respostas).length > 0;
  } catch { return false; }
}
function recomecar() {
  Object.assign(Z, { tela: "abertura", respostas: {}, linhasVermelhas: [], pedindoLado: false });
  try { localStorage.removeItem(CHAVE_S); } catch {}
  desenhar();
}

// ── ícones ───────────────────────────────────────────────────────────────────
const SVG = (d, extra = "") =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}${extra}</svg>`;
const ICONE = {
  // X — discordo
  nao: SVG('<path d="M18 6 6 18M6 6l12 12"/>'),
  // ✓ — concordo
  sim: SVG('<path d="M20 6 9 17l-5-5"/>'),
  // escudo com "!" — inegociável
  ine: SVG('<path d="M12 3 4 6v6c0 4.5 3.2 8.3 8 9 4.8-.7 8-4.5 8-9V6l-8-3Z"/><path d="M12 8.5v4"/><circle cx="12" cy="15.6" r=".9" fill="currentColor" stroke="none"/>'),
  // seta para baixo — não opinar
  pular: SVG('<path d="M12 5v13M6 13l6 6 6-6"/>'),
};

// ── responder ────────────────────────────────────────────────────────────────
function responderCartao(valor, inegociavel = false) {
  const a = olhar();
  const q = pergunta(a);
  if (!q) return;
  Z.respostas = { ...Z.respostas, [q.id]: valor };
  const lv = new Set(Z.linhasVermelhas);
  if (inegociavel) lv.add(q.id); else lv.delete(q.id);
  Z.linhasVermelhas = [...lv];
  Z.pedindoLado = false;
  if (acabou(olhar())) Z.tela = "resultado";
  gravar();
  desenhar();
}

// ── telas ────────────────────────────────────────────────────────────────────
function telaAbertura() {
  const retomar = Object.keys(Z.respostas).length > 0;
  return `<div class="abertura tela" style="padding:0">
    <h1>Palanq</h1>
    <p class="slogan">No papel, qual candidato combina com você?</p>
    <p class="mini">${CORPUS.escopo.eleicao} · ${CORPUS.escopo.cargo}</p>
    <div class="aviso" style="text-align:left;margin-top:1.4rem">
      <h3>Isto não recomenda voto</h3>
      <p class="mini" style="margin:0">Comparamos o que você responde com o que está escrito nos planos
      de governo registrados. Não entra aqui nada sobre histórico, capacidade de executar, coalizão ou
      financiamento de campanha.</p>
    </div>
    <button class="comecar" data-ir="cartoes">${retomar ? "Continuar" : "Começar"}</button>
    ${retomar ? '<button class="mini" data-ir="recomecar" style="margin-top:.8rem;text-decoration:underline">Recomeçar do zero</button>' : ""}
  </div>`;
}

function telaCartoes() {
  const a = olhar();
  const q = pergunta(a);
  if (!q) { Z.tela = "resultado"; return telaResultado(); }

  const divisivos = a.classes.divisivos;
  const feitas = divisivos.filter((d) => Z.respostas[d.eixo] !== undefined).length;
  const faltam = divisivos.length - feitas;
  // Eliminar candidaturas encurta o questionário (§20), então o total muda no meio
  // do caminho. Mostrar quantas faltam em vez de "x de y" evita que isso pareça bug.
  const pct = Math.round((feitas / Math.max(feitas + faltam, 1)) * 100);
  // dois cartões atrás, só para dar volume à pilha
  const seguintes = divisivos
    .filter((d) => Z.respostas[d.eixo] === undefined && d.eixo !== q.id)
    .slice(0, 2)
    .map((d) => CORPUS.eixos[d.eixo]);

  const corpo = (e) => `
    <div class="dominio"><i></i>${esc(e.dominio || "")}</div>
    <h2>${esc(e.label)}</h2>
    <div class="pergunta">${esc(e.pergunta)}</div>
    ${e.formulacaoNeutra === false
      ? '<div class="nota">Não foi possível escrever esta pergunta sem carga. Leia com isso em mente.</div>'
      : ""}`;
  const tema = (e) => `style="--h:${matizDe(e.dominio)}"`;

  return `
  <div class="barra-topo">
    <span class="marca">Palanq</span>
    <div class="progresso" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <span class="mini">${faltam ? `faltam ${faltam}` : "última"}</span>
  </div>

  <div class="pilha">
    ${seguintes.map((e, i) => `<article class="cartao fundo${i ? "2" : ""}" ${tema(e)} aria-hidden="true">${corpo(e)}</article>`).reverse().join("")}
    <article class="cartao" id="topo" tabindex="0" aria-live="polite" ${tema(q)}
             aria-label="${esc(e_label(q))}">
      <span class="carimbo c-sim">Concordo</span>
      <span class="carimbo c-nao">Discordo</span>
      <span class="carimbo c-ine">Inegociável</span>
      <span class="carimbo c-pular">Não opinar</span>
      ${corpo(q)}
      ${Z.pedindoLado ? `<div class="overlay">
        <h3>Inegociável de que lado?</h3>
        <p class="mini" style="margin:0">Quem pensar diferente sai da comparação, por mais que combine
        com você no resto.</p>
        <div class="escolhas">
          <button data-resp="concordo" data-ine="1">Concordo — e é inegociável
            <small>Some quem for contra</small></button>
          <button data-resp="discordo" data-ine="1">Discordo — e é inegociável
            <small>Some quem for a favor</small></button>
        </div>
        <button class="voltar" data-ir="cancelar-lado">voltar</button>
      </div>` : ""}
    </article>
  </div>

  <div class="acoes">
    <div class="acao"><button class="b-nao" data-resp="discordo" aria-label="Discordo">${ICONE.nao}</button>
      <span>Discordo</span></div>
    <div class="acao"><button class="b-pular" data-resp="indiferente" aria-label="Não opinar">${ICONE.pular}</button>
      <span>Não opinar</span></div>
    <div class="acao"><button class="b-ine" data-ir="pedir-lado" aria-label="Inegociável">${ICONE.ine}</button>
      <span>Inegociável</span></div>
    <div class="acao"><button class="b-sim" data-resp="concordo" aria-label="Concordo">${ICONE.sim}</button>
      <span>Concordo</span></div>
  </div>`;
}
const e_label = (q) => `${q.label}. ${q.pergunta}`;

function telaResultado() {
  const a = olhar();
  const est = a.estados;
  // Todas as barras têm o mesmo comprimento: o peso que você respondeu. O que muda
  // é a divisão entre concordância, divergência e silêncio — e o silêncio aparece.
  const totalPeso = Math.max(...CORPUS.candidatos.map((c) => est[c.id].pesoRespondido), 1);
  const peso = (ids) => ids.reduce((n, e) => n + CORPUS.eixos[e].peso, 0);

  const ordem = [...a.ranking.ordem, ...a.ranking.semSinal,
                 ...CORPUS.candidatos.filter((c) => est[c.id].estado === "eliminado").map((c) => c.id)];

  const raia = (id) => {
    const s = est[id];
    const morto = s.estado === "eliminado";
    const lider = a.ranking.lideres.includes(id);
    const A = peso(s.alinhados), D = peso(s.divergentes), S = peso(s.silencios);
    const p = (x) => (x / totalPeso) * 100;
    return `<div class="raia ${lider ? "topo" : ""} ${morto ? "morta" : ""}">
      <div class="quem"><b>${esc(nomeC(id))}</b>${siglaC(id) ? `<em>${esc(siglaC(id))}</em>` : ""}
        ${lider ? '<em style="color:var(--acento)">mais alinhado</em>' : ""}
        ${morto ? '<em style="color:var(--nao)">fora — inegociável</em>' : ""}</div>
      <div class="barra" role="img" aria-label="${A ? "concorda em parte" : ""}">
        <i class="a" style="width:${p(A)}%"></i><i class="d" style="width:${p(D)}%"></i><i class="s" style="width:${p(S)}%"></i>
      </div></div>`;
  };

  const lideres = a.ranking.lideres;
  const pesoDe = (ids) => ids.reduce((n, e) => n + CORPUS.eixos[e].peso, 0);
  // Um líder que "venceu" mais por silêncio do que por concordância. É o desfecho
  // que o gráfico já denuncia; o título não pode dizer outra coisa.
  const calado = (id) => pesoDe(est[id].silencios) > pesoDe(est[id].alinhados);
  const caladosNoTopo = lideres.filter(calado);
  const faltam = a.classes.divisivos.filter((d) => Z.respostas[d.eixo] === undefined).length;

  const titulo = !lideres.length
    ? "Nenhuma candidatura sobrou"
    : caladosNoTopo.length === lideres.length
    ? "Ninguém combinou muito com você"
    : lideres.length === 1
    ? `Você se parece mais com ${nomeC(lideres[0])}`
    : `Empate entre ${lideres.length}`;

  const subtitulo = !lideres.length
    ? ""
    : caladosNoTopo.length === lideres.length
    ? `<p class="mini">${lideres.map((x) => esc(nomeC(x))).join(" e ")} ${lideres.length > 1 ? "aparecem" : "aparece"}
       no topo por <b>não ter dito nada</b> sobre a maior parte do que você respondeu — e não por concordar
       com você. Repare no tanto de hachurado ${lideres.length > 1 ? "nas barras" : "na barra"} logo abaixo.</p>`
    : caladosNoTopo.length
    ? `<p class="mini">${caladosNoTopo.map((x) => esc(nomeC(x))).join(" e ")} ${caladosNoTopo.length > 1 ? "chegam" : "chega"}
       ao topo mais por silêncio do que por concordância: o plano ${caladosNoTopo.length > 1 ? "deles" : "dele"} não
       trata da maior parte do que você respondeu.</p>`
    : lideres.length > 1
    ? `<p class="mini">${lideres.map((x) => esc(nomeC(x))).join(" · ")} — a diferença entre elas é pequena
       demais para desempatar.</p>`
    : "";

  return `
  <div class="barra-topo"><span class="marca">Palanq</span></div>
  <h1 style="font-size:1.6rem">${esc(titulo)}</h1>
  ${subtitulo}

  <div class="chave">
    <span><i style="background:var(--sim)"></i>vocês concordam</span>
    <span><i style="background:var(--nao)"></i>vocês divergem</span>
    <span><i class="s" style="background:var(--linha)"></i>o plano não fala disso</span>
  </div>
  <div class="grafico">${ordem.map(raia).join("")}</div>

  <p class="mini" style="margin-top:1.2rem">Todas as barras têm o mesmo tamanho: o que muda é quanto
  de cada cor. Muito hachurado quer dizer que aquele plano <b>não trata</b> dos temas que você respondeu —
  e não que ele concorde com você.</p>
  ${faltam ? `<div class="aviso" style="border-left-color:var(--acento);background:var(--realce)">
    <h3 style="color:var(--acento)">Ainda dá para afinar</h3>
    <p class="mini" style="margin:0 0 .7rem">Paramos porque quem está no topo já não muda. Mas
    ${faltam === 1 ? "um tema continua" : `${faltam} temas continuam`} sem resposta, e a ordem de quem vem
    depois ainda vai mudar${caladosNoTopo.length ? " — inclusive o tanto de hachurado no topo" : ""}.</p>
    <button data-ir="cartoes" style="border:1px solid var(--acento);border-radius:999px;padding:.5rem 1.1rem;background:var(--caixa)">${
      faltam === 1 ? "Responder o último" : `Responder os ${faltam} restantes`}</button>
  </div>` : ""}

  <div class="aviso" style="margin-top:1.2rem">
    <h3>Isto não é uma recomendação de voto</h3>
    <p class="mini" style="margin:0">É a comparação entre o que você respondeu e o que está escrito nos
    planos. Leia os documentos antes de decidir.</p>
  </div>

  <h3 style="width:100%">Planos de governo</h3>
  <div class="planos">${CORPUS.candidatos.map((c) => `<a href="${esc(c.planoUrl)}" target="_blank"
     rel="noopener noreferrer"><span>${esc(c.nome)}${c.partido ? ` (${esc(c.partido)})` : ""}</span>
     <span>ler →</span></a>`).join("")}</div>

  <div class="rodape">
    <button data-ir="recomecar">Recomeçar</button>
    <a href="motor/">Ver a versão completa</a>
  </div>`;
}

// ── render ───────────────────────────────────────────────────────────────────
function desenhar() {
  appEl.innerHTML = Z.tela === "abertura" ? telaAbertura()
                  : Z.tela === "resultado" ? telaResultado()
                  : telaCartoes();
  appEl.classList.toggle("abertura", Z.tela === "abertura");
  if (Z.tela === "cartoes") ligarArraste();
  window.scrollTo({ top: 0 });
}

// ── arraste ──────────────────────────────────────────────────────────────────
const LIMIAR = 95;          // px até valer como decisão
function ligarArraste() {
  const el = document.getElementById("topo");
  if (!el || Z.pedindoLado) return;
  const carimbos = {
    sim: el.querySelector(".c-sim"), nao: el.querySelector(".c-nao"),
    ine: el.querySelector(".c-ine"), pular: el.querySelector(".c-pular"),
  };
  let x0 = 0, y0 = 0, arrastando = false, pid = null;

  const pinta = (dx, dy) => {
    const horizontal = Math.abs(dx) > Math.abs(dy);
    const v = { sim: 0, nao: 0, ine: 0, pular: 0 };
    if (horizontal) v[dx > 0 ? "sim" : "nao"] = Math.min(1, Math.abs(dx) / LIMIAR);
    else v[dy < 0 ? "ine" : "pular"] = Math.min(1, Math.abs(dy) / LIMIAR);
    for (const k in carimbos) if (carimbos[k]) carimbos[k].style.opacity = v[k];
  };
  const solta = (dx, dy) => {
    const horizontal = Math.abs(dx) > Math.abs(dy);
    const d = horizontal ? Math.abs(dx) : Math.abs(dy);
    if (d < LIMIAR) {                       // volta para o lugar
      el.style.transition = "transform .2s ease";
      el.style.transform = "";
      pinta(0, 0);
      setTimeout(() => (el.style.transition = ""), 220);
      return;
    }
    const dir = horizontal ? (dx > 0 ? "sim" : "nao") : dy < 0 ? "ine" : "pular";
    if (dir === "ine") { Z.pedindoLado = true; el.style.transform = ""; pinta(0, 0); desenhar(); return; }
    // sai voando na direção do gesto
    el.style.transition = "transform .28s ease-out, opacity .28s ease-out";
    el.style.transform = `translate(${horizontal ? Math.sign(dx) * 900 : dx}px, ${horizontal ? dy : Math.sign(dy) * 900}px) rotate(${dx / 12}deg)`;
    el.style.opacity = "0";
    const valor = dir === "sim" ? "concordo" : dir === "nao" ? "discordo" : "indiferente";
    setTimeout(() => responderCartao(valor), 180);
  };

  el.addEventListener("pointerdown", (ev) => {
    if (ev.button !== undefined && ev.button !== 0) return;
    arrastando = true; pid = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
    el.setPointerCapture(pid); el.style.transition = "";
  });
  el.addEventListener("pointermove", (ev) => {
    if (!arrastando || ev.pointerId !== pid) return;
    const dx = ev.clientX - x0, dy = ev.clientY - y0;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 20}deg)`;
    pinta(dx, dy);
  });
  const fim = (ev) => {
    if (!arrastando || ev.pointerId !== pid) return;
    arrastando = false;
    solta(ev.clientX - x0, ev.clientY - y0);
  };
  el.addEventListener("pointerup", fim);
  el.addEventListener("pointercancel", () => {
    arrastando = false; el.style.transition = "transform .2s ease"; el.style.transform = ""; pinta(0, 0);
  });
  el.focus({ preventScroll: true });
}

// ── eventos ──────────────────────────────────────────────────────────────────
appEl.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-resp], [data-ir]");
  if (!b) return;
  if (b.dataset.resp) return responderCartao(b.dataset.resp, b.dataset.ine === "1");
  switch (b.dataset.ir) {
    case "cartoes": Z.tela = "cartoes"; gravar(); desenhar(); break;
    case "recomecar": recomecar(); break;
    case "pedir-lado": Z.pedindoLado = true; desenhar(); break;
    case "cancelar-lado": Z.pedindoLado = false; desenhar(); break;
  }
});
document.addEventListener("keydown", (ev) => {
  if (Z.tela !== "cartoes" || Z.pedindoLado) return;
  const m = { ArrowRight: "concordo", ArrowLeft: "discordo", ArrowDown: "indiferente" };
  if (ev.key === "ArrowUp") { ev.preventDefault(); Z.pedindoLado = true; desenhar(); return; }
  if (m[ev.key]) { ev.preventDefault(); responderCartao(m[ev.key]); }
});

if (recuperar() && Z.tela !== "abertura") { /* retoma onde parou */ }
desenhar();

</script>
</body>
</html>

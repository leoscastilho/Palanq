os ou menos: Reduzir a maioridade penal para 16 anos, assegurando a responsabilização criminal de adolescentes a partir dessa idade e permitindo, excepcionalmente, a imputação penal de pessoas ainda mais jovens nos casos de crimes graves, como homicídio e estupro, ou reincidência.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 6 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_porte_arma_rural","postura":"favor","citacao":{"texto":"DEFENDER A PROPRIEDADE RURAL Garantir o porte de armas em toda a extensão da propriedade rural e o direito à autodefesa do produtor: Consolidar e ampliar o direito do produtor rural de portar arma em toda a extensão de sua propriedade, avançando para além da posse estendida já prevista em lei, com segurança jurídica para o exercício da legítima defesa e proteção efetiva do Estado contra invasões.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 45 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_homeschooling","postura":"favor","citacao":{"texto":"DAR ÀS FAMÍLIAS MAIS LIBERDADE DE ESCOLHA E PLURALIDADE DE MODELOS EDUCACIONAIS Aumentar as opções de modelos educacionais no país: Dar mais liberdade aos pais de escolher o modelo educacional de seus filhos, facilitando a formalização de parcerias com instituições comunitárias, filantrópicas e confessionais, avançando em uma agenda de parcerias com escolas conveniadas na educação, escolas cívico-militares e regulamentando o homeschooling.","fonte":"Plano de governo registrado — Romeu Zema (Novo)","local":"página 53 de 81","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Zema_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C04","nome":"Renan Santos","partido":"Missão","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","planoNota":"Plano de governo integral (51 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_ppp_servicos_publicos","postura":"favor","citacao":{"texto":"A governança desses polos opera por meio de Parcerias Público-Privadas (Lei 11.079/2004) e, quando cruzar fronteiras estaduais, de Consórcios Públicos (Lei 11.107/2005), com previsão de expansão para outros estados.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 36 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano critica explicitamente a fórmula de \"privatizar tudo\" (p. 5). A postura \"favor\" aqui vale para PPPs como instrumento de governança, que o plano adota, e NÃO para privatização como programa — por isso a candidatura não aparece no eixo de privatização de estatais."},{"eixo":"e_ensino_civico_militar","postura":"favor","citacao":{"texto":"A militarização das escolas deve ser vista como uma medida provisória, a fim de estancar a violência endêmica, em especial nas regiões com alta criminalidade no entorno.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 32 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"favor\" é qualificada na própria citação: o plano trata a militarização escolar como medida provisória e localizada, não como modelo educacional."},{"eixo":"e_renda_sem_contrapartida","postura":"contra","citacao":{"texto":"Traduzimos as ideias à nossa realidade política e adicionamos também outros temas de interesse, em especial o projeto de reforma do assistencialismo, com a substituição do Bolsa Família por um programa de Frentes Cidadãs que incentive a inserção dos beneficiários ao mercado formal de trabalho.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 21 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_encarceramento_excecao","postura":"favor","citacao":{"texto":"As lideranças condenadas serão deslocadas a superpresídios de segurança máxima em regiões remotas, no modelo do CECOT salvadorenho, equipados com blindagem eletromagnética e biometria contínua, neutralizando o comando das facções a partir do cárcere.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 13 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"contra","citacao":{"texto":"O governo da Missão não criará um único novo assentamento enquanto os já existentes não atingirem níveis de produtividade compatíveis com os exigidos dos demais imóveis rurais brasileiros.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 42 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"contra","citacao":{"texto":"Após a implementação do plano, o principal instrumento de ajuste fiscal foi a elevação da carga tributária;","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 9 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata de imposto sobre grandes fortunas. A postura \"contra\" é inferida do diagnóstico de que elevar a carga tributária foi o erro dos ajustes anteriores, e da proposta de ajustar pelo gasto — mesmo critério aplicado às demais candidaturas contrárias neste eixo."},{"eixo":"e_licenciamento_simplificado","postura":"favor","citacao":{"texto":"Racionalização e simplificação dos processos de licenciamento ambiental para a exploração dos minérios, com base na nova Lei Geral do Licenciamento Ambiental (Lei nº 15.190/2025, em vigor desde fevereiro de 2026).","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 39 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"favor","citacao":{"texto":"e construir, no Congresso, o marco da exploração mineral controlada em terras indígenas, que abrigam reservas estratégicas de fosfato e potássio.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 42 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_vigilancia_massa","postura":"favor","citacao":{"texto":"Um novo sistema de drones e totens de denúncia transformará a reação ao crime em prevenção, com patrulhamento autônomo e reconhecimento facial em tempo real, integrado ao uso de dados genéticos e identificação facial para a resolução de crimes hediondos.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 13 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Outra ideia que buscaremos implementar, uma das mais arrojadas deste livro, é a integração do Programa Genomas Brasil ao Prontuário Eletrônico do SUS, cujo novo formato também delineamos aqui.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 26 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_isolamento_liderancas","postura":"favor","citacao":{"texto":"As lideranças condenadas serão deslocadas a superpresídios de segurança máxima em regiões remotas, no modelo do CECOT salvadorenho, equipados com blindagem eletromagnética e biometria contínua, neutralizando o comando das facções a partir do cárcere.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 13 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_administrativa","postura":"favor","citacao":{"texto":"Nesse sentido, propomos seis diretrizes principais: 1 aumento do investimento estatal em infraestrutura, condicionado à reforma administrativa e fiscal prévia;","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 24 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ia_soberania_digital","postura":"favor","citacao":{"texto":"O Projeto Abaporu será um laboratório nacional de inteligência artificial com capital privado majoritário, governança independente e mandato concentrado na exploração das vantagens competitivas únicas do nosso país.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 43 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"CAPÍTULO I AJUSTE FISCAL UM REMÉDIO AMARGO O ajuste fiscal urgente para desatolar o Estado brasileiro O PROBLEMA EM NÚMEROS A RESPOSTA DA MISSÃO O PROBLEMA O governo brasileiro hoje não tem dinheiro para gastar.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 9 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_fim_fundo_eleitoral","postura":"favor","citacao":{"texto":"Vínculo com o Financiamento Partidário: O repasse do Fundo Partidário e do Fundo Eleitoral passará a ser calculado com base na qualidade gerencial dos mandatários.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 18 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_fusao_municipios","postura":"favor","citacao":{"texto":"Nessa linha, o governo da Missão vai promover a maior reorganização territorial da história republicana brasileira: a Grande Consolidação Municipal, programa federal de fusão de municípios inviáveis em unidades administrativas com escala suficiente para entregar serviços públicos de qualidade.","fonte":"Plano de governo registrado — Renan Santos (Missão)","local":"página 15 de 51","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Renan_Missao_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C05","nome":"Luiz Inácio Lula da Silva","partido":"PT","planoUrl":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","planoNota":"Plano de governo integral (84 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_negociado_sobre_legislado","postura":"contra","citacao":{"texto":"Vamos continuar combatendo a pejotização espúria, com fiscalização, regras que inibam migrações fraudulentas, equiparando responsabilidades administrativas e previdenciárias e fortalecendo a inspeção do trabalho.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 74 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_renda_sem_contrapartida","postura":"favor","citacao":{"texto":"Estas conquistas devem-se às políticas de garantia de renda e elevação do poder de compra das famílias, como o Bolsa Família e a política de valorização do saláriomínimo;","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 58 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"favor","citacao":{"texto":"As novas reservas serão exploradas com cuidados socioambientais ainda maiores e visão estratégica.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 67 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não cita a Margem Equatorial. A postura \"favor\" vem do compromisso de que a Petrobras siga ampliando exploração onshore e offshore e de que \"as novas reservas serão exploradas\", ainda que com ressalva socioambiental."},{"eixo":"e_reforma_agraria","postura":"favor","citacao":{"texto":"Continuaremos a avançar na política de reforma agrária, assentando as famílias acampadas, estruturando os assentamentos e ampliando o acesso ao crédito fundiário.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 60 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"favor","citacao":{"texto":"Sob a diretriz de “colocar o pobre no orçamento e o rico no Imposto de Renda”, a gestão realizou uma profunda reorganização fiscal que elevou a proteção social sem renunciar ao reequilíbrio das contas públicas.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 10 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não propõe imposto sobre grandes fortunas nem sobre heranças. A postura \"favor\" vem do compromisso declarado de deslocar a carga para o topo (\"o pobre no orçamento e o rico no Imposto de Renda\") e de reduzir a regressividade do sistema — é sobre progressividade da renda, não sobre tributar patrimônio."},{"eixo":"e_alinhamento_brics","postura":"favor","citacao":{"texto":"Alcançamos esses resultados tão positivos a despeito de um cenário internacional extremamente desafiador marcado por ataques ao multilateralismo e ao direito internacional e pela tentativa de imposição de uma ordem mundial predatória.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 12 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não declara explicitamente a permanência no BRICS. A postura \"favor\" é inferida da defesa do multilateralismo e do registro da cúpula do bloco sediada pelo governo."},{"eixo":"e_licenciamento_simplificado","postura":"contra","citacao":{"texto":"A demolição planejada das estruturas ambientais legitimou o garimpo ilegal, a grilagem de terras públicas e o aumento recorde do desmatamento ilegal.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 9 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não trata da Lei 15.190/2025. A postura \"contra\" é inferida da crítica explícita à desmontagem das estruturas de controle ambiental e de seus efeitos."},{"eixo":"e_liberdade_irrestrita_redes","postura":"contra","citacao":{"texto":"É parte da reafirmação da democracia avançar ainda mais na regulação democrática das redes sociais e das plataformas digitais, de modo a impedir que elas difundam desinformação, acolham campanhas de ódio e outras formas de comunicação nocivas para a democracia.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 16 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Na terra Yanomami enfrentamos a emergência em saúde e combatemos o garimpo ilegal, que foi reduzido em 99%.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 20 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não menciona a regulamentação da mineração em terras indígenas. A postura \"contra\" é inferida do combate declarado ao garimpo em território indígena e da retomada das homologações — mesmo critério aplicado às demais candidaturas contrárias neste eixo."},{"eixo":"e_reducao_jornada","postura":"favor","citacao":{"texto":"Manteremos nossa ação junto ao Senado Federal para assegurar o fim da escala 6x1 e a redução da jornada de trabalho para 40 horas, sem redução salarial, nos termos aprovados na Câmara dos Deputados.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 75 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ministerio_seguranca","postura":"favor","citacao":{"texto":"Uma vez aprovada a PEC da Segurança Pública proposta pelo Executivo, criaremos o Ministério da Segurança Pública para coordenar, em articulação com estados e municípios, a execução das políticas nacionais de segurança pública no âmbito do Sistema Único de Segurança Pública (SUSP).","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 30 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_integral","postura":"favor","citacao":{"texto":"A partir de 2026, com a inclusão, no Fundeb, do financiamento à educação em tempo integral, a expectativa é que a ampliação dessa modalidade se acelere, garantindo melhores condições de aprendizado para os estudantes.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 31 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_interoperabilidade_saude","postura":"favor","citacao":{"texto":"Vamos acelerar os esforços na consolidação do prontuário único do cidadão, que já avança por meio da Rede Nacional de Dados em Saúde (RNDS).","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 35 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ia_soberania_digital","postura":"favor","citacao":{"texto":"tecnologias digitais e a inteligência artificial, baseada na soberania digital com proteção de dados, cooperação científica, transferência de tecnologias estratégicas e regulamentação democrática das plataformas digitais e da IA.","fonte":"Plano de governo registrado — Luiz Inácio Lula da Silva (PT)","local":"página 82 de 84","url":"https://static.poder360.com.br/uploads/2026/08/plano-governo-lula.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"favor","citacao":{"texto":"Trabalhamos em conjun produzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"contra","citacao":{"texto":"No lugar da exploração da Margem Equatorial, defendemos pesquisas e buscas em outras áreas e uma melhor exploração do Pré-Sal, reduzindo os lucros e a extração desenfreada, que visam apenas beneficiar o grande capital, drenando nossas reservas e encarecendo produtos e serviços.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 14 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"favor","citacao":{"texto":"No campo, realizaremos a reforma agrária popular, e todos os latifúndios improdutivos, áreas de trabalho escravo ou as fazendas que não cumpram sua função social serão desapropriados sem indenização.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"favor","citacao":{"texto":"Reforma tributária: redução da tributação sobre o consumo, com cobrança progressiva de impostos, de acordo com o rendimento de cada contribuinte, além da criação de um imposto especial sobre lucros e dividendos, grandes fortunas, transações financeiras e heranças.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 14 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_previdencia","postura":"contra","citacao":{"texto":"Uma política econômica anticapitalista Revogação de todas as contrarreformas neoliberais, como a previdenciária e a trabalhista e do Arcabouço Fiscal, bem como da autonomia do Banco Central.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"contra","citacao":{"texto":"Defendemos a forte regulação das Big Techs e redes sociais imperialistas e o monopólio estatal das telecomunicações, da telefonia e da internet, com incentivo à criação de cooperativas dos trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Demarcação e proteção integral de todos os territórios indígenas, que serão geridos por conselhos populares dos povos originários.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não menciona a regulamentação da mineração em terras indígenas. A postura \"contra\" é inferida da defesa de proteção integral dos territórios sob gestão dos próprios povos originários."},{"eixo":"e_reducao_jornada","postura":"favor","citacao":{"texto":"C) Propomos reformas estruturais nas áreas sociais e do mundo do trabalho, com a implantação da jornada de 30 horas semanais sem redução salarial e o fim da escala 6x1;","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 2 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ministerio_seguranca","postura":"contra","citacao":{"texto":"Segurança dos Direitos no lugar da velha “Segurança Pública” A segurança pública será desmilitarizada e reorganizada sob o marco civil, com controle social substituindo uma política e um ministério de segurança pública para uma política de segurança dos direitos, com base na criminologia crítica e no acúmulo político e programático dos movimentos negros e populares.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"A postura \"contra\" é inferida da proposta de substituir a política e o ministério de segurança pública por uma \"política de segurança dos direitos\" sob marco civil."},{"eixo":"e_desmilitarizacao","postura":"favor","citacao":{"texto":"O governo do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a completa desmilitarização da segurança pública, com unificação das polícias e instituição do ciclo completo junto com a desvinculação das forças de segurança do exército, sob bases curriculares e formativas completamente reestruturadas numa lógica democrática.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_setores","postura":"favor","citacao":{"texto":"Defendemos a forte regulação das Big Techs e redes sociais imperialistas e o monopólio estatal das telecomunicações, da telefonia e da internet, com incentivo à criação de cooperativas dos trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 13 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_auditoria_divida","postura":"favor","citacao":{"texto":"A dívida pública será reestruturada e seu passivo será substituído por títulos de longo prazo.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_arcabouco_fiscal","postura":"contra","citacao":{"texto":"Agiremos para promover a revogação do Arcabouço Fiscal, da Lei de Responsabilidade Fiscal, da Lei das Estatais (13.303/2016), a retomada do Banco Central (fim da autonomia), desmontando todo fiscalismo e arcabouço jurídico e institucional neoliberal","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_controle_externo_stf","postura":"favor","citacao":{"texto":"O Judiciário também será democratizado, com mandatos por tempo definido para os Tribunais Regionais e Superiores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_maioridade_penal","postura":"contra","citacao":{"texto":"Contra a redução da maioridade penal e ampliação das medidas socioeducativas.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_descriminalizacao_drogas","postura":"favor","citacao":{"texto":"O governo do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a completa desmilitarização da segurança pública, com unificação das polícias e instituição do ciclo completo junto com a desvinculação das forças de segurança do exército, sob bases curriculares e formativas completamente reestruturadas numa lógica democrática.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 6 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_aborto","postura":"favor","citacao":{"texto":"Legalização do aborto, com garantia de atendimento na rede pública de saúde, bem como políticas públicas que possibilitem a emancipação da mulher dos trabalhos domésticos, zerando as filas de creches, ampliando a educação integral e efetuando a construção massiva de restaurantes e lavanderias populares.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 11 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_cotas_trans","postura":"favor","citacao":{"texto":"Universalização das cotas universitárias para a população Trans.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 12 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_passe_livre","postura":"favor","citacao":{"texto":"No transporte será implantada a tarifa zero com transporte 100% público em todo território nacional, acabando com a política de emendas parlamentares para contribuir com o custeio, processo que se complementará com ampliação da malha ferroviária e hidroviária.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 7 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_unicameralismo","postura":"favor","citacao":{"texto":"Visando aprofundar as liberdades democráticas e implantar mecanismos de democracia direta, serão instituídos os Conselhos Populares, eleitos nos locais de trabalho, moradia e estudo, como instrumentos permanentes de participação popular.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_estatizacao_midia","postura":"favor","citacao":{"texto":"O governo popular realizará a democratização dos meios de comunicação, com a transformação dos monopólios privados de comunicações em cooperativas dos trabalhadores e o fortalecimento da Empresa Brasileira de Comunicação (EBC), sob a direção de um Conselho de Trabalhadores.","fonte":"Plano de governo registrado — Edmilson Costa (PCB)","local":"página 4 de 16","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Edmilson_Costa_PCB_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null}]},{"id":"C11","nome":"Hertz Dias","partido":"PSTU","planoUrl":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","planoNota":"Plano de governo integral (33 páginas), conforme publicado pelo Poder360. Prevalece sobre qualquer trecho citado aqui.","posicoes":[{"eixo":"e_privatizacao_estatais","postura":"contra","citacao":{"texto":"Até mesmo o saneamento básico está sendo entregue aos grupos estrangeiros, num sentido inverso a diversos países da Europa que hoje estão sendo obrigados a reverterem uma série de privatizações do setor de saneamento.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 2 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ppp_servicos_publicos","postura":"contra","citacao":{"texto":"Avançam processos de privatização e concessão de metrôs, estradas e ferrovias, aprofundando a mercantilização da mobilidade.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 13 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_gestao_privada_saude","postura":"contra","citacao":{"texto":"Defesa do sus público, universal, gratuito e 100% estatal Fim da privatização e da gestão privada da saúde (OS, Fundações e PPP) Proibição da transferência de leitos públicos para planos privados Ampliação do investimento público em saúde, com prioridade para a atenção básica Cuidado com a saúde mental: ampliação do investimento público nos Centros de Atenção Psicossocial (Caps), no Serviço de Residências Terapêuticas e Centros de Convivência.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 11 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_ensino_civico_militar","postura":"contra","citacao":{"texto":"Não à militarização das escolas e a projetos de controle ideológico, como Escola Sem Partido!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 12 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_negociado_sobre_legislado","postura":"contra","citacao":{"texto":"Revogação da reforma trabalhista Revogação da lei das terceirizações.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_renda_sem_contrapartida","postura":"favor","citacao":{"texto":"Bolsa equivalente a um salário mínimo para trabalhadores desempregados enquanto não houver pleno emprego.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":"O plano não discute contrapartidas; propõe bolsa de um salário mínimo a desempregados enquanto não houver pleno emprego, sem condicionalidade declarada. A postura \"favor\" é inferida da ausência de contrapartida no desenho do benefício."},{"eixo":"e_encarceramento_excecao","postura":"contra","citacao":{"texto":"Da mesma forma, exigir o fim da matança e do encarceramento em massa da juventude pobre e negra, a desmilitarização da PM, a eleição de delegados pelas comunidades e o controle popular da segurança significa enfrentar o braço armado do Estado burguês nas periferias, assim como as relações entre repressão, milícias, tráfico, poder econômico e poder político.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 30 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_margem_equatorial","postura":"contra","citacao":{"texto":"Não à exploração do petróleo da Margem Equatorial!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 15 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_agraria","postura":"favor","citacao":{"texto":"Por reforma agrária e por uma revolução na estrutura do campo brasileiro!","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 16 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_tributar_altas_rendas","postura":"favor","citacao":{"texto":"Imposto progressivo sobre as verdadeiras grandes fortunas, o topo da pirâmide, os que possuem de R$ 1 bilhão para cima.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 27 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_reforma_previdencia","postura":"contra","citacao":{"texto":"Revogação da reforma da Previdência Correção anual e atualização integral da tabela do Imposto de Renda para os assalariados Ao lutar por salário, jornada e direitos, os trabalhadores se deparam com os limites impostos pelas empresas, pelo mercado e pela lógica do lucro, o que abre o caminho para questionarmos quem controla a produção e a riqueza.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 8 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_liberdade_irrestrita_redes","postura":"contra","citacao":{"texto":"Combate às ideologias misóginas e responsabilização das plataformas que lucram com a disseminação do ódio contra as mulheres.","fonte":"Plano de governo registrado — Hertz Dias (PSTU)","local":"página 23 de 33","url":"https://static.poder360.com.br/uploads/2026/08/Plano_gov_Hertz_Dias_PSTU_2026.pdf","contexto":"Trecho reproduzido literalmente do plano de governo registrado. O link abre o documento completo, onde ele pode ser conferido.","recuperadoEm":"2026-08-26"},"interpretacao":null},{"eixo":"e_mineracao_terras_indigenas","postura":"contra","citacao":{"texto":"Reparação e demarcação imediata das terras indígenas, titulação dos territórios quilombolas e proteção das comunidades tradici

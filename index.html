<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">

<title>Match Presidenciáveis — Eleição Geral de 2026</title>
<style>
/* Sem fontes externas, sem requisição de rede: o argumento de privacidade é a
   ausência de servidor, e uma fonte remota o quebraria (§26). */
:root {
  --bg: #fbfaf8; --fg: #1a1a19; --fg2: #55534e; --fg3: #86837c;
  --linha: #ded9d0; --caixa: #ffffff; --realce: #f3efe7;
  --acento: #1f4f7a; --acento-fg: #ffffff;
  --ok: #1c6b45; --alerta: #8a4b12; --perigo: #9b2226; --perigo-bg: #fdf2f2;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --fg: #e8e6e1; --fg2: #a8a49c; --fg3: #7b776f;
    --linha: #33343a; --caixa: #1e1f24; --realce: #24262c;
    --acento: #6aa6dc; --acento-fg: #10131a;
    --ok: #6ec69a; --alerta: #d99a4e; --perigo: #e88; --perigo-bg: #2a1c1d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
       font-size: 16px; line-height: 1.55; }
h1, h2, h3 { line-height: 1.25; font-weight: 650; margin: 0 0 .5rem; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
p { margin: 0 0 .8rem; }
a { color: var(--acento); }
small, .mini { font-size: .82rem; color: var(--fg2); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.topo { border-bottom: 1px solid var(--linha); background: var(--caixa); position: sticky; top: 0; z-index: 5; }
.topo .in { max-width: 1180px; margin: 0 auto; padding: .6rem 1rem; display: flex; gap: 1rem;
            align-items: baseline; flex-wrap: wrap; }
.topo b { font-size: .95rem; }
.topo .mini { margin-left: auto; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

.aviso { border: 1px solid var(--linha); border-left: 4px solid var(--alerta);
         background: var(--realce); padding: .75rem .9rem; margin: 0 0 1rem; border-radius: 3px; }
.aviso.perigo { border-left-color: var(--perigo); background: var(--perigo-bg); }
.aviso h3 { color: var(--alerta); }
.aviso.perigo h3 { color: var(--perigo); }

button { font: inherit; cursor: pointer; border: 1px solid var(--linha); background: var(--caixa);
         color: var(--fg); padding: .45rem .8rem; border-radius: 4px; }
button:hover { border-color: var(--acento); }
button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
button.primario { background: var(--acento); color: var(--acento-fg); border-color: var(--acento); font-weight: 600; }
button.fantasma { border-color: transparent; color: var(--fg2); padding: .2rem .4rem; }
button.fantasma:hover { color: var(--acento); }

/* ── entrevista ─────────────────────────────────────────────────────────── */
.painel { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 900px) { .painel { grid-template-columns: 1fr; } }

.cartao { background: var(--caixa); border: 1px solid var(--linha); border-radius: 5px; padding: 1.1rem; }
.cartao + .cartao { margin-top: 1rem; }
.selo { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
        color: var(--fg2); border: 1px solid var(--linha); border-radius: 999px; padding: .1rem .55rem; }
.selo.comp { color: var(--alerta); border-color: var(--alerta); }
.selo.destaque { color: var(--acento); border-color: var(--acento); }

.pergunta { font-size: 1.3rem; font-weight: 600; margin: .6rem 0 .3rem; line-height: 1.35; }
.porque { font-size: .85rem; color: var(--fg2); border-left: 2px solid var(--linha); padding-left: .7rem; margin: .8rem 0; }
.respostas { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: 1rem; }
.respostas button { padding: .7rem .6rem; text-align: left; }
.respostas button b { display: block; }
.respostas button i { font-style: normal; font-size: .78rem; color: var(--fg2); }
@media (max-width: 560px) { .respostas { grid-template-columns: 1fr; } }

.lv { margin-top: 1rem; border: 1px dashed var(--linha); border-radius: 4px; padding: .6rem .75rem; }
.lv.ativa { border-style: solid; border-color: var(--perigo); background: var(--perigo-bg); }
.lv label { display: flex; gap: .55rem; align-items: flex-start; cursor: pointer; font-size: .88rem; }
.lv input { margin-top: .25rem; }

/* ── ranking ao vivo ────────────────────────────────────────────────────── */
table.rank { width: 100%; border-collapse: collapse; font-size: .87rem; }
table.rank td, table.rank th { padding: .3rem .35rem; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: baseline; }
table.rank th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--fg3); font-weight: 600; }
table.rank td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.lider td { background: var(--realce); font-weight: 600; }
tr.morto td { color: var(--fg3); text-decoration: line-through; }
.barra { height: 4px; background: var(--linha); border-radius: 2px; overflow: hidden; margin-top: .2rem; }
.barra i { display: block; height: 100%; background: var(--acento); }
.cob-baixa { color: var(--alerta); font-weight: 600; }

.rastro { list-style: none; margin: 0; padding: 0; font-size: .84rem; }
.rastro li { display: flex; gap: .5rem; padding: .3rem 0; border-bottom: 1px solid var(--linha); align-items: baseline; }
.rastro li span { flex: 1; min-width: 0; }
.rastro li .r { color: var(--fg2); white-space: nowrap; font-family: var(--mono); font-size: .78rem; }

/* ── resultado ──────────────────────────────────────────────────────────── */
.lideres { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.lider-cartao { border: 2px solid var(--acento); border-radius: 5px; padding: .9rem; background: var(--caixa); }
.lider-cartao h3 { font-size: 1.05rem; }
.metrica { display: flex; gap: 1.2rem; margin: .5rem 0; }
.metrica div b { display: block; font-family: var(--mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.metrica div small { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--fg3); }

.cit { font-family: var(--serif); font-size: .92rem; background: var(--realce); border-left: 3px solid var(--linha);
       padding: .55rem .75rem; margin: .4rem 0; border-radius: 0 3px 3px 0; }
.cit .fonte { display: block; font-family: var(--sans); font-size: .74rem; color: var(--fg3); margin-top: .4rem; }
.cit.inferida { border-left-color: var(--alerta); }
.interp { font-family: var(--sans); font-size: .8rem; color: var(--alerta); margin-top: .45rem;
          border-top: 1px dotted var(--linha); padding-top: .4rem; }

details { border: 1px solid var(--linha); border-radius: 4px; margin: .5rem 0; background: var(--caixa); }
details > summary { cursor: pointer; padding: .55rem .8rem; font-weight: 600; font-size: .92rem; list-style-position: inside; }
details[open] > summary { border-bottom: 1px solid var(--linha); }
details .corpo { padding: .7rem .8rem; }
.eixo-linha { padding: .45rem 0; border-bottom: 1px solid var(--linha); }
.eixo-linha:last-child { border-bottom: 0; }
.eixo-linha b { font-weight: 600; }
.tag { font-size: .72rem; color: var(--fg3); }
.ok-cor { color: var(--ok); } .alerta-cor { color: var(--alerta); } .perigo-cor { color: var(--perigo); }
.acoes { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.2rem 0; }
pre.relatorio { white-space: pre-wrap; font-family: var(--mono); font-size: .76rem; line-height: 1.5;
                background: var(--caixa); border: 1px solid var(--linha); padding: .9rem; border-radius: 4px;
                max-height: 60vh; overflow: auto; }
.planos { width: 100%; border-collapse: collapse; font-size: .88rem; }
.planos td { padding: .35rem .4rem; border-bottom: 1px solid var(--linha); }
.oculto { display: none !important; }

</style>
</head>
<body>
<header class="topo">
  <div class="in">
    <b>Match Presidenciáveis</b>
    <span class="mini" id="topo-escopo"></span>
    <span class="mini" id="topo-versao"></span>
  </div>
</header>
<main class="wrap" id="app"></main>

<script type="module">
/**
 * Motor de alinhamento entre posições do usuário e posições declaradas em planos
 * de governo. Híbrido: ELIMINAÇÃO para o inegociável, ACUMULAÇÃO para o resto.
 *
 * Porte de `engine.js` do classificador clínico. Ver MOTOR-E-PORT-POLITICO.md.
 *
 * CONTRATO — nenhuma função deste arquivo pode quebrar isto:
 *   1. Pureza. Sem Date, sem Math.random, sem I/O, sem dependências. Todo estado
 *      é derivado de (corpus, respostas, linhasVermelhas) e recalculado do zero.
 *   2. Sem vencedor único imposto. `lideres` pode ter mais de um elemento.
 *   3. Ignorância ≠ negação. "ns" mantém a pendência e não move o score.
 *   4. Não perguntado ≠ inconclusivo ≠ indiferente. Três ausências distintas,
 *      preservadas até o relatório.
 *   5. Toda eliminação tem motivo estruturado, com a citação que a causou.
 *   6. Contraste nunca elimina. É sinal.
 *   7. Silêncio nunca soma nem subtrai; reduz `cobertura`.
 *   8. Eixo não discriminante (unânime ou unilateral) fica FORA de afinidade e
 *      cobertura, mesmo que respondido — ver §20 da especificação.
 *   9. Determinismo. Empates resolvidos lexicograficamente.
 *  10. Terminação. Toda pergunta devolvida consome uma variável não respondida.
 */

const RESPOSTAS_VALIDAS = ["concordo", "discordo", "indiferente", "ns"];
const MARGEM_PADRAO = 0.05;

const asSet = (x) => (x instanceof Set ? x : new Set(x || []));
const pesoDe = (corpus, eixo) => corpus.eixos[eixo]?.peso ?? 1;

/** Postura declarada por `cand` no `eixo`, ou null. */
function postura(cand, eixo) {
  return cand.posicoes.find((p) => p.eixo === eixo) || null;
}

/**
 * Lógica de quatro valores, análoga a `testar()` do motor clínico.
 * Devolve: true alinhado · false divergente · null neutralizado (indiferente)
 *          · undefined sem sinal (não perguntado, "ns", ou candidato mudo).
 */
function confrontar(resposta, postura) {
  if (resposta === undefined || resposta === "ns") return undefined;
  if (resposta === "indiferente") return null;
  if (!postura) return undefined;
  return (
    (resposta === "concordo" && postura.postura === "favor") ||
    (resposta === "discordo" && postura.postura === "contra")
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Eliminações — passada independente da classificação dos eixos
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Linhas vermelhas e portões. Roda ANTES de qualquer cálculo de score, porque
 * a eliminação não depende de quais eixos são discriminantes: se o usuário
 * declarou um eixo inegociável, divergir nele elimina — inclusive num eixo
 * unânime, caso em que o campo inteiro cai e §21 manda mostrar o contrafactual.
 *
 * "ns" e "indiferente" NUNCA eliminam: ignorância e indiferença não são divergência.
 */
function eliminacoes(corpus, respostas, linhasVermelhas = new Set()) {
  const lv = asSet(linhasVermelhas);
  const out = {};
  for (const cand of corpus.candidatos) {
    let motivo = null;
    for (const eixo of Object.keys(corpus.eixos)) {
      if (!lv.has(eixo)) continue;
      const p = postura(cand, eixo);
      if (confrontar(respostas[eixo], p) !== false) continue;
      motivo = { tipo: "linha-vermelha", eixo, postura: p.postura, citacao: p.citacao, interpretacao: p.interpretacao };
      break; // só a PRIMEIRA linha violada vira motivo — o relatório diz por que caiu
    }
    out[cand.id] = motivo;
  }
  for (const [id, portao] of Object.entries(corpus.portoes || {})) {
    if (portao.efeito !== "invalida-todos-se-nao") continue;
    if (respostas[id] !== "nao") continue;
    for (const cand of corpus.candidatos) {
      out[cand.id] = out[cand.id] || { tipo: "portao", portao: id, pergunta: portao.pergunta };
    }
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// Classificação dos eixos — §20
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Reparte os eixos em quatro categorias, sobre o conjunto de candidatos `vivos`:
 *   divisivo    — há favor E contra. É o único que entra no ranking.
 *   unanime     — todos os vivos falaram, todos na mesma direção.
 *   unilateral  — só parte falou, sem oposição declarada.
 *   mudo        — nenhum vivo falou.
 * Incluir unânime ou unilateral no ranking INVERTE a ordem (§20). Fora.
 */
function classificarEixos(corpus, vivos) {
  const divisivos = [], unanimes = [], unilaterais = [], mudos = [];
  for (const eixo of Object.keys(corpus.eixos)) {
    const falam = vivos.map((c) => postura(c, eixo)).filter(Boolean);
    const nFavor = falam.filter((p) => p.postura === "favor").length;
    const nContra = falam.filter((p) => p.postura === "contra").length;
    const info = { eixo, nFavor, nContra, nFalam: falam.length, mudos: vivos.length - falam.length,
                   peso: pesoDe(corpus, eixo), separacoes: nFavor * nContra };
    if (nFavor > 0 && nContra > 0) divisivos.push({ ...info, categoria: "divisivo" });
    else if (falam.length === 0) mudos.push({ ...info, categoria: "mudo", postura: null });
    else if (falam.length === vivos.length) unanimes.push({ ...info, categoria: "unanime", postura: falam[0].postura });
    else unilaterais.push({ ...info, categoria: "unilateral", postura: falam[0].postura });
  }
  return { divisivos, unanimes, unilaterais, mudos };
}

const setDe = (lista) => new Set(lista.map((x) => x.eixo));

// ─────────────────────────────────────────────────────────────────────────────
// avaliar() — score, afinidade, cobertura
// ─────────────────────────────────────────────────────────────────────────────

/**
 * avaliar(corpus, respostas, linhasVermelhas) → { [id]: estado do candidato }
 *
 * `opts.discriminantes` permite injetar o conjunto de eixos que entra no ranking
 * (usado pelo motor para congelá-lo a partir dos vivos). Sem ele, é derivado
 * dos candidatos não eliminados.
 */
function avaliar(corpus, respostas, linhasVermelhas = new Set(), opts = {}) {
  const mortos = eliminacoes(corpus, respostas, linhasVermelhas);
  const vivos = corpus.candidatos.filter((c) => !mortos[c.id]);
  const classes = opts.classes || classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const discriminantes = opts.discriminantes || setDe(classes.divisivos);

  const out = {};
  for (const cand of corpus.candidatos) {
    const acc = {
      rank: { score: 0, pesoDeclarado: 0, pesoRespondido: 0, pesoSilencioso: 0,
              alinhados: [], divergentes: [], silencios: [] },
      comp: { score: 0, pesoDeclarado: 0, pesoRespondido: 0, pesoSilencioso: 0,
              alinhados: [], divergentes: [], silencios: [] },
    };
    const inconclusivos = [], indiferentes = [];

    for (const eixo of Object.keys(corpus.eixos)) {
      const r = respostas[eixo];
      if (r === undefined) continue;
      const p = postura(cand, eixo);
      if (r === "ns") { if (p) inconclusivos.push(eixo); continue; }
      if (r === "indiferente") { if (p) indiferentes.push(eixo); continue; }
      const bucket = discriminantes.has(eixo) ? acc.rank : acc.comp;
      const peso = pesoDe(corpus, eixo);
      bucket.pesoRespondido += peso;
      if (!p) { bucket.silencios.push(eixo); bucket.pesoSilencioso += peso; continue; }
      bucket.pesoDeclarado += peso;
      if (confrontar(r, p)) { bucket.score += peso; bucket.alinhados.push(eixo); }
      else { bucket.score -= peso; bucket.divergentes.push(eixo); }
    }

    const norm = (b) => (b.pesoDeclarado ? (b.score + b.pesoDeclarado) / (2 * b.pesoDeclarado) : null);
    const cob = (b) => (b.pesoRespondido ? b.pesoDeclarado / b.pesoRespondido : null);

    out[cand.id] = {
      id: cand.id,
      estado: mortos[cand.id] ? "eliminado" : "vivo",
      motivo: mortos[cand.id] || null,
      score: acc.rank.score,
      afinidade: norm(acc.rank),
      cobertura: cob(acc.rank),
      pesoDeclarado: acc.rank.pesoDeclarado,
      pesoRespondido: acc.rank.pesoRespondido,
      pesoSilencioso: acc.rank.pesoSilencioso,
      alinhados: acc.rank.alinhados,
      divergentes: acc.rank.divergentes,
      silencios: acc.rank.silencios,
      inconclusivos,
      indiferentes,
      // Métricas dos eixos NÃO discriminantes. Nunca entram no ranking (§20);
      // existem para separar candidaturas que empatam nos eixos divisivos.
      complementar: {
        score: acc.comp.score,
        afinidade: norm(acc.comp),
        cobertura: cob(acc.comp),
        pesoDeclarado: acc.comp.pesoDeclarado,
        pesoRespondido: acc.comp.pesoRespondido,
        alinhados: acc.comp.alinhados,
        divergentes: acc.comp.divergentes,
        silencios: acc.comp.silencios,
      },
    };
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// Ranking
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Afinidade `null` (o candidato não declarou nada sobre nada que foi respondido)
 * NÃO vira 0 — fica fora da ordem, listado à parte em `semSinal`.
 */
function ranking(corpus, estados, margem = MARGEM_PADRAO) {
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const comSinal = vivos.filter((c) => estados[c.id].afinidade !== null);
  const semSinal = vivos.filter((c) => estados[c.id].afinidade === null).map((c) => c.id);
  const ord = [...comSinal].sort(
    (a, b) => estados[b.id].afinidade - estados[a.id].afinidade || a.id.localeCompare(b.id)
  );
  if (!ord.length) return { ordem: [], lideres: [], empate: false, semSinal, margem };
  const topo = estados[ord[0].id].afinidade;
  const lideres = ord.filter((c) => topo - estados[c.id].afinidade <= margem).map((c) => c.id);
  return { ordem: ord.map((c) => c.id), lideres, empate: lideres.length > 1, semSinal, margem };
}

// ─────────────────────────────────────────────────────────────────────────────
// Consenso do campo — §20
// ─────────────────────────────────────────────────────────────────────────────

/**
 * afinidadeComOCampo: o quanto o campo eleitoral INTEIRO representa o usuário,
 * medido nos eixos NÃO discriminantes — unânimes e unilaterais (§20). São eixos
 * em que o campo fala com uma voz só, então a resposta do usuário não favorece
 * ninguém: é informação sobre o campo, não sobre a disputa. Nunca entra no ranking.
 *
 * `cobertura` aqui é o peso ponderado pela fração de candidatos vivos que de fato
 * declararam a posição: 1,00 num eixo unânime, menor num unilateral. Sem ela, um
 * campo em que uma única candidatura fala pareceria um campo comprometido.
 */
function afinidadeComOCampo(corpus, respostas, classes) {
  let score = 0, peso = 0, pesoPonderado = 0, pesoTotal = 0;
  const eixos = [];
  for (const u of [...classes.unanimes, ...classes.unilaterais]) {
    const r = respostas[u.eixo];
    if (r === undefined || r === "ns" || r === "indiferente") continue;
    const alinha = (r === "concordo" && u.postura === "favor") || (r === "discordo" && u.postura === "contra");
    const w = u.peso;
    const fracao = u.nFalam / (u.nFalam + u.mudos);
    peso += w;
    pesoPonderado += w * fracao;
    pesoTotal += w;
    score += alinha ? w : -w;
    eixos.push({ eixo: u.eixo, categoria: u.categoria, postura: u.postura, resposta: r,
                 alinha, peso: w, nFalam: u.nFalam, mudos: u.mudos });
  }
  return {
    afinidade: peso ? (score + peso) / (2 * peso) : null,
    cobertura: pesoTotal ? pesoPonderado / pesoTotal : null,
    score, pesoDeclarado: peso, eixos,
    respondidos: eixos.length,
    total: classes.unanimes.length + classes.unilaterais.length,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Contrastes — porte direto de diferenciais(). NUNCA elimina.
// ─────────────────────────────────────────────────────────────────────────────

function contrastes(corpus, respostas, estados) {
  const vivo = (id) => estados[id]?.estado === "vivo";
  const naoInvestigados = [], investigados = [], inativos = [];
  for (const t of corpus.contrastes || []) {
    const [a, z] = t.entre;
    if (!vivo(a) || !vivo(z)) { inativos.push({ ...t, motivo: "um dos lados foi eliminado" }); continue; }
    const v = respostas[t.discriminador];
    if (v === undefined) naoInvestigados.push({ ...t, motivo: "não perguntado" });
    else if (v === "ns") naoInvestigados.push({ ...t, motivo: "resposta inconclusiva" });
    else if (v === "indiferente") naoInvestigados.push({ ...t, motivo: "declarado indiferente" });
    else investigados.push({ ...t, resposta: v, inclina: t.inclina?.[v] || null });
  }
  return { naoInvestigados, investigados, inativos };
}

// ─────────────────────────────────────────────────────────────────────────────
// proximaPergunta() — quatro fases, estritamente ordenadas
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Fase 1 — eixos divisivos, por ganho = nFavor × nContra × peso (§19).
 *          Alcance máximo é inútil aqui: um eixo unânime não separa ninguém.
 * Fase 2 — discriminadores de contraste entre dois lados vivos. Prioriza pares
 *          em que AMBOS estão na liderança: é a pergunta mais valiosa que o
 *          instrumento pode fazer (§22, regra 2).
 * Fase 3 — portões. Só entram quando já existe ranking — mas o ranking usado é
 *          o CONTRAFACTUAL SEM PORTÕES (correção do B1): um portão que elimina
 *          todos não pode impedir que os portões seguintes sejam perguntados.
 * Fase 4 — opcional (opts.complementar). Eixos não discriminantes, marcados
 *          como tal. Alimentam `afinidadeComOCampo` e a afinidade complementar;
 *          nunca o ranking.
 */
function proximaPergunta(corpus, respostas, estados, opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const vivos = corpus.candidatos.filter((c) => estados[c.id]?.estado === "vivo");
  const base = vivos.length ? vivos : corpus.candidatos;
  const classes = opts.classes || classificarEixos(corpus, base);

  // Fase 1 — eixos divisivos
  const cands = classes.divisivos
    .filter((d) => respostas[d.eixo] === undefined && d.separacoes > 0)
    .map((d) => ({ ...d, ganho: d.separacoes * d.peso }))
    .sort((a, b) => b.ganho - a.ganho || b.peso - a.peso || a.eixo.localeCompare(b.eixo));
  if (cands.length) {
    const m = cands[0];
    // §22, regra 2: se este eixo é o discriminador de um contraste entre dois
    // líderes empatados, é a pergunta mais valiosa do instrumento. A ORDEM segue
    // o ganho (§19); o que muda é o destaque.
    const lideres = new Set(ranking(corpus, estados, margem).lideres);
    const par = (corpus.contrastes || []).find(
      (t) => t.discriminador === m.eixo && t.entre.every((id) => lideres.has(id))
    );
    return {
      tipo: "eixo", fase: 1, id: m.eixo, ...corpus.eixos[m.eixo],
      naoDiscriminante: false,
      separa: { favor: m.nFavor, contra: m.nContra, mudos: m.mudos, separacoes: m.separacoes, ganho: m.ganho },
      entreLideres: Boolean(par), desempata: par ? par.entre : null,
    };
  }

  // Fase 2 — contrastes.
  // NOTA MEDIDA: com as travas 15 e 16 do §24 em vigor, todo discriminador de
  // contraste tem posturas opostas declaradas pelos dois lados do par; se ambos
  // estão vivos, o eixo é divisivo por construção e a fase 1 já o consumiu. Esta
  // fase portanto NÃO dispara neste corpus — o valor dos contrastes está no
  // relatório ("não investigado" quando a resposta foi "ns" ou "indiferente") e no
  // destaque de desempate da fase 1. O código fica porque a arquitetura de fases
  // é do contrato do motor e um corpus com contraste em eixo não divisivo
  // (por exemplo, com as travas relaxadas) voltaria a alcançá-la.
  const { naoInvestigados } = contrastes(corpus, respostas, estados);
  const abertos = naoInvestigados.filter((t) => respostas[t.discriminador] === undefined);
  if (abertos.length) {
    const lideres = new Set(ranking(corpus, estados, margem).lideres);
    const entreLideres = abertos.find((t) => t.entre.every((id) => lideres.has(id)));
    const t = entreLideres || abertos[0];
    return {
      tipo: "contraste", fase: 2, id: t.discriminador, ...corpus.eixos[t.discriminador],
      naoDiscriminante: !setDe(classes.divisivos).has(t.discriminador),
      entre: t.entre, nota: t.nota || null, inclina: t.inclina || null,
      entreLideres: Boolean(entreLideres),
    };
  }

  // Fase 3 — portões. Gatilho lido do estado SEM portões (correção do B1).
  const semPortoes = { ...respostas };
  for (const g of Object.keys(corpus.portoes || {})) delete semPortoes[g];
  const estadosSemPortoes = avaliar(corpus, semPortoes, opts.linhasVermelhas || new Set(), { classes });
  if (ranking(corpus, estadosSemPortoes, margem).ordem.length > 0) {
    const g = Object.keys(corpus.portoes || {}).find((k) => respostas[k] === undefined);
    if (g) return { tipo: "portao", fase: 3, id: g, ...corpus.portoes[g], naoDiscriminante: false };
  }

  // Fase 4 — encerramento complementar, opcional
  if (opts.complementar) {
    const comp = [...classes.unanimes, ...classes.unilaterais]
      .filter((c) => respostas[c.eixo] === undefined)
      .sort((a, b) => b.peso - a.peso || a.eixo.localeCompare(b.eixo));
    if (comp.length) {
      const m = comp[0];
      return {
        tipo: "eixo", fase: 4, id: m.eixo, ...corpus.eixos[m.eixo],
        naoDiscriminante: true, categoria: m.categoria,
        campo: { postura: m.postura, nFalam: m.nFalam, mudos: m.mudos },
        restantes: comp.length,
      };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// analisar() — o orquestrador que a UI e o relatório consomem
// ─────────────────────────────────────────────────────────────────────────────

function analisar(corpus, respostas, linhasVermelhas = new Set(), opts = {}) {
  const margem = opts.margem ?? MARGEM_PADRAO;
  const mortos = eliminacoes(corpus, respostas, linhasVermelhas);
  const vivos = corpus.candidatos.filter((c) => !mortos[c.id]);
  const classes = classificarEixos(corpus, vivos.length ? vivos : corpus.candidatos);
  const estados = avaliar(corpus, respostas, linhasVermelhas, { classes });
  const rk = ranking(corpus, estados, margem);

  // §21, regra 3: se TODOS caíram, mostrar o ranking que existiria sem as linhas
  // vermelhas. Devolver conjunto vazio sem explicação é o pior resultado possível.
  const houveEliminacao = Object.values(estados).some((e) => e.estado === "eliminado");
  let contrafactual = null;
  if (houveEliminacao) {
    // Sem linhas vermelhas o conjunto de vivos é outro, e com ele muda a
    // classificação dos eixos: reclassificar é parte do "ranking que existiria".
    const estadosCf = avaliar(corpus, respostas, new Set());
    contrafactual = {
      estados: estadosCf,
      ranking: ranking(corpus, estadosCf, margem),
      classes: classificarEixos(corpus, corpus.candidatos),
    };
  }

  // Efeito colateral do §20 que precisa ser dito em voz alta: eliminar candidatos
  // pode deixar um eixo antes divisivo com um lado só, tirando-o do ranking. Se
  // isso zerar o conjunto discriminante, a afinidade some — e sem explicação isso
  // parece defeito.
  const respondeuAlgo = Object.keys(corpus.eixos).some((e) => {
    const r = respostas[e];
    return r !== undefined && r !== "ns" && r !== "indiferente";
  });
  const diagnostico = {
    semEixosDiscriminantes: classes.divisivos.length === 0,
    rankingVazioComRespostas: respondeuAlgo && rk.ordem.length === 0 && vivos.length > 0,
    reclassificados: houveEliminacao
      ? classificarEixos(corpus, corpus.candidatos).divisivos
          .filter((d) => !classes.divisivos.some((x) => x.eixo === d.eixo))
          .map((d) => d.eixo)
      : [],
  };

  // §22, regra 2: contrastes ainda abertos entre dois líderes empatados.
  const lideres = new Set(rk.lideres);
  const ctr = contrastes(corpus, respostas, estados);
  const desempates = ctr.naoInvestigados.filter((t) => t.entre.every((id) => lideres.has(id)));

  return {
    respostas, linhasVermelhas: [...asSet(linhasVermelhas)], margem,
    estados, ranking: rk, classes, diagnostico,
    contrastes: { ...ctr, desempates },
    campo: afinidadeComOCampo(corpus, respostas, classes),
    portoes: Object.fromEntries(
      Object.keys(corpus.portoes || {}).map((k) => [k, respostas[k] ?? null])
    ),
    contrafactual,
    todosEliminados: vivos.length === 0,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Rastro
// ─────────────────────────────────────────────────────────────────────────────

/** Diff entre duas análises: o que a última resposta mudou. */
function transicoes(anterior, atual) {
  const estados = [];
  for (const id of Object.keys(atual.estados)) {
    const de = anterior?.estados?.[id]?.estado ?? null;
    const para = atual.estados[id].estado;
    if (de !== para) estados.push({ id, de, para, motivo: atual.estados[id].motivo });
  }
  const ordemDe = anterior?.ranking?.ordem ?? [];
  const ordemPara = atual.ranking.ordem;
  const lideresDe = anterior?.ranking?.lideres ?? [];
  const lideresPara = atual.ranking.lideres;
  const igual = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  return {
    estados,
    ranking: { de: ordemDe, para: ordemPara, mudou: !igual(ordemDe, ordemPara) },
    lideres: { de: lideresDe, para: lideresPara, mudou: !igual(lideresDe, lideresPara) },
  };
}

function explicarMotivo(corpus, motivo) {
  if (!motivo) return null;
  if (motivo.tipo === "linha-vermelha") {
    const e = corpus.eixos[motivo.eixo];
    const dir = motivo.postura === "favor" ? "é favorável" : "é contrário";
    return `linha vermelha · ${e?.label ?? motivo.eixo} — o plano ${dir} a essa posição`;
  }
  if (motivo.tipo === "portao") {
    // B8 corrigido: o texto vem do portão que disparou, não de uma string fixa.
    const g = corpus.portoes?.[motivo.portao];
    return `portão não atendido · ${g?.nota ?? g?.pergunta ?? motivo.portao}`;
  }
  return `eliminado · ${motivo.tipo}`;
}


/**
 * montarRelatorio() — texto puro, seções fixas, espelhando §27 etapa 7.
 *
 * Esta é a ÚNICA função do projeto com efeito de ambiente: o carimbo de tempo do
 * cabeçalho. Todo o resto vem da análise, que é pura. Passe `meta.geradoEm` para
 * tornar a saída determinística (é o que o executor de perfis faz).
 */

const pct = (x) => (x === null || x === undefined ? "—" : x.toFixed(3));
const cob = (x) => (x === null || x === undefined ? "—" : x.toFixed(2));
const linha = (n = 78) => "─".repeat(n);

function montarRelatorio(corpus, analise, rastro = [], meta = {}) {
  const L = [];
  const nome = (id) => {
    const c = corpus.candidatos.find((x) => x.id === id);
    return c ? `${c.nome}${c.partido ? ` (${c.partido})` : ""}` : id;
  };
  const eixoLabel = (id) => corpus.eixos[id]?.label ?? id;
  const geradoEm = meta.geradoEm ?? new Date().toLocaleString("pt-BR");
  const { estados, ranking: rk, classes, campo, contrastes: ctr, diagnostico } = analise;

  const e = corpus.escopo || {};
  L.push(`COMPARAÇÃO DE PROPOSTAS — ${e.eleicao ?? "?"}, ${e.cargo ?? "?"}, ${e.ambito ?? "?"}`);
  L.push(linha());
  L.push(`Gerado em: ${geradoEm}`);
  L.push(`Corpus: versão ${corpus.corpusVersion} · schema ${corpus.schemaVersion} · status ${corpus.status}`);
  L.push(`Curadoria: ${corpus.curadoria?.responsavel ?? "NÃO IDENTIFICADA"}` +
         (corpus.curadoria?.data ? ` · ${corpus.curadoria.data}` : "") +
         (corpus.curadoria?.revisadoPor ? ` · revisado por ${corpus.curadoria.revisadoPor}` : " · SEM REVISÃO INDEPENDENTE"));
  L.push(`Método de curadoria: ${corpus.curadoria?.metodo ?? "—"}`);
  L.push(`Critério de inclusão: ${corpus.curadoria?.criterioDeInclusao ?? "—"}`);
  if (meta.identificador) L.push(`Identificador da sessão: ${meta.identificador}`);
  L.push("");
  if (corpus.status !== "verified") { L.push(`[ATENÇÃO] ${corpus.aviso}`); L.push(""); }
  for (const lim of corpus.curadoria?.limitacoesConhecidas || []) L.push(`[LIMITAÇÃO] ${lim}`);
  if (corpus.curadoria?.limitacoesConhecidas?.length) L.push("");

  // ── RANKING ───────────────────────────────────────────────────────────────
  L.push("RANKING");
  L.push(linha());
  L.push("Afinidade mede alinhamento NOS PONTOS EM QUE OS CANDIDATOS DIVERGEM entre si —");
  L.push("não é percentual de concordância com o plano. Eixos em que o campo inteiro pensa");
  L.push("igual ficam fora da conta e aparecem em CONSENSO DO CAMPO.");
  L.push("Cobertura é a fração do que você respondeu sobre a qual o candidato se pronunciou.");
  L.push(`Margem de empate: ${rk.margem.toFixed(2)} (parâmetro; candidatos dentro dela são declarados empatados)`);
  L.push("");
  if (!rk.ordem.length) {
    L.push("  Nenhum candidato com afinidade calculável.");
    if (diagnostico?.semEixosDiscriminantes)
      L.push("  Motivo: não há eixo em que os candidatos ainda vivos divirjam entre si.");
    if (analise.todosEliminados) L.push("  Motivo: todos foram eliminados. Ver ELIMINADOS e RANKING CONTRAFACTUAL.");
  }
  for (const [i, id] of rk.ordem.entries()) {
    const s = estados[id];
    const lider = rk.lideres.includes(id);
    const marca = lider ? (rk.empate ? " ⟨líder — empatado⟩" : " ⟨líder⟩") : "";
    L.push(`  ${String(i + 1).padStart(2)}. ${nome(id).padEnd(34)} afinidade ${pct(s.afinidade)}   cobertura ${cob(s.cobertura)}${marca}`);
  }
  if (rk.empate) {
    L.push("");
    L.push(`  EMPATE declarado entre: ${rk.lideres.map(nome).join(" · ")}`);
    L.push("  Não há ordem entre eles. A diferença está dentro da margem, e a margem existe");
    L.push("  porque os pesos dos eixos foram escolhidos à mão e não têm essa precisão.");
  }
  // §18, regra 3 — o líder com cobertura baixa precisa ser denunciado na mesma tela.
  const alertas = [];
  const PROXIMIDADE = 0.25;   // "logo atrás": 5× a margem padrão de empate
  for (const id of rk.lideres) {
    const s = estados[id];
    if (s.cobertura !== null && s.cobertura < 0.7)
      alertas.push(`${nome(id)} lidera com cobertura ${cob(s.cobertura)}: pronunciou-se sobre menos de 70% do peso que você respondeu.`);
    // "quem vem atrás" (§18, regra 3) é quem está logo atrás — não o campo inteiro.
    // Citar alguém com afinidade 0,21 como referência de cobertura é ruído.
    const atras = rk.ordem.filter((x) => !rk.lideres.includes(x))
      .filter((x) => estados[x].afinidade >= s.afinidade - PROXIMIDADE)
      .filter((x) => estados[x].cobertura !== null && s.cobertura !== null && estados[x].cobertura > s.cobertura);
    if (atras.length)
      alertas.push(`${nome(id)} lidera com cobertura menor que ${atras.map(nome).join(", ")}, logo atrás — falou menos e por isso errou menos.`);
  }
  if (alertas.length) {
    L.push("");
    L.push("  [SILÊNCIO — leia antes do ranking]");
    for (const a of alertas) L.push(`  · ${a}`);
  }
  if (rk.semSinal.length) {
    L.push("");
    L.push(`  Sem afinidade calculável (não declararam nada sobre o que você respondeu): ${rk.semSinal.map(nome).join(", ")}`);
    L.push("  Ausência de posição não é zero e não é concordância. Ficam fora da ordem.");
  }
  L.push("");

  // ── POR QUE / DIVERGÊNCIAS / SILÊNCIOS ────────────────────────────────────
  const comCitacao = (id, eixos) => eixos.map((ex) => {
    const c = corpus.candidatos.find((x) => x.id === id);
    const p = c.posicoes.find((q) => q.eixo === ex);
    const out = [`    · ${eixoLabel(ex)} [peso ${corpus.eixos[ex].peso}] — plano ${p.postura === "favor" ? "é favorável" : "é contrário"}`,
                 `      "${p.citacao.texto}"`,
                 `      ${p.citacao.fonte} · ${p.citacao.local}`];
    if (p.citacao.contexto) out.push(`      contexto: ${p.citacao.contexto}`);
    if (p.interpretacao) out.push(`      [INTERPRETAÇÃO DO CURADOR — a postura não é literal na citação] ${p.interpretacao}`);
    return out.join("\n");
  });

  for (const [titulo, chave, nota] of [
    ["POR QUE", "alinhados", "Eixos em que sua posição coincide com a posição declarada no plano."],
    ["DIVERGÊNCIAS", "divergentes", "Eixos em que sua posição contraria a posição declarada no plano."],
  ]) {
    L.push(titulo); L.push(linha()); L.push(nota); L.push("");
    for (const id of [...rk.ordem, ...rk.semSinal]) {
      const s = estados[id];
      if (!s[chave].length) continue;
      L.push(`  ${nome(id)}`);
      L.push(comCitacao(id, s[chave]).join("\n"));
      L.push("");
    }
  }

  L.push("SILÊNCIOS");
  L.push(linha());
  L.push("Eixos que você respondeu e sobre os quais o plano não diz nada. Não somam nem");
  L.push("subtraem — e é exatamente por isso que reduzem a cobertura. Listados nominalmente.");
  L.push("");
  for (const id of [...rk.ordem, ...rk.semSinal]) {
    const s = estados[id];
    if (!s.silencios.length) continue;
    const peso = s.silencios.reduce((n, ex) => n + corpus.eixos[ex].peso, 0);
    L.push(`  ${nome(id)} — ${s.silencios.length} eixo(s), peso ${peso}`);
    for (const ex of s.silencios) L.push(`    · ${eixoLabel(ex)} [peso ${corpus.eixos[ex].peso}]`);
  }
  L.push("");

  // ── ELIMINADOS ────────────────────────────────────────────────────────────
  const eliminados = corpus.candidatos.filter((c) => estados[c.id].estado === "eliminado");
  L.push("ELIMINADOS");
  L.push(linha());
  if (!eliminados.length) L.push("  Nenhum.");
  for (const c of eliminados) {
    const m = estados[c.id].motivo;
    L.push(`  ${nome(c.id)} — ${explicarMotivo(corpus, m)}`);
    if (m.tipo === "linha-vermelha") {
      L.push(`    eixo: ${eixoLabel(m.eixo)} [marcado por você como inegociável]`);
      L.push(`    "${m.citacao.texto}"`);
      L.push(`    ${m.citacao.fonte} · ${m.citacao.local}`);
      if (m.interpretacao) L.push(`    [INTERPRETAÇÃO DO CURADOR] ${m.interpretacao}`);
    }
  }
  if (analise.contrafactual) {
    L.push("");
    L.push("  RANKING CONTRAFACTUAL — a ordem que existiria sem nenhuma linha vermelha:");
    const cf = analise.contrafactual;
    if (!cf.ranking.ordem.length) L.push("    (nenhuma afinidade calculável)");
    for (const [i, id] of cf.ranking.ordem.entries())
      L.push(`    ${String(i + 1).padStart(2)}. ${nome(id).padEnd(34)} afinidade ${pct(cf.estados[id].afinidade)}   cobertura ${cob(cf.estados[id].cobertura)}`);
  }
  L.push("");

  // ── CONSENSO DO CAMPO ─────────────────────────────────────────────────────
  L.push("CONSENSO DO CAMPO");
  L.push(linha());
  L.push("Eixos que NÃO separam ninguém e por isso não entram no ranking — incluí-los");
  L.push("inverteria a ordem em favor de quem falou pouco (§20 da especificação).");
  L.push("");
  L.push(`  Unânimes (todos os vivos declaram a mesma coisa): ${classes.unanimes.length}`);
  for (const u of classes.unanimes)
    L.push(`    · ${eixoLabel(u.eixo)} — ${u.nFalam} candidatos, todos ${u.postura === "favor" ? "a favor" : "contrários"}`);
  L.push(`  Unilaterais (parte declara, ninguém se opõe): ${classes.unilaterais.length}`);
  for (const u of classes.unilaterais)
    L.push(`    · ${eixoLabel(u.eixo)} — ${u.nFalam} ${u.postura === "favor" ? "a favor" : "contrários"}, ${u.mudos} sem dizer nada`);
  if (classes.mudos.length) {
    L.push(`  Sem nenhuma menção: ${classes.mudos.length}`);
    for (const u of classes.mudos) L.push(`    · ${eixoLabel(u.eixo)}`);
  }
  L.push("");
  if (campo.respondidos) {
    L.push(`  AFINIDADE COM O CAMPO: ${pct(campo.afinidade)}   cobertura ${cob(campo.cobertura)}   (${campo.respondidos} de ${campo.total} eixos respondidos)`);
    L.push("  Métrica separada, que NÃO influencia o ranking. Responde outra pergunta:");
    L.push("  não \"quem é mais parecido comigo\", mas \"o quanto este campo eleitoral inteiro");
    L.push("  me representa\". Afinidade com o campo baixa significa que nenhum ranking entre");
    L.push("  estes candidatos conserta o problema.");
    const compTem = [...rk.ordem, ...rk.semSinal].filter((id) => estados[id].complementar.afinidade !== null);
    if (compTem.length) {
      L.push("");
      L.push("  Por candidato, nos eixos não discriminantes (também fora do ranking):");
      for (const id of compTem) {
        const cp = estados[id].complementar;
        L.push(`    ${nome(id).padEnd(34)} afinidade ${pct(cp.afinidade)}   cobertura ${cob(cp.cobertura)}`);
      }
      L.push("  É aqui que candidaturas empatadas nos eixos divisivos se separam.");
    }
  } else {
    L.push("  Nenhum eixo não discriminante foi respondido. A fase complementar é opcional.");
  }
  L.push("");

  // ── NÃO INVESTIGADO ───────────────────────────────────────────────────────
  L.push("NÃO INVESTIGADO");
  L.push(linha());
  L.push("Pares de candidatos vivos e próximos, e a única coisa que os separa — ainda sem");
  L.push("resposta sua. Esta seção é a defesa contra o fechamento prematuro: o instrumento");
  L.push("existe para dizer o que ficou de fora, não só o que fechou.");
  L.push("");
  if (!ctr.naoInvestigados.length) L.push("  Nenhum. Todos os contrastes ativos foram investigados.");
  for (const t of ctr.naoInvestigados) {
    const destaque = ctr.desempates?.some((d) => d.discriminador === t.discriminador && d.entre.join() === t.entre.join());
    L.push(`  ${t.entre.map(nome).join("  vs  ")}${destaque ? "   ⟨DESEMPATARIA A LIDERANÇA⟩" : ""}`);
    L.push(`    discriminador: ${eixoLabel(t.discriminador)} — ${t.motivo}`);
    if (t.nota) L.push(`    ${t.nota}`);
  }
  if (ctr.investigados.length) {
    L.push("");
    L.push("  Investigados:");
    for (const t of ctr.investigados)
      L.push(`    ${t.entre.map(nome).join(" vs ")} · ${eixoLabel(t.discriminador)} = "${t.resposta}" → inclina para ${t.inclina ? nome(t.inclina) : "nenhum lado"}`);
  }
  if (ctr.inativos.length) {
    L.push("");
    L.push(`  Inativos (um dos lados eliminado): ${ctr.inativos.map((t) => t.entre.map(nome).join(" vs ")).join(" · ")}`);
  }
  L.push("");

  // ── PORTÕES ───────────────────────────────────────────────────────────────
  L.push("PORTÕES");
  L.push(linha());
  for (const [id, g] of Object.entries(corpus.portoes || {})) {
    const r = analise.portoes[id];
    L.push(`  ${g.pergunta}`);
    L.push(`    resposta: ${r ?? "[PENDENTE]"}   efeito: ${g.efeito}${g.efeito === "registro" ? " (apenas registro — não altera nenhum estado)" : ""}`);
  }
  L.push("");

  // ── SUAS RESPOSTAS ────────────────────────────────────────────────────────
  L.push("SUAS RESPOSTAS");
  L.push(linha());
  const lv = new Set(analise.linhasVermelhas);
  for (const [id, def] of Object.entries(corpus.eixos)) {
    const r = analise.respostas[id];
    if (r === undefined) continue;
    L.push(`  ${eixoLabel(id)} [peso ${def.peso}]${lv.has(id) ? " [LINHA VERMELHA]" : ""}: ${r}`);
    if (def.formulacaoNeutra === false)
      L.push(`    [REDAÇÃO NÃO NEUTRA] ${def.notaRedacao}`);
  }
  const naoResp = Object.keys(corpus.eixos).filter((id) => analise.respostas[id] === undefined);
  if (naoResp.length) {
    L.push("");

  }
  L.push("");

  // ── RASTRO ────────────────────────────────────────────────────────────────
  L.push("RASTRO DA AVALIAÇÃO");
  L.push(linha());
  L.push("Cada resposta e o que ela mudou. É isto que permite auditar a conclusão depois.");
  L.push("");
  if (!rastro.length) L.push("  (vazio)");
  for (const [i, passo] of rastro.entries()) {
    const q = passo.pergunta;

    const tr = passo.transicoes;

      for (const e2 of tr.estados) L.push(`      ${nome(e2.id)}: ${e2.de} → ${e2.para}${e2.motivo ? ` (${explicarMotivo(corpus, e2.motivo)})` : ""}`);

    if (tr?.lideres?.mudou) L.push(`      líderes: ${tr.lideres.de.join(", ") || "—"}  →  ${tr.lideres.para.join(", ") || "—"}`);
    if (!tr?.estados?.length && !tr?.ranking?.mudou && !tr?.lideres?.mudou) L.push("      (nada mudou no ranking)");
  }
  L.push("");

  // ── PLANOS ────────────────────────────────────────────────────────────────
  L.push("PLANOS DE GOVERNO INTEGRAIS");
  L.push(linha());

  return L.join("\n");
}

/**
 * Interface. Sem framework e sem dependências: o produto é um .html único que
 * funciona por duplo clique, offline, sem requisição externa. Nada do que o
 * usuário responde sai do navegador — as respostas dele são as posições
 * políticas dele, e a única defesa que não depende de confiança é não ter servidor.
 *
 * Todo o estado da tela é derivado de `S.respostas` + `S.linhasVermelhas` por
 * `analisar()`, que é pura. Nada é acumulado — é o que torna trivial voltar e
 * alterar uma resposta (B11).
 */
const CHAVE = "match-presidenciaveis/v1";
const app = document.getElementById("app");

const S = {
  tela: "abertura",
  respostas: {},
  linhasVermelhas: [],
  rastro: [],
  complementar: false,
  margem: 0.05,
  editando: null,
};

// ── util ────────────────────────────────────────────────────────────────────
const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f3 = (x) => (x === null || x === undefined ? "—" : x.toFixed(3));
const f2 = (x) => (x === null || x === undefined ? "—" : x.toFixed(2));
const cand = (id) => CORPUS.candidatos.find((c) => c.id === id);
const nomeDe = (id) => { const c = cand(id); return c ? c.nome + (c.partido ? ` (${c.partido})` : "") : id; };
const eixoDe = (id) => CORPUS.eixos[id]?.label ?? id;
const posturaDe = (id, eixo) => cand(id)?.posicoes.find((p) => p.eixo === eixo) || null;

function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify({ v: 1, corpusVersion: CORPUS.corpusVersion, ...S })); }
  catch { /* modo privado, cota cheia: a sessão continua, só não persiste */ }
}
function carregar() {
  try {
    const raw = localStorage.getItem(CHAVE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.corpusVersion !== CORPUS.corpusVersion) return false;
    Object.assign(S, { tela: d.tela, respostas: d.respostas || {}, linhasVermelhas: d.linhasVermelhas || [],
                       rastro: d.rastro || [], complementar: !!d.complementar, margem: d.margem ?? 0.05 });
    return Object.keys(S.respostas).length > 0;
  } catch { return false; }
}
const analise = () => analisar(CORPUS, S.respostas, new Set(S.linhasVermelhas), { margem: S.margem });
const pergunta = (a) => proximaPergunta(CORPUS, S.respostas, a.estados,
  { complementar: S.complementar, linhasVermelhas: new Set(S.linhasVermelhas), margem: S.margem });

// ── ações ───────────────────────────────────────────────────────────────────
function responder(q, valor, linhaVermelha) {
  const antes = analise();
  const anterior = S.respostas[q.id];
  S.respostas = { ...S.respostas, [q.id]: valor };
  const lv = new Set(S.linhasVermelhas);
  if (linhaVermelha) lv.add(q.id); else lv.delete(q.id);
  S.linhasVermelhas = [...lv];
  const depois = analise();
  // Rastro é append-only: revisar não sobrescreve o registro original (B11).
  S.rastro.push({
    pergunta: { id: q.id, tipo: q.tipo, fase: q.fase, pergunta: q.pergunta, label: q.label },
    resposta: valor, linhaVermelha: !!linhaVermelha,
    revisaoDe: anterior !== undefined ? anterior : null,
    transicoes: transicoes(antes, depois),
  });
  S.editando = null;
  if (!pergunta(depois)) S.tela = "resultado";
  salvar(); render();
}
function editar(eixoId) { S.editando = eixoId; S.tela = "entrevista"; render(); }
function reiniciar() {
  if (!confirm("Isto apaga todas as suas respostas e o rastro. Continuar?")) return;
  Object.assign(S, { tela: "abertura", respostas: {}, linhasVermelhas: [], rastro: [], complementar: false, editando: null });
  try { localStorage.removeItem(CHAVE); } catch {}
  render();
}
function baixar(nome, texto, tipo = "text/plain") {
  const url = URL.createObjectURL(new Blob([texto], { type: `${tipo};charset=utf-8` }));
  const a = document.createElement("a");
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}
function exportarSessao() {
  baixar("sessao-match-presidenciaveis.json",
    JSON.stringify({ v: 1, corpusVersion: CORPUS.corpusVersion, respostas: S.respostas,
                     linhasVermelhas: S.linhasVermelhas, rastro: S.rastro, margem: S.margem }, null, 2),
    "application/json");
}
function importarSessao(arquivo) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (d.corpusVersion !== CORPUS.corpusVersion &&
          !confirm(`Esta sessão foi gravada com o corpus ${d.corpusVersion}; o atual é ${CORPUS.corpusVersion}. Importar mesmo assim?`)) return;
      Object.assign(S, { respostas: d.respostas || {}, linhasVermelhas: d.linhasVermelhas || [],
                         rastro: d.rastro || [], margem: d.margem ?? 0.05, editando: null });
      S.tela = pergunta(analise()) ? "entrevista" : "resultado";
      salvar(); render();
    } catch (e) { alert("Arquivo de sessão inválido: " + e.message); }
  };
  fr.readAsText(arquivo);
}
function exportarRelatorio() {
  baixar("comparacao-de-propostas.txt", montarRelatorio(CORPUS, analise(), S.rastro, {}));
}

function citacaoHTML(p) {
  return `<div class="cit${p.interpretacao ? " inferida" : ""}">
    ${h(p.citacao.texto)}
    <span class="fonte">${h(p.citacao.fonte)} · ${h(p.citacao.local)}${p.citacao.contexto ? ` · ${h(p.citacao.contexto)}` : ""}</span>
    ${p.interpretacao ? `<div class="interp"><b>Interpretação do curador — a postura não está literal nesta citação:</b> ${h(p.interpretacao)}</div>` : ""}
  </div>`;
}

  const push = (id, i) => {
    const s = a.estados[id];
    const lider = a.ranking.lideres.includes(id);
    const morto = s.estado === "eliminado";
    const cobBaixa = s.cobertura !== null && s.cobertura < 0.7;
    linhas.push(`<tr class="${lider ? "lider" : ""} ${morto ? "morto" : ""}">
      <td class="n">${i ?? ""}</td>
      <td>${h(nomeDe(id))}${lider && a.ranking.empate ? ' <span class="selo">empatado</span>' : ""}
        ${morto ? `<div class="mini perigo-cor">${h(explicarMotivo(CORPUS, s.motivo))}</div>` : ""}
        ${!compacta && s.afinidade !== null ? `<div class="barra"><i style="width:${(s.afinidade * 100).toFixed(0)}%"></i></div>` : ""}</td>
      <td class="n">${f3(s.afinidade)}</td>
      <td class="n ${cobBaixa ? "cob-baixa" : ""}">${f2(s.cobertura)}</td>
    </tr>`);
  };
  a.ranking.ordem.forEach((id, i) => push(id, i + 1));
  a.ranking.semSinal.forEach((id) => push(id, "—"));
  CORPUS.candidatos.filter((c) => a.estados[c.id].estado === "eliminado").forEach((c) => push(c.id, "×"));
  return `<table class="rank"><thead><tr><th></th><th>Candidatura</th><th>Afinidade</th><th>Cobertura</th></tr></thead>
    <tbody>${linhas.join("")}</tbody></table>`;
}

const PROXIMIDADE = 0.25;   // "logo atrás": 5× a margem padrão de empate
function alertasSilencio(a) {
  const out = [];
  for (const id of a.ranking.lideres) {
    const s = a.estados[id];
    if (s.cobertura !== null && s.cobertura < 0.7)
      out.push(`<b>${h(nomeDe(id))}</b> lidera com cobertura ${f2(s.cobertura)}: pronunciou-se sobre menos de 70% do peso do que você respondeu.`);
    // "quem vem atrás" é quem está logo atrás — citar alguém com afinidade 0,21
    // como referência de cobertura seria ruído, não informação.
    const atras = a.ranking.ordem.filter((x) => !a.ranking.lideres.includes(x) &&
      a.estados[x].afinidade >= s.afinidade - PROXIMIDADE &&
      a.estados[x].cobertura !== null && s.cobertura !== null && a.estados[x].cobertura > s.cobertura);
    if (atras.length)
      out.push(`<b>${h(nomeDe(id))}</b> lidera com cobertura menor que ${atras.map((x) => h(nomeDe(x))).join(", ")}, logo atrás — falou menos e por isso errou menos.`);
  }
  if (!out.length) return "";
  return `<div class="aviso"><h3>Silêncio — leia antes do ranking</h3>
    <p class="mini">Ausência de posição nunca soma nem subtrai. É por isso que reduz a cobertura, e é por isso que quem fala pouco sobe fácil.</p>
    <ul class="mini">${out.map((x) => `<li>${x}</li>`).join("")}</ul></div>`;
}

     ${cls.divisivos.length} pontos em que elas divergem entre si. No fim, mostra quem está mais
     alinhado a você — <b>e o que ficou sem resposta</b>, que costuma importar mais.</p>

  <div class="aviso perigo">
    <h3>O que este instrumento não é</h3>

    <p>A escolha de quais eixos existem e de qual trecho representa cada candidatura é o maior viés

  <div class="cartao">
    <h2>Como funciona</h2>
    <div class="eixo-linha"><b>Perguntas em ordem de poder de separação.</b> O motor pergunta primeiro
      o eixo que divide o campo ao meio e tem mais peso, não o mais importante em abstrato. Um ponto em que
      todos concordam não separa ninguém e por isso não é perguntado.</div>
    <div class="eixo-linha"><b>Discordar junto conta como concordar.</b> Se você é contra algo e o plano

    <div class="eixo-linha"><b>Não sei ≠ indiferente ≠ não perguntado.</b> Os três são registrados

    <div class="eixo-linha"><b>Nada sai do seu navegador.</b> Não há servidor, não há telemetria, não há

  </div>

  <div class="acoes">
    <button class="primario" data-acao="comecar">${temSessao ? "Continuar de onde parei" : "Começar"}</button>
    ${temSessao ? '<button data-acao="reiniciar">Recomeçar do zero</button>' : ""}
    <button data-acao="importar">Importar sessão</button>

  <p class="mini">Corpus ${h(CORPUS.corpusVersion)} · ${CORPUS.candidatos.length} candidaturas ·

function telaEntrevista() {
  const a = analise();
  const q = S.editando
    ? { tipo: "eixo", id: S.editando, ...CORPUS.eixos[S.editando], revisao: true }
    : pergunta(a);
  if (!q) { S.tela = "resultado"; return telaResultado(); }

  const respondidas = Object.keys(S.respostas).length;
  const divisivosAbertos = a.classes.divisivos.filter((d) => S.respostas[d.eixo] === undefined).length;
  const jaLV = S.linhasVermelhas.includes(q.id);

  let porque = "";
  if (q.tipo === "eixo" && q.fase === 1) {
    const favor = CORPUS.candidatos.filter((c) => a.estados[c.id].estado === "vivo" && posturaDe(c.id, q.id)?.postura === "favor");
    const contra = CORPUS.candidatos.filter((c) => a.estados[c.id].estado === "vivo" && posturaDe(c.id, q.id)?.postura === "contra");
    porque = `<div class="porque">
      Perguntado agora porque separa <b>${q.separa.favor} × ${q.separa.contra}</b> candidaturas

      <br><b class="ok-cor">A favor:</b> ${favor.map((c) => h(c.nome)).join(", ") || "—"}
      <br><b class="perigo-cor">Contra:</b> ${contra.map((c) => h(c.nome)).join(", ") || "—"}
      ${q.entreLideres ? `<br><span class="selo destaque">desempata a liderança</span> É a única coisa que separa
        ${q.desempata.map((x) => h(nomeDe(x))).join(" e ")}, hoje empatados.` : ""}
    </div>`;
  } else if (q.tipo === "eixo" && q.fase === 4) {
    porque = `<div class="porque"><span class="selo comp">não separa ninguém</span>
      ${q.categoria === "unanime"
        ? `Todas as candidaturas vivas declaram a mesma posição aqui.`
        : `${q.campo.nFalam} candidatura(s) se pronunciam, ${q.campo.mudos} não dizem nada — e nenhuma se opõe.`}
      Responder <b>não altera o ranking</b> (incluir isto inverteria a ordem em favor de quem falou pouco).
      Vai para uma métrica separada: o quanto este campo eleitoral inteiro representa você.
      Faltam ${q.restantes} perguntas desta fase; você pode parar quando quiser.</div>`;
  } else if (q.tipo === "portao") {
    porque = `<div class="porque"><span class="selo">portão</span> ${h(q.nota || "")}</div>`;
  } else if (q.revisao) {
    porque = `<div class="porque">Você está <b>revisando</b> uma resposta já dada
      (${h(S.respostas[q.id])}). O registro original fica no rastro; a alteração é anexada, não sobrescrita.</div>`;
  }

  const podeLV = q.tipo === "eixo";
  return `
  <div class="painel">
    <div>
      <div class="cartao">
        <span class="selo">${q.tipo === "portao" ? "Portão" : `Eixo · ${h(q.dominio || "")}`}</span>
        ${q.fase === 4 ? '<span class="selo comp">fase complementar</span>' : ""}
        <div class="pergunta">${h(q.pergunta)}</div>
        ${q.formulacaoNeutra === false ? `<div class="aviso"><h3>Redação não neutra</h3><p class="mini">${h(q.notaRedacao)}</p></div>` : ""}
        ${porque}
        <div class="respostas" data-q="${h(q.id)}">
          ${q.tipo === "portao"
            ? `<button data-v="sim"><b>Sim</b></button><button data-v="nao"><b>Não</b></button>`
            : `<button data-v="concordo"><b>Concordo</b><i>Sou a favor desta política</i></button>
               <button data-v="discordo"><b>Discordo</b><i>Sou contra esta política</i></button>
               <button data-v="indiferente"><b>Indiferente</b><i>Não quero que este ponto pese</i></button>
               <button data-v="ns"><b>Não sei</b><i>Não tenho posição formada; fica registrado como pendência</i></button>`}
        </div>
        ${podeLV ? `<div class="lv ${jaLV ? "ativa" : ""}">
          <label><input type="checkbox" id="lv" ${jaLV ? "checked" : ""}>
            <span><b>Isto é inegociável para mim.</b> Não é "peso alto": qualquer candidatura que
            divirja aqui é <b>eliminada</b> da comparação, por mais que concorde com você no resto.
            Reversível a qualquer momento.</span></label>
        </div>` : ""}
        ${S.editando ? '<div class="acoes"><button data-acao="cancelar-edicao">Cancelar revisão</button></div>' : ""}
      </div>

      ${a.diagnostico.rankingVazioComRespostas ? `<div class="aviso"><h3>O ranking está vazio — e isso tem explicação</h3>
        <p class="mini">${a.diagnostico.semEixosDiscriminantes
          ? "Não sobrou nenhum eixo em que as candidaturas ainda vivas divirjam entre si."
          : "Nenhuma candidatura viva declarou posição sobre o que você respondeu."}
        ${a.diagnostico.reclassificados.length ? `Depois das eliminações, ${a.diagnostico.reclassificados.map((e) => h(eixoDe(e))).join(", ")}
          passaram a ter um lado só e saíram da conta.` : ""}</p></div>` : ""}

      <div class="cartao">
        <h2>Rastro</h2>
        <p class="mini">${respondidas} resposta(s). Clique para revisar — o registro original é preservado.</p>
        <ul class="rastro">${S.rastro.map((p, i) => `<li>
          <b class="mini">${i + 1}</b>
          <span>${h(p.pergunta.label || p.pergunta.pergunta)}${p.revisaoDe ? ' <span class="selo">revisão</span>' : ""}
            ${p.transicoes.ranking.mudou ? `<div class="mini">liderança: ${(p.transicoes.lideres.para.map(nomeDe).join(", ")) || "—"}</div>` : ""}
            ${p.transicoes.estados.length ? `<div class="mini perigo-cor">${p.transicoes.estados.map((e) => `${h(nomeDe(e.id))}: ${e.de}→${e.para}`).join(" · ")}</div>` : ""}
          </span>
          <span class="r">${h(p.resposta)}</span>
          ${p.pergunta.tipo === "eixo" ? `<button class="fantasma" data-editar="${h(p.pergunta.id)}">revisar</button>` : ""}
        </li>`).join("") || '<li class="mini">Nada respondido ainda.</li>'}</ul>
      </div>
    </div>

    <div>
      <div class="cartao">
        <h2>Estado das candidaturas</h2>
        <p class="mini">Afinidade e cobertura andam sempre juntas. Afinidade sem cobertura mente.</p>
        ${tabelaRanking(a, true)}
        <p class="mini" style="margin-top:.6rem">${divisivosAbertos} eixo(s) divisivo(s) ainda em aberto.
        Margem de empate ${S.margem.toFixed(2)}.</p>
      </div>
      ${S.linhasVermelhas.length ? `<div class="cartao">
        <h2 class="perigo-cor">Linhas vermelhas</h2>
        ${S.linhasVermelhas.map((e) => `<div class="eixo-linha"><b>${h(eixoDe(e))}</b>
          <button class="fantasma" data-remover-lv="${h(e)}">remover</button></div>`).join("")}
      </div>` : ""}
      <div class="cartao">
        <h2>Sessão</h2>
        <div class="acoes">
          <button data-acao="resultado">Ver resultado agora</button>
          <button data-acao="exportar-sessao">Exportar</button>
          <button data-acao="reiniciar">Recomeçar</button>
        </div>
        <p class="mini">Salvo neste aparelho, em <code>localStorage</code>. Nada é enviado a lugar nenhum.</p>
      </div>
    </div>
  </div>`;
}

function blocoEixos(a, id, chave, titulo) {
  const s = a.estados[id];
  if (!s[chave].length) return "";
  return `<details><summary>${titulo} (${s[chave].length})</summary><div class="corpo">
    ${s[chave].map((e) => {
      const p = posturaDe(id, e);
      return `<div class="eixo-linha"><b>${h(eixoDe(e))}</b>
        <span class="tag">peso ${CORPUS.eixos[e].peso} · o plano é ${p.postura === "favor" ? "favorável" : "contrário"} · você respondeu "${h(a.respostas[e])}"</span>
        ${citacaoHTML(p)}</div>`;
    }).join("")}</div></details>`;
}

      <div class="metrica">

        <div><b class="${a.estados[id].cobertura < 0.7 ? "cob-baixa" : ""}">${f2(a.estados[id].cobertura)}</b><small>cobertura</small></div>

      <b>${a.diagnostico.reclassificados.map((e) => h(eixoDe(e))).join(", ")}</b>.

  </div>` : ""}

  <div class="cartao">

    <p class="mini"><b>Afinidade</b> mede alinhamento <b>nos pontos em que as candidaturas divergem entre si</b> —

    ${tabelaRanking(a, false)}

       ${a.estados[id].inconclusivos.length ? `<p class="mini">Você respondeu "não sei" em

  <h2>Consenso do campo</h2>

      <div><b>${f2(a.campo.cobertura)}</b><small>cobertura</small></div>
    </div>
    <p class="mini">Outra pergunta, outro número: não "quem é mais parecido comigo", mas "o quanto este campo
       eleitoral inteiro me representa". ${a.campo.respondidos} de ${a.campo.total} eixos respondidos.
       Afinidade com o campo baixa significa que nenhum ranking entre estas candidaturas conserta o problema.</p>
    ${[...a.ranking.ordem].filter((id) => a.estados[id].complementar.afinidade !== null).length ? `
      <p class="mini"><b>Por candidatura, fora do ranking</b> — é aqui que candidaturas empatadas nos eixos
      divisivos se separam:</p>
      <table class="rank"><tbody>${a.ranking.ordem.filter((id) => a.estados[id].complementar.afinidade !== null)
        .map((id) => `<tr><td>${h(nomeDe(id))}</td>
          <td class="n">${f3(a.estados[id].complementar.afinidade)}</td>
          <td class="n">${f2(a.estados[id].complementar.cobertura)}</td></tr>`).join("")}</tbody></table>` : ""}
  </div>` : `<div class="aviso"><h3>Fase complementar não respondida</h3>
    <p class="mini">Há ${compPend} eixo(s) em que o campo fala com uma voz só ou em que ninguém se opõe.
    Eles não afetam o ranking, mas respondem uma pergunta diferente — e são o que separa candidaturas
    que hoje estão empatadas.</p>
    <button class="primario" data-acao="complementar">Responder a fase complementar (${compPend} perguntas)</button></div>`}

  <details><summary>Unânimes (${a.classes.unanimes.length}) e unilaterais (${a.classes.unilaterais.length})</summary>
    <div class="corpo">
      ${a.classes.unanimes.map((u) => `<div class="eixo-linha"><b>${h(eixoDe(u.eixo))}</b>
        <span class="tag">todas as ${u.nFalam} candidaturas vivas são ${u.postura === "favor" ? "a favor" : "contrárias"}</span></div>`).join("")}
      ${a.classes.unilaterais.map((u) => `<div class="eixo-linha"><b>${h(eixoDe(u.eixo))}</b>
        <span class="tag">${u.nFalam} ${u.postura === "favor" ? "a favor" : "contrárias"}, ${u.mudos} não dizem nada — e ninguém se opõe</span></div>`).join("")}
    </div></details>

  <h2>Não investigado</h2>
  <p class="mini">Pares de candidaturas próximas e a única coisa que as separa, ainda sem resposta sua.
     Esta seção é a defesa contra o fechamento prematuro: o instrumento existe tanto para dizer o que ficou
     de fora quanto para dizer o que fechou.</p>
  ${a.contrastes.naoInvestigados.length ? a.contrastes.naoInvestigados.map((t) => {
    const desempata = a.contrastes.desempates.some((d) => d.entre.join() === t.entre.join());
    return `<div class="cartao"><h3>${t.entre.map((x) => h(nomeDe(x))).join("  vs  ")}
      ${desempata ? '<span class="selo destaque">desempataria a liderança</span>' : ""}</h3>
      <p class="mini"><b>${h(eixoDe(t.discriminador))}</b> — ${h(t.motivo)}</p>
      ${t.nota ? `<p class="mini">${h(t.nota)}</p>` : ""}
      <button data-editar="${h(t.discriminador)}">Responder este eixo</button></div>`;
  }).join("") : '<p class="mini">Nenhum. Todos os contrastes ativos foram investigados.</p>'}
  ${a.contrastes.investigados.length ? `<details><summary>Investigados (${a.contrastes.investigados.length})</summary>
    <div class="corpo">${a.contrastes.investigados.map((t) => `<div class="eixo-linha">
      ${t.entre.map((x) => h(nomeDe(x))).join(" vs ")} — <b>${h(eixoDe(t.discriminador))}</b> =
      "${h(t.resposta)}" → inclina para <b>${t.inclina ? h(nomeDe(t.inclina)) : "nenhum lado"}</b></div>`).join("")}</div></details>` : ""}

  <h2>Planos de governo integrais</h2>
  <p class="mini">As citações deste instrumento são resumos. Os documentos abaixo prevalecem sobre qualquer
     coisa dita aqui — se você chegou a uma conclusão, o passo seguinte é ler o plano inteiro.</p>
  <table class="planos"><tbody>${CORPUS.candidatos.map((c) => `<tr>
    <td>${h(c.nome)}${c.partido ? ` <span class="tag">${h(c.partido)}</span>` : ""}</td>
    <td>${c.planoUrl ? `<a href="${h(c.planoUrl)}" target="_blank" rel="noopener noreferrer">${h(c.planoUrl)}</a>` : "—"}</td>
  </tr>`).join("")}</tbody></table>

  <div class="acoes">
    ${q ? '<button class="primario" data-acao="continuar">Continuar respondendo</button>' : ""}
    <button data-acao="relatorio">Baixar relatório completo (.txt)</button>
    <button data-acao="exportar-sessao">Exportar sessão (.json)</button>
    <button data-acao="ver-relatorio">Ver relatório na tela</button>
    <button data-acao="reiniciar">Recomeçar</button>
  </div>
  <pre class="relatorio oculto" id="rel"></pre>

  <div class="aviso"><h3>Curadoria</h3>
    <p class="mini"><b>Método:</b> ${h(CORPUS.curadoria.metodo)}</p>
    <p class="mini"><b>Critério de inclusão:</b> ${h(CORPUS.curadoria.criterioDeInclusao)}</p>
    <p class="mini"><b>Responsável:</b> ${h(CORPUS.curadoria.responsavel || "não identificado")} ·
       <b>Revisão independente:</b> ${h(CORPUS.curadoria.revisadoPor || "nenhuma")}</p>
    <ul class="mini">${(CORPUS.curadoria.limitacoesConhecidas || []).map((x) => `<li>${h(x)}</li>`).join("")}</ul>
  </div>`;
}

// ── render + eventos ────────────────────────────────────────────────────────
function render() {
  document.getElementById("topo-escopo").textContent =
    `${CORPUS.escopo.eleicao} · ${CORPUS.escopo.cargo}`;
  document.getElementById("topo-versao").textContent =
    `corpus ${CORPUS.corpusVersion} · ${CORPUS.status}`;
  app.innerHTML = S.tela === "abertura" ? telaAbertura()
                : S.tela === "resultado" ? telaResultado()
                : telaEntrevista();
  window.scrollTo({ top: 0 });
}

app.addEventListener("click", (ev) => {
  const alvo = ev.target.closest("[data-acao], [data-v], [data-editar], [data-remover-lv]");
  if (!alvo) return;
  if (alvo.dataset.v !== undefined) {
    const q = S.editando
      ? { tipo: "eixo", id: S.editando, ...CORPUS.eixos[S.editando] }
      : pergunta(analise());
    if (q) responder(q, alvo.dataset.v, document.getElementById("lv")?.checked);
    return;
  }
  if (alvo.dataset.editar) return editar(alvo.dataset.editar);
  if (alvo.dataset.removerLv) {
    S.linhasVermelhas = S.linhasVermelhas.filter((x) => x !== alvo.dataset.removerLv);
    salvar(); render(); return;
  }
  switch (alvo.dataset.acao) {
    case "comecar": case "continuar": S.tela = "entrevista"; salvar(); render(); break;
    case "resultado": S.tela = "resultado"; salvar(); render(); break;
    case "cancelar-edicao": S.editando = null; render(); break;
    case "complementar": S.complementar = true; S.tela = "entrevista"; salvar(); render(); break;
    case "reiniciar": reiniciar(); break;
    case "exportar-sessao": exportarSessao(); break;
    case "relatorio": exportarRelatorio(); break;
    case "ver-relatorio": {
      const el = document.getElementById("rel");
      el.textContent = montarRelatorio(CORPUS, analise(), S.rastro, {});
      el.classList.toggle("oculto");
      break;
    }
    case "importar": {
      const inp = document.getElementById("arq");
      inp.onchange = () => inp.files[0] && importarSessao(inp.files[0]);
      inp.click(); break;
    }
  }
});

if (carregar()) S.tela = S.tela === "abertura" ? "abertura" : S.tela;
render();

</script>
</body>
</html>
